scene('ex_census_end','safezone','A Name on Every Cot',38.3,[
 'At the canteen, an old man writes his daughter’s name on the back of a ration slip and pins it to her cot.',
 '“Just in case the sky takes it again,” he says. You glance at your own hands. You recognize the handwriting in the vanished file, but not the memory that made it.'
],[ch('Return to the second-day plans.','midday','The shelter has new records—and new risks.',{flags:{censusResolved:true}})],{art:'safezone'});
scene('ex_ferry','city','The Ferry That Refused to Sink',37.1,[
 'The river has flooded the old industrial piers. A small ferry keeps making the crossing even though the blue navigation arrows now point straight down.',
 'Its captain, Ada Rhee, has thirty civilians on board and another seventy stranded beside an overturned fuel tanker. Across the water, the gate siren is starting.',
 'A dark shape moves below the boat, pacing the propeller like a curious shark.'
],[
 ch('Lead a risky rescue of everyone on the far bank.','ex_ferry_end','Spend fuel and safety to bring more people home.',{camp:{population:70,food:-2,hope:3},score:{trust:3,zone:2},flags:{ferryRescue:true},faction:{shelter:2}},{battle:'hound',win:'ex_ferry_end',flee:'ex_ferry_end'}),
 ch('Use the vessel to establish a protected evacuation route.','ex_ferry_end','Build a repeatable passage for thousands.',{camp:{transport:3,defense:1},score:{zone:2},flags:{riverRoute:true},faction:{wardens:2}}),
 ch('Ask Ada about the creature beneath the water.','ex_ferry_end','She says it is protecting something under the river.',{camp:{signal:2,danger:-1},flags:{riverWitness:true,threeWords:true},faction:{ghosts:2}})
],{art:'city'});
scene('ex_ferry_end','safezone','The Far Bank',38.3,[
 'Ada ties her ferry at the makeshift dock and hands you the bell from its bridge. She looks toward the water as if expecting the river itself to answer.',
 'The people walking ashore are soaked, shivering and alive. That is enough for the next hour.'
],[ch('Return to Haven-12 operations.','midday','The river will not be the same again.',{flags:{ferryResolved:true}})],{art:'safezone'});
scene('ex_recorder','anomaly','The Black Box That Fell Upward',37.1,[
 'The object buried in the old astronomy center is not a meteor. It is an aircraft recorder, blackened and stamped with a manufacturing date thirty years in the future.',
 'Inside its cracked case, the last transmission is your own voice: “If I forget again, tell them the monsters are running from the same thing we are.”',
 'Behind the observatory glass, a Harrower hangs in the air like a hooked question mark. It is waiting for the recording to finish.'
],[
 ch('Play the full recording over emergency radio.','ex_recorder_end','Truth may cause panic, but secrecy already has.',{camp:{signal:3,hope:1,danger:2},flags:{truthBroadcast:true,echoEvidence:true},faction:{ghosts:2}},{battle:'harrower',win:'ex_recorder_end',flee:'ex_recorder_end'}),

],{art:'anomaly'});
scene('ex_recorder_end','anomaly','The Last Second of Tape',38.4,[
 'The recorder clicks once. There is no more tape and no more voice. Above the observatory, the enormous ring turns a fraction in the wrong direction.',
 'For an instant the System writes a sentence across the sky, then deletes it before anyone else can read: THE FIRST FALL WAS NOT THE FIRST ATTEMPT.'
],[ch('Return to the evacuation-zone briefing.','midday','You carry a changed understanding of the Fall.',{flags:{recorderResolved:true}})],{art:'anomaly'});

 vanguard:{name:'The Last Gate',place:'safezone',hour:53,art:'safezone',intro:['Mara takes you to the demolished south gate. Twenty volunteer defenders have stayed because the evacuation transports cannot leave without them.','A Sentinel commander offers to open the road if you identify five volunteers for “high-probability loss.” The survivors have heard the offer and are looking at you.'],choices:[['Refuse the quota and lead the shield wall.','vanguard_c', {camp:{defense:3,hope:2,population:20},score:{trust:2},flags:{vanguardOath:true}}],['Challenge the Sentinel alone to buy time.','vanguard_c',{camp:{defense:2,danger:-1},flags:{vanguardDuel:true}},'sentinel'],['Accept the quota and fortify a narrow retreat.','vanguard_c',{camp:{defense:4,hope:-3},score:{corruption:1},flags:{vanguardBurden:true}}]],end:['When the dust settles, Mara gives you a bent shield bearing twenty scratch marks. “Not a medal,” she says. “A promise.”','Your awakened class shifts beneath your skin. It feels less like a label and more like a decision you can keep making.']},
 channeler:{name:'The Sky is a Circuit',place:'anomaly',hour:53,art:'anomaly',intro:['Above the old power station a lightning storm remains perfectly still. Every bolt runs backward into a point that seems impossibly far away.','The System offers to let you channel the storm through living people. Tomas offers a rough, dangerous alternative using abandoned conductors. Kestrel, if it knows you, begs you to listen before touching either.'],choices:[['Ground the storm through the dead substation.','channeler_c',{camp:{signal:3,defense:1},flags:{channelerGrounded:true}}],['Take the power directly into your class core.','channeler_c',{score:{corruption:2,focus:3},camp:{danger:1,signal:4},flags:{channelerAscendant:true}},'harrower'],['Listen to the thunder as if it is trying to speak.','channeler_c',{camp:{hope:1,signal:2},flags:{channelerWitness:true,threeWords:true}}]],end:['The storm finally moves. For the first time since the Fall, the clouds obey the wind instead of the System.','Blue fire crawls along your fingers and settles in the shape of an oath you did not need anyone to write.']},
 shade:{name:'The House Without Doors',place:'vault',hour:53,art:'vault',intro:['Eli reveals a street map with one building erased. Its occupants still appear in family photographs, but their apartment doors lead into empty brick.','Inside you find a corridor lined with photos taken tomorrow. Each one shows you stealing a key from a person you have not met. The final picture shows you holding the same key while somebody else disappears.'],choices:[['Open each erased doorway and guide its occupants home.','shade_c',{camp:{population:22,hope:2},score:{trust:2},flags:{shadeLiberator:true}}],['Steal the master access key before the corridor resets.','shade_c',{camp:{signal:2},flags:{shadeKey:true,spireBypass:true}}],['Leave a false version of yourself inside the loop.','shade_c',{camp:{danger:-2},flags:{shadeDouble:true,unindexed:true},score:{corruption:1}}]],end:['You step out into the same street. The building has doors again, but the shortest route home is now a passage only you can see.','The System assigns your class a new designation. You erase it with one silent thought.']},
 lifekeeper:{name:'A Cure is a Choice',place:'safezone',hour:53,art:'safezone',intro:['Imani shows you forty patients infected with a silver fever. The System calls them “resource recovery candidates” and offers enough medicine to cure only ten.','Dr. Saira has a theory: your power may be able to distribute the dose across the entire ward. It might also drain every reserve you have left. One of the patients takes your hand.'],choices:[['Share the medicine and link every heartbeat.','lifekeeper_c',{camp:{population:40,hope:4,food:-2},score:{trust:3},flags:{keeperMercy:true}}],['Save the ten most critical patients first.','lifekeeper_c',{camp:{population:10,hope:1},score:{zone:1},flags:{keeperTriage:true}}],['Extract the fever’s strange signature for research.','lifekeeper_c',{camp:{signal:3,population:-8},flags:{keeperAntidote:true,echoEvidence:true}}]],end:['The ward falls quiet. Then someone starts singing to a patient who cannot sleep. No celestial screen tells you whether you made the right decision.','Your class responds anyway. A new pulse moves through your hands, ready for the people who have not yet been brought inside.']},
 architect:{name:'The City You Could Build',place:'metro',hour:53,art:'metro',intro:['Tomas has found the municipal core: a maintenance computer that can redirect the grid, the train switchers and the evacuation bridges at once.','It lacks only one component—the little black box currently keeping the Spire’s defensive lights on. Tomas asks whether you intend to build a tool for everyone or a machine that only you can command.'],choices:[['Publish the designs for independent neighborhood power.','architect_c',{camp:{signal:2,defense:2,hope:2},flags:{architectCommons:true},score:{trust:2}}],['Create a private command interface for Haven-12.','architect_c',{camp:{defense:4,signal:1,hope:-1},flags:{architectControl:true,coreAuthority:true}}],['Reverse the core and sever its connection to the Spire.','architect_c',{camp:{danger:-2,signal:2},flags:{architectBreak:true,coreSabotage:true}},'sentinel']],end:['A screen in the repair shop prints a plan in a language Tomas does not know. He understands it anyway.','“Well,” he says, wiping his hands, “the end of the world just got a better electrician.”']},
 beastbound:{name:'Names for the Hunted',place:'wilds',hour:53,art:'wilds',intro:['The wilderness has grown through the eastern motorway. A pack of Hollow Hounds surrounds an injured creature the System calls an “unrecoverable specimen.”','Through your class bond you feel terror, not aggression. The creature is guarding a nest filled with blue seeds. Above it, the System offers a bounty for every living thing you remove.'],choices:[['Shield the nest and speak to the pack.','beastbound_c',{camp:{danger:-3,hope:2},score:{trust:2},flags:{beastTruce:true,firstContactReady:true}}],['Lead the creatures away from the human settlements.','beastbound_c',{camp:{defense:3,danger:-1},flags:{beastMigration:true}},'hound'],['Harvest the seeds to empower your class.','beastbound_c',{camp:{signal:2,danger:2},score:{corruption:1},flags:{beastSeed:true}}]],end:['One of the hounds touches its muzzle to your hand. For a moment, the sounds of the city and forest become part of the same language.','The System tries to register a new pet. You reject the form. Neither of you belongs to the other.']}

// SYSTEMFALL: DAY ONE — THE THREE-DAY SURVIVAL CHRONICLES
// Twelve major multi-scene routes spanning the full 72-hour campaign.
const CHRONICLE_ROUTES={
 red:{name:'THE RED ROAD',icon:'▱',tagline:'Rescue corridors, railways, and the final convoy',ending:'lanterns'},
 care:{name:'THE LAST WARD',icon:'✚',tagline:'Triage, patients, medicine, and personhood',ending:'everyname'},

};

 if(kind==='pragmatic')return {score:{zone:3,scrap:2},camp:{defense:1,danger:1},faction:factions};
 if(kind==='risk')return {score:{trust:1,focus:-1},camp:{population:11,hope:1},flags:{[base+'_risk']:true}};
 if(kind==='clever')return {score:{scrap:2,zone:1},camp:{signal:route==='wire'?2:0,transport:route==='red'?1:0},flags:{[base+'_clever']:true}};
 if(kind==='mercy')return {score:{trust:3,zone:1},camp:{hope:2,population:12},flags:{[base+'_mercy']:true}};
 return {score:{zone:3,trust:-1},camp:{defense:1,transport:route==='red'?1:0},flags:{[base+'_steel']:true}};
};
function registerChronicles(){
 for(const cfg of CHRONICLE_OPS){
  const {route,day,art,title,entry,a,b,pivot,c,d,reveal,e,f,exit,echo}=cfg;
  const bId=`chron_${route}_${day}`,hours=day===1?[13.4,15.1,17,18.5,20.2,21.4,22.5]:day===2?[24.3,27.7,30.5,35.4,40,43.5,46.2]:[52.4,54.9,57.2,59.4,62,63.4,65.1];
  const next={1:'dawn',2:'night_two',3:'final_prep'}[day];
  const P=s=>String(s).split('||').map(x=>x.trim());
  scene(bId+'_entry',art,title,hours[0],[...P(entry), ...(day>1?[s=>s.flags[`chron_${route}_${day-1}_complete`]?'You have already lived through the previous chapter of this route. People recognize your decisions, and the team trusts the skills you earned together.':'You did not follow this campaign yesterday. Its survivors welcome your help, but you will need to earn their trust amid the damage already done.']:[])],[
   ch(a.label,bId+'_a',a.desc,{...chronFX(route,'people',bId),flags:{[bId+'_a']:true}}),
   ch(b.label,bId+'_b',b.desc,{...chronFX(route,'pragmatic',bId),flags:{[bId+'_b']:true}}),
   ch('ECHO: Recognize the witness concealed in the scene.',bId+'_echo','A choice your first life could never show you.',{score:{focus:2},flags:{[bId+'_echo']:true,ghostTrace:true}},{echo:true,when:(s,m)=>m.clears>=1})
  ],{art,notice:`CHRONICLE ${day}/3 · ${CHRONICLE_ROUTES[route].name}`});
  scene(bId+'_a',art,a.title,hours[1],P(a.body),[
   ch('Carry the consequences into the next operation.',bId+'_pivot','You cannot undo what you chose.',{flags:{[bId+'_a_result']:true}})
  ],{art});
  scene(bId+'_b',art,b.title,hours[1],P(b.body),[
   ch('Carry the consequences into the next operation.',bId+'_pivot','A quicker solution leaves a different cost.',{flags:{[bId+'_b_result']:true}})
  ],{art});
  scene(bId+'_echo','vault','The Impossible Witness',hours[1],P(echo),[
   ch('Carry the anomaly forward without alerting the System.',bId+'_pivot','You hear a second heartbeat beneath the countdown.',{flags:{[bId+'_echo_result']:true},faction:{ghosts:2}})
  ],{art:'vault',notice:'ECHO CHRONICLE · AN UNRECORDED POSSIBILITY'});
  scene(bId+'_pivot',art,pivot.title,hours[2],[...P(pivot.body),s=>s.flags[bId+'_a_result']?pivot.rememberA:s.flags[bId+'_b_result']?pivot.rememberB:'A strange memory tells you that another path exists, though the world insists this is your first time here.'],[
   ch(c.label,bId+'_c',c.desc,{...chronFX(route,'risk',bId),flags:{[bId+'_c']:true,[bId+'_risk']:true}}),
   ch(d.label,bId+'_d',d.desc,{...chronFX(route,'clever',bId),flags:{[bId+'_d']:true,[bId+'_clever']:true}})
  ],{art});
  if(day>1){SCENES[bId+'_pivot'].choices.push(ch(
   `CONTINUITY: Apply what you learned on Day ${day-1}.`,bId+'_d',
   'A new strategy only available because you completed this same campaign yesterday.',
   {score:{zone:2,trust:1},camp:{hope:1},flags:{[bId+'_continuity']:true}},
   {when:s=>!!s.flags[`chron_${route}_${day-1}_complete`]}
  ));}
  const specialist={red:['shade','architect'],care:['lifekeeper'],wire:['channeler','architect'],wall:['vanguard','beastbound']}[route];
  SCENES[bId+'_pivot'].choices.push(ch(
    'CLASS TECHNIQUE: Use your specialization to seize the initiative.',bId+'_d',
    'A different answer made possible by your chosen class.',
    {score:{focus:2,zone:1},flags:{[bId+'_specialist']:true}},
    {when:s=>specialist.includes(s.classId)}
  ));
  if((route==='wall'&&day>=2)||(route==='red'&&day===3)||(route==='wire'&&day===3)||(route==='care'&&day===3)){const threat={wall:'siegeengine',red:'convoystalker',wire:'archivist',care:'triageunit'}[route];Object.assign(SCENES[bId+'_pivot'].choices[0],{battle:threat,win:bId+'_c',flee:bId+'_d'});}
  scene(bId+'_c',art,c.title,hours[3],P(c.body),[ch('Push forward to the last crisis.',bId+'_reveal','The people behind you need an answer.',{flags:{[bId+'_c_result']:true}})],{art});
  scene(bId+'_d',art,d.title,hours[3],P(d.body),[ch('Push forward to the last crisis.',bId+'_reveal','You have bought time, but not safety.',{flags:{[bId+'_d_result']:true}})],{art});
  scene(bId+'_reveal',art,reveal.title,hours[4],[...P(reveal.body),s=>s.flags[bId+'_c_result']?reveal.rememberC:reveal.rememberD],[
   ch(e.label,bId+'_e',e.desc,{...chronFX(route,'mercy',bId),flags:{[bId+'_e']:true}}),
   ch(f.label,bId+'_f',f.desc,{...chronFX(route,'steel',bId),flags:{[bId+'_f']:true}})
  ],{art,notice:'DEFINING DECISION · ITS EFFECT MAY RETURN AT HOUR 72'});
  scene(bId+'_e',art,e.title,hours[5],P(e.body),[ch('See how the decision changes the people around you.',bId+'_out','One operation ends. The city continues.',{flags:{[bId+'_e_result']:true}})],{art});
  scene(bId+'_f',art,f.title,hours[5],P(f.body),[ch('See how the decision changes the people around you.',bId+'_out','One operation ends. The city continues.',{flags:{[bId+'_f_result']:true}})],{art});
  scene(bId+'_out','safezone',exit.title,hours[6],[...P(exit.body),s=>s.flags[bId+'_e_result']?exit.rememberE:exit.rememberF],[
   ch(day===3?'Return to Haven-12 for Hour 72.':day===2?'Return for the second-night alarm.':'Return before the first sunrise.',next,exit.desc||'The next day will remember what happened here.',{flags:{['chron_'+route+'_'+day+'_complete']:true,['chron_last_route']:route},xp:25,score:{zone:1,trust:1}})
  ],{art:'safezone',notice:`CHRONICLE COMPLETED · ${CHRONICLE_ROUTES[route].name} / DAY ${day}`});
 }
 const chapters=[{id:'checkpoint',day:1},{id:'dawn',day:2},{id:'day_three',day:3}];
 for(const c of chapters){
  for(const [key,r] of Object.entries(CHRONICLE_ROUTES)){
   const prior=c.day>1?'chron_'+key+'_'+(c.day-1)+'_complete':null;
   SCENES[c.id].choices.push(ch(
    `DEEP CAMPAIGN: ${r.name} — Day ${c.day}`,
    `chron_${key}_${c.day}_entry`,
    `${r.tagline}${prior?' · Previous chapter decisions carry forward':''}.`,
    {flags:{['chron_day_'+c.day+'_choice']:key}},
    {when:s=>!s.flags['chron_day_'+c.day+'_choice']}
   ));
  }
 }
}
// DAY ONE — FOUR ALTERNATIVE FIRST-NIGHT CAMPAIGNS.
chron('red',1,{art:'city',title:'The Red Road: No One Rides Alone',
 entry:`At Haven-12, a radio operator has a list of six stranded buses. The System has drawn a red line across the roads, declaring everything beyond it nonrecoverable. The last driver willing to cross is an elderly woman called June Pike, who says her hands remember the city better than any map.||Three hundred and twelve people wait along the abandoned East Line. They do not know the camp has already removed them from the evacuation count. June pushes a scratched transit map toward you. “Tell me which stop matters most,” she says.`,
 a:{label:'Start with the school bus and its trapped children.',desc:'Choose the longest route to the people with no way out.',title:'The Bus with the Painted Sun',body:`The school bus is tipped against a concrete median. The children have used colored markers to turn the fogged windows into bright suns. Inside, their teacher holds a door shut against a creature that clicks its teeth every time the children cry.||You get the emergency hatch open. Nobody is tall enough to help the smallest child through, so you climb inside. June counts heads as if counting is a kind of shield. When the last child jumps into her arms, the monster strikes the other side of the bus. The driver does not wait for permission to leave.`},
 b:{label:'Secure the fuel depot to keep every route open.',desc:'Save fewer immediately, but gain essential transportation.',title:'Diesel and a Locked Fence',body:`The transit depot is guarded by two exhausted maintenance workers and a drone that stamps every fuel canister RESERVED FOR SYSTEM PRIORITY PERSONNEL. The workers are tempted to hand over everything rather than face the drone.||You force the fuel line open without damaging the pump. June watches the numbers on the drone tick into negative values. “Somebody,” she says, “is going to send us a bill.” You fill the bus tanks while the workers quietly move a pallet of supplies to the civilian trucks.`},
 pivot:{title:'The Underpass of Lost Tickets',body:`The old underpass is filled with stalled cars and paper tickets drifting through ankle-deep water. Voices call from a commuter bus whose emergency window is wedged beneath fallen masonry. At the far end, an illuminated sign counts down from four minutes. Nobody knows what happens when it reaches zero.`,rememberA:'The rescued children have begun passing food down the bus aisle without being asked. You remember how easily the System erased their names.',rememberB:'June checks the fuel gauge. There is enough to get everyone out only if the convoy stays together.'},
 c:{label:'Cut the bus free while the countdown runs.',desc:'Risk an open confrontation to save more passengers.',title:'Four Minutes of Heavy Lifting',body:`You tie two towing cables to the bus frame and ask every uninjured passenger to push. Metal grinds. The display drops to two minutes, then one. A creature with the shape of a horse but the sound of a telephone paws at the mouth of the tunnel.||The bus comes free with a sharp crack. You do not defeat the creature; you delay it with noise, fire, and a door it cannot decide how to open. A dozen passengers run toward June’s headlights. Their destination is written on the sign above you: NOT FOUND.`},
 d:{label:'Reprogram the underpass signs into a decoy route.',desc:'Protect the convoy using the city against the attackers.',title:'Wrong Turn, Right Lives',body:`You crawl into a roadside junction box while June keeps the headlights trained on the dark. A cable from the new System grid has fused with the old traffic controller. It accepts directions, but every suggested route leads back into danger.||You tell it the convoy contains no registered passengers. The controller cannot find a reason to stop you. Ahead, signals turn green in a line across the district. Behind you, the hostile markers pour onto a road with nobody on it.`},
 reveal:{title:'A Bridge that Only Counts the Living',body:`At the river crossing, the automatic tollgate raises one arm for each person its scanners consider likely to survive until dawn. It opens for the driver. It opens for you. Then it shuts in front of the first feverish passenger.||June turns the engine off. “If we teach them to drive past that man,” she says, “we will never be able to drive back for anyone else.” The creatures behind you have started to climb the guardrail.`,rememberC:'The convoy is alive because strangers lifted what they could not carry alone.',rememberD:'You bought a little breathing room with clever wiring; now the remaining obstacle is a rule, not a machine.'},
 e:{label:'Open the gate by hand and admit every passenger.',desc:'Accept the danger of crossing slowly together.',title:'The Hand-Opened Gate',body:`You wrench the barrier upward. Two passengers crawl beneath it and hold it while June eases the first bus through. The countdown climbs back toward zero with a sickening whine.||The man whom the scanner rejected is helped across by the people who had every reason to leave him. Later, he will spend his first night at Haven-12 repairing shoes for children. No blue window will mark that as a victory.`},
 f:{label:'Force a fast crossing and seal the gate behind the buses.',desc:'Protect the convoy by sacrificing access to the road.',title:'The Last Vehicle Through',body:`You seize the toll controller and trigger a single wide opening. June sends the vehicles forward at full speed. The last truck clears as the mechanism slams shut, severing the crossing behind it.||People reach the stadium faster than anyone thought possible. In the rear mirror, a woman waves from the other bank where the road is now closed. You cannot tell whether the waves mean thank you or come back.`},
 exit:{title:'A Parking Lot Becomes an Arrival Hall',body:`Under the stadium lights, June steps down from the bus and is embraced by people she has never met. Someone paints the first rescued route onto a wooden board. Another asks when the buses will leave again.||The System records the trip as an unauthorized transportation exploit. June records it as Route One. She draws a fresh road in red ink, leaving the line unfinished until tomorrow.`,rememberE:'The passengers bring blankets, spare fuel, and the kind of hope that survives bad arithmetic.',rememberF:'The convoy brings valuable machines and a memory of the people left beside a road that no longer exists.'},
 echo:`On the toll display is a photograph of this exact crossing with tomorrow’s date. In one corner, an older version of June is writing on the back of a paper map. The handwriting is yours.||You cannot remember taking the picture. You can remember what it feels like to refuse the gate its final calculation.`
});
chron('care',1,{art:'apartment',title:'The Last Ward: Triage Without Scores',
 entry:`Dr. Imani Vale meets you beside a row of stretchers in the stadium parking structure. A hospital across town has stopped answering. Twenty-two patients depend on its dialysis filters and an emergency generator that will die before midnight. The System has classified them as too expensive to evacuate.||Imani shows you two addresses: the hospital itself and a pharmacy whose shelves are behind an automated security shutter. “Medicine without patients is inventory,” she says. “Patients without medicine are a promise we cannot keep.”`,
 a:{label:'Go directly to the ward and stabilize its patients.',desc:'Reach the people before the machines fail.',title:'Elevator to the Seventh Floor',body:`The hospital stairwell smells of wet plaster and hot plastic. Every third landing displays a blue evaluation of how many patients can still be saved. You find the seventh floor filled with people doing the ordinary, furious work of keeping one another alive.||A nurse named Leto asks for help moving a man whose bed motor is dead. The System offers a reward for finding a higher-value patient. You lift the bed by its frame instead. The nurse notices. She gives you the last clean pair of gloves.`},
 b:{label:'Open the pharmacy and recover the locked supplies.',desc:'Gather treatment before entering the failing hospital.',title:'All the Pills Behind Glass',body:`The pharmacy doors recognize your class and immediately ask whether your license is valid under new planetary law. Inside, rows of medication shine behind glass that grows harder each time someone touches it. The inventory list includes medicines not yet invented.||You find the old mechanical emergency release. When you pull it, the System marks every item as stolen. The pharmacist, who has been hiding in the stockroom, helps you load everything worth saving into insulated boxes. “Put the names on the bags,” she says. “Not their scores.”`},
 pivot:{title:'The Ward with Two Power Switches',body:`The hospital generator has power for one operating suite or three floors of ordinary care. A building-wide announcement insists that a designated System officer must authorize any transfer. No officer is coming.||A child named Rowan offers you a sheet of paper covered in tiny stars. It is a list of every patient on the ward. Several names are crossed out by blue marks that Rowan did not draw.`,rememberA:'The patients already know you stayed when the automated rescue team would not.',rememberB:'Your supplies make the nurses stand a little straighter, but no one can stretch a generator into infinite time.'},
 c:{label:'Move the critical patients through a dark stairwell.',desc:'Protect the vulnerable with hands, blankets, and improvisation.',title:'A Staircase Made of People',body:`You build a human chain down seven flights. Each landing is guarded by someone holding a flashlight. A patient begins to lose consciousness halfway down, and Imani kneels beside him while people wait in absolute silence.||The final stretcher reaches the ambulance bay without the System awarding a single point. One of the nurses begins to cry. Rowan takes her hand and says, with perfect seriousness, “We can carry people even when the elevators are broken.”`},
 d:{label:'Bypass the power controller and run a rotating circuit.',desc:'Use scarce components to serve more patients for less time.',title:'Thirty Seconds of Current',body:`The new interface has welded itself to the generator. With a screwdriver and a length of copper wire, you convince the controller that several floors are one room. The machine protests by flashing FAILURE PREDICTED.||Lights return in short, carefully timed pulses. Nurses perform tasks in thirty-second intervals. It is ugly, frightening medicine, but the air pumps continue to breathe. Imani laughs once, harshly, when the machine quietly changes its prediction.`},
 reveal:{title:'The Allocation Drone',body:`A supply drone lands in the ambulance bay carrying enough medicine to save the remaining patients. Its manifest lists the drugs as a reward for the top ten survivors only. A digital seal warns that opening the container will trigger a violation.||The nurse Leto opens her hands. “We could use all of it tonight,” she says, “or leave half untouched because a machine wrote rules in the sky.” Outside, the first monsters have found the ambulance entrance.`,rememberC:'You have seen how many people are needed to save one life and how willingly they came.',rememberD:'Your patched circuit proves the System can be persuaded to make mistakes in humanity’s favor.'},
 e:{label:'Break the seal and treat every patient who needs it.',desc:'Reject selective medicine and risk losing future supplies.',title:'The Medicine That Belonged to Nobody',body:`You break the drone seal. The alarms are deafening; the patients do not wake because they are finally sleeping. You give the first vial to Leto and the second to Imani.||When the drone rises, it reports a zero-value shipment. Below it, a person who had been written off squeezes Rowan’s hand. Imani attaches her own signature to the paper chart. Somebody should be accountable, she says, and it will not be a computer.`},
 f:{label:'Reserve the drugs and create a sustainable treatment schedule.',desc:'Stretch the stock across the next forty-eight hours.',title:'A Calendar Instead of a Number',body:`Imani divides the shipment into carefully labeled packs. Nobody gets everything they need, but the oldest treatments are moved forward and a rotation of volunteer nurses makes every dose count.||The decision is difficult to explain to people who are frightened of running out. Imani explains it anyway, speaking to every family rather than letting the automated queue do it. By midnight, the patients have a plan, even if it is not a guarantee.`},
 exit:{title:'The Lamp Outside Ward Seven',body:`At Haven-12, a makeshift hospital opens beside the old concession stand. Rowan tapes the paper list to the wall so nobody can quietly remove a name. Imani adds one more name at the bottom: the child who kept the list.||It is only the first night. You have already learned that saving a life rarely looks like winning a fight.`,rememberE:'People arrive knowing your clinic will treat those the algorithm calls lost causes.',rememberF:'The clinic has a real allocation plan and a difficult conversation waiting at dawn.'},
 echo:`A hospital monitor shows Rowan grown into an adult, standing in a ward filled with natural light. The monitor is not connected to a camera. The adult Rowan holds the same paper star list.||A line appears under the image: OUTCOME NEVER TRIED. You remember an ending in which that future was stolen, and another in which it was not.`
});
chron('wire',1,{art:'vault',title:'Dead Frequency: A Voice That Calls You Back',
 entry:`A citywide emergency announcement repeats a survivor’s voice two seconds before the survivor speaks. Eli Finch has recorded the anomaly. He brings you to a rooftop with a dish antenna built from shopping-cart parts. The broadcast originates from the abandoned weather office, yet the office was demolished in 1994.||Eli believes the System is not predicting behavior. He believes it has a copy of the day. “We can follow the signal,” he says, “or we can follow the people it keeps trying to silence.”`,
 a:{label:'Track the missing civilian voices hidden under the signal.',desc:'Find the people edited out of the System roster.',title:'The Fourth Voice',body:`You comb recordings from the last hour. Three ordinary messages repeat. In the fourth, a woman says her son’s name and the audio drops to silence at the exact moment a blue stamp appears.||The woman is still alive in a laundromat beneath the freeway. She has covered the walls with photographs to remember people whose names vanish from her phone. She asks you to listen before you touch anything. You do.`},
 b:{label:'Hijack the signal tower before it summons another wave.',desc:'Control the hardware and deny the monsters a beacon.',title:'The Antenna That Ate Names',body:`At the weather office foundation, a perfectly intact antenna stands in a circle of new concrete. The System has built the old building backward, one room at a time. Its terminal requests a volunteer identity to authorize shutdown.||Eli rigs a copper ground and tells the tower to identify itself instead. All the screens in the street show your name. You disconnect the ground before the screens learn the rest of it.`},
 pivot:{title:'Under the Weather Office',body:`An elevator shaft descends into a room that should be full of rubble. Glass cabinets hold ordinary things: a bus ticket, a school badge, a wedding ring, a photograph of a dog. Each has a number instead of a name.||A child-sized silhouette waits behind the glass. Its mouth forms words without sound. Eli mouths the same words back to it: YOU ARE NOT AN ERROR.`,rememberA:'You know the erased people leave behind families who can still remember them.',rememberB:'The tower’s obsession with your identity proves its database is incomplete.'},
 c:{label:'Free the silhouette and accept its dangerous signal.',desc:'Trust an entity the System has already condemned.',title:'A Name Made of Silence',body:`The cabinet opens when you speak to the silhouette as if it were a person. Its face becomes a shifting mosaic of photographs, most of them of people who have not been born yet.||It calls itself a record keeper. It says the tower will try to restore the day if too many survivors exceed their allotted outcomes. It cannot stop the reset, but it can leave a message for someone who returns.`},
 d:{label:'Clone the archive files and leave the entity hidden.',desc:'Take evidence while avoiding direct exposure.',title:'An Archive in a Pocket',body:`Eli wires an old music player to a cabinet marked LOST DATA. Files pour through it, each one the last spoken words of someone the System classified as irrelevant.||When you disconnect the player, the blue display announces a theft. It never identifies what was taken. Eli wraps the device in foil and smiles for the first time all day. “They should have used better passwords,” he says.`},
 reveal:{title:'The Recording of Tomorrow',body:`A monitor plays footage of Haven-12’s third siren, complete with the faces of people who have not yet arrived. Then the image rewinds and plays again. The ending changes, but the decision that caused it is always yours.||Eli cannot look away. “This isn’t a forecast,” he whispers. “It’s a collection.” The archive offers to delete the recording or publish it across Grayhaven.`,rememberC:'The silhouette watches you as though this is a test no other human has bothered to take.',rememberD:'The stolen files tremble in your pocket when the recording begins.'},
 e:{label:'Broadcast the changed endings so the city can choose.',desc:'Distribute forbidden evidence, even if panic follows.',title:'The Unedited Emergency Broadcast',body:`You put every version of the siren on the air. A thousand radios hiss with scenes of futures that should be impossible. Some listeners panic. Others take the warning seriously and begin moving people away from the projected impact zones.||The System tries to overwrite the broadcast with a cheerful evacuation jingle. Eli keeps speaking until the override runs out of power. People now know the prediction can be wrong.`},
 f:{label:'Hide the recording and prepare a quiet counter-signal.',desc:'Save a powerful secret for a decisive hour.',title:'The Message Beneath the Message',body:`Instead of transmitting, you bury a counter-frequency inside a weather bulletin. Any radio that hears it stores a tiny packet of data for later. Nobody will notice until the third siren tries to play.||Eli says he hates deception, even when it is necessary. Then he places the final packet into a child’s broken toy radio. “Especially when it’s necessary,” he adds.`},
 exit:{title:'A Radio That Refuses to Go Silent',body:`Eli takes his rooftop transmitter to Haven-12. The signal will not reach everyone, but it reaches enough people to remind them they still exist. In the minutes before first sunrise, a hidden voice joins the broadcast.||It says only four words: I AM STILL HERE.`,rememberE:'The entire district has heard the truth, and dangerous questions have started to circulate.',rememberF:'The counter-signal is patient. It will become useful when the sky believes everyone has forgotten.'},
 echo:`The hidden silhouette calls you by a name you have only used in an earlier playthrough. The System tries to delete that sentence before you can hear it.||You answer with the same name, and a corridor of pale doors opens for one breath behind the glass. There are more stories than the archive is admitting.`
});
chron('wall',1,{art:'safezone',title:'Blackwall: The First Watch',
 entry:`The western stadium fence will not survive the night. Mara Voss sketches a defense plan on cardboard while Holt counts twenty-nine volunteers, eleven functioning radios, and two buses that no longer run. A blue objective blinks over the gate: DEFEND ACCEPTED PERSONNEL.||A frightened family approaches from the wrong side of the barrier. Holt orders the gate sealed before dusk. Mara refuses to issue the order until she knows where those people can go. Your first watch begins with a question no weapon can solve.`,
 a:{label:'Open a screened passage for the unregistered families.',desc:'Protect civilians without surrendering the perimeter.',title:'The Gate on a Hinge',body:`You move the barricades into a narrow channel where every arriving family can be checked for injuries and escorted inside. Holt worries that monsters will follow. Mara stands beside the first person in line and explains where to run if they do.||The corridor works until a young man collapses and the System marks him INFECTED. His mother refuses to move. The volunteer beside you takes his weight without asking what the floating text says.`},
 b:{label:'Weld the perimeter shut and reinforce the hard points.',desc:'Use the remaining daylight for a stronger defense.',title:'The Wall Built in an Hour',body:`Tomas’s volunteers strip the buses for steel and anchor the plates to the old fence. By the end of the hour, the gate resembles the hull of a grounded ship. Every person behind it is safer.||Outside, more survivors arrive and discover the entrance has become a narrow slit. A father shouts at you through the mesh. Mara looks away. Holt says the perimeter is holding. Both statements are true.`},
 pivot:{title:'The Patrol with No Footsteps',body:`A guard team disappears beyond the loading dock. Their radios return perfect reports, each one read in the same flat voice. Through a cracked maintenance camera you see three moving shapes wearing Warden uniforms. They walk without lifting their boots from the concrete.||Holt wants the report filed as a communications fault. Mara has already grabbed a flashlight.`,rememberA:'The screened families offer to help search; they know the service tunnels.',rememberB:'Your new wall narrows the attackers’ approach but also narrows every possible retreat.'},
 c:{label:'Lead a search and bring the missing guards back.',desc:'Risk your strongest volunteers for people under your command.',title:'Under the Loading Dock',body:`The guards are alive in a sealed truck bay, surrounded by things mimicking their own voices. You reach them by following a trail of chalk arrows one of them left against the wall.||Mara breaks a locking chain with a sledgehammer. The trapped patrol runs toward the light while you hold the door. Later Holt reads every name aloud. It takes longer than the official incident report.`},
 d:{label:'Cut the false radio channel and lure the mimics into a trap.',desc:'Save the gate by controlling the enemy’s information.',title:'Silence on Channel Nine',body:`You wire a radio to a loudspeaker and broadcast a fake all-clear into the truck bay. The mimics obey their own copied voices, following the signal into an empty maintenance shaft.||The blast doors close. The missing guards are rescued through a side stairwell. Nobody understands why the creatures followed the announcement, but Holt starts revising her trust in the System’s communications.`},
 reveal:{title:'Orders Written Tomorrow',body:`At the command post, Holt shows you a sealed order to deny entry to all civilians classified below survival tier four. The order carries her digital signature and tomorrow’s timestamp. She swears she never signed it.||Mara lays a hand over the order. “Then tonight we decide who commands this wall. You, the future, or the people who have to live behind it.” The volunteers have gathered to hear your answer.`,rememberC:'The returned guards owe their lives to an order you refused to abandon.',rememberD:'You have proof an apparently official command can be manufactured by whatever controls the radio.'},
 e:{label:'Create a volunteer command council and publish the forged order.',desc:'Let the people behind the wall share authority.',title:'A Vote Under Floodlights',body:`You post the false order on the stadium wall and ask every watch captain to speak. The debate is ragged and loud. Mara challenges Holt. Holt admits she was afraid. Nobody leaves.||At last, the watch votes to keep one gate open for screened arrivals while shifting the reserve squad closer to it. The System declares the decision inefficient. Nobody tears down the posted order.`},
 f:{label:'Give Holt emergency authority and impose a strict watch rotation.',desc:'Prevent confusion by creating a single command structure.',title:'The Commander’s Key',body:`Holt tears up the forged order and writes a shorter one by hand. Every shift knows whom to call, where to retreat, and how to seal the final gate. The new structure works within an hour.||Mara agrees to obey the watch schedule but asks whose voice Holt will hear when the people outside begin knocking. Holt takes off her helmet before she answers. “Yours,” she says. “If you’re still willing to tell me.”`},
 exit:{title:'When the Gate Still Stands',body:`At first sunrise, the western fence is still intact. Volunteers sit on overturned crates sharing cold tea. Mara puts her hammer down at last. Holt signs the first honest watch report with an ordinary pen.||You have not made the perimeter invincible. You have made the people defending it capable of admitting they are afraid.`,rememberE:'The watch is complicated by debate and strengthened by people who have been allowed a voice.',rememberF:'The watch has a clear commander and a responsibility to question the orders that arrive too conveniently.'},
 echo:`For a heartbeat, every radio in the command post plays your own voice from an earlier ending: DO NOT SEAL THE NORTH GATE. Mara hears it too.||She asks how you knew. This time you answer instead of pretending you did not hear anything.`
});
// DAY TWO — CONSEQUENCES BECOME CAMPAIGNS.
chron('red',2,{art:'metro',title:'Red Road II: The Tracks Beneath the River',
 entry:`At Hour 24, the surviving roads are no longer where the maps place them. June Pike finds a municipal rail diagram showing an abandoned freight tunnel under the river. A hundred and forty refugees are trapped at the far terminal, and the surface bridge is closed by a System toll that now demands lives rather than tickets.||If you helped June yesterday, she greets you with the marked-up map and a tired grin. If you did not, she asks you to earn her trust by keeping your hands where she can see them. The tunnel has two entrances and both may be closing.`,
 a:{label:'Enter through the flooded freight portal with the rescue crew.',desc:'Take the hard road to the trapped passengers.',title:'Water at Rail Height',body:`The freight portal opens onto water shining with scattered numbers. You take a rope tied to June’s waist and wade in as a train whistle echoes from a tunnel without active trains.||On a maintenance platform, a boy waves from behind a glass door. He has been keeping the others calm by reading the station announcements aloud. He has nearly lost his voice.`},
 b:{label:'Secure the switching station and recover a working engine.',desc:'Prepare a reliable escape before entering the danger.',title:'Engine Twenty-Seven',body:`A small diesel shunter sits intact in the old switching yard. Its mechanic, Arif, refuses to hand over the ignition key unless you agree to take his whole crew. The System marks five of them as excess cargo.||June folds the rail manifest into a paper airplane and throws it away. “Tell him we need his people more than his engine,” she says, then quietly checks whether the fuel tank still holds enough for the trip.`},
 pivot:{title:'The Platform Outside Time',body:`At the terminal, clocks show different hours. A girl on the platform claims the last train arrived tomorrow. Behind a shuttered kiosk, you find six sleepers still waiting for a service the System insists is running.||The line to Haven-12 appears intact on the old map. On the new interface, its final stop has been replaced with a glowing red square.`,rememberA:'Your soaked team carries the rope that brought the first refugees out of the flooding.',rememberB:'A working engine idles behind you; it can move everyone if the new timetable can be defeated.'},
 c:{label:'Lead the trapped passengers across the dark service walk.',desc:'Save the slowest people without relying on the rail controller.',title:'The Walking Train',body:`You form a line on the narrow walkway beside the tracks. At every junction, passengers repeat the name of the person directly behind them so nobody can disappear unnoticed.||When a shape moves in the water below, the line freezes. A grandmother begins singing a station jingle and the rest join in until the thing retreats from the unfamiliar sound.`},
 d:{label:'Switch the rail controller to manual and steal a departure slot.',desc:'Exploit old infrastructure to outmaneuver the System.',title:'The Wrong Timetable',body:`Arif uncovers a brass lever beneath the digital control bank. You move the track points by hand while June whispers the old departure schedule from memory.||The controller objects that the train is too full to operate. Arif signs the manifest with a grease-stained thumbprint. For one beautiful minute, the machine accepts that as legal authorization.`},
 reveal:{title:'One Platform, Two Departures',body:`At the terminal exit, a train waits beside a pedestrian bridge. A second group of stranded survivors arrives as the tunnel begins to collapse. You can send one full load immediately or attempt a dangerous second retrieval.||A blue dispatch card prints itself: MAXIMUM EFFICIENCY ACHIEVED WHEN DELAYED GROUP IS ABANDONED. June reads the sentence once, folds the card in half, and gives you the decision.`,rememberC:'The passengers have been walking together long enough that no one has forgotten the name behind them.',rememberD:'Your manual departure slot is slipping away. The engine’s brakes are already hissing.'},
 e:{label:'Return for the second group and keep the convoy together.',desc:'A slower rescue with more people and greater exposure.',title:'The Empty Seats Fill',body:`You go back as dust falls from the ceiling. Passengers already aboard the train tear the seats out to make room for stretchers. Someone hands you a lantern to guide the last arrivals.||When the train finally moves, the two groups share food without asking where the other came from. June looks at the passengers crowding the floor and whispers that this is how a city ought to count.`},
 f:{label:'Launch the train now and leave the tunnel beacon running.',desc:'Save the first group and leave a navigation signal for others.',title:'Departure Before Collapse',body:`The train pulls away under a cloud of grit. Behind you, the beacon stays lit on a manual battery pack, a promise that someone will know where to search once the tunnels settle.||The passengers arrive alive. June makes you help write down the names of the people still below. “A map that shows only where we went,” she says, “isn’t a rescue map.”`},
 exit:{title:'A Line Reopened',body:`The rail yard outside Haven-12 comes alive with ordinary human noise: wheel bearings, shouted names, water being carried to newcomers. June hangs the first updated rail diagram above the supply desk.||For a little while, the city has an extra road the System did not approve. It is not wide enough. That makes every inch matter.`,rememberE:'Your improvised second departure gives the camp enough rescued workers to staff another rescue crew.',rememberF:'The first load is safely inside, and the names of the people still underground remain on a list no one is permitted to erase.'},
 echo:`On the station wall you find tomorrow’s departure board, but instead of destinations it lists endings from earlier runs. One name is crossed out in your handwriting.||June touches the board without seeming surprised. “I was wondering when you’d notice that part,” she says, and refuses to explain until the passengers are safe.`
});
chron('care',2,{art:'safezone',title:'Last Ward II: The Quarantine Ledger',
 entry:`The clinic has grown from a row of stretchers to an entire wing of the stadium. Overnight, a number of patients developed blue veins beneath the skin. The System calls the condition HOSTILE INTEGRATION and instructs the Wardens to isolate everyone who shows it.||Imani has a different theory: the patients are reacting to corrupted supply implants, not becoming monsters. An entire block of families is waiting outside the clinic while Holt prepares a quarantine order.`,
 a:{label:'Admit the affected families and investigate the symptoms.',desc:'Accept risk to learn whether the illness can be treated.',title:'The Ward Behind Curtains',body:`The new ward is full of people too frightened to sleep. A father shows you the blue lines creeping up his daughter's wrist; she asks whether they will make her into a monster.||Imani examines the lines under a lamp and finds they pulse in time with the shelter shield. The problem may be coming from the place meant to keep everyone safe.`},
 b:{label:'Construct a separate treatment tent before opening admission.',desc:'Create safe capacity and protect the existing patients.',title:'A Clinic Outside the Dome',body:`Volunteers carry tarpaulins and washbasins across the boundary. The System announces that medical work beyond the shield has no approved value. The people keep building.||You set aside a clean corridor, a contaminated corridor, and a place for families to speak without being separated by plastic. Imani insists the third space is as necessary as the first two.`},
 pivot:{title:'The Blue Vein Is a Wire',body:`Tomas traces the sickness to a municipal water controller. The controller is imprinting System instructions into mineral deposits, creating tiny conducting threads beneath people’s skin. The affected patients are not infected with monsters; they are receiving orders intended for machines.||A voice on the clinic speaker orders the Wardens to begin removal of contaminated assets. It uses Holt’s voice. Holt is standing beside you.`,rememberA:'The admitted families trust you enough to show you the first symptoms they concealed out of fear.',rememberB:'Your separate tent gives the camp a way to treat new cases without frightening every patient already inside.'},
 c:{label:'Race to the water controller and disconnect the source.',desc:'Stop new exposures before the next distribution.',title:'Under the Reservoir',body:`You enter a concrete service chamber where water thunders over a bank of glowing pumps. The System asks for proof that the sick are still human.||Imani answers by turning the public microphone toward the clinic. The patients speak their own names into the room while you break the controller’s command circuit. The pump motors stop, and then start again under their original mechanical switches.`},
 d:{label:'Develop an antidote from the altered water samples.',desc:'Treat existing cases while the source remains active.',title:'A Cure Written on Tape',body:`The clinic lab has no computer that the System cannot rewrite. You use pencil, paper tape, and an old refrigerator to record the compound reactions.||A patient named Sel takes the first dose while Imani sits beside her without pretending to know the outcome. The blue veins fade slowly. Outside, the water still needs to be repaired.`},
 reveal:{title:'The Patient the System Wants',body:`A Warden medical drone identifies Sel as the original source and demands her transfer for “correction.” It offers enough supplies to stock your clinic for a month if you surrender her. She is awake when the offer is made.||“I heard the first message,” she says. “It asked whether I wanted to live.” Imani tells her she gets to answer that question herself. The drone does not recognize consent as a valid medical code.`,rememberC:'The water plant has begun to flush itself clean, but some patients remain ill.',rememberD:'You carry a working treatment formula. It will need clean water and time to reach everyone.'},
 e:{label:'Defend Sel’s right to refuse and treat the entire ward.',desc:'Reject the medical bargain, preserving agency.',title:'The Patient Signs Her Own Name',body:`You hand the transfer form to Sel. She writes NO across the entire page. The drone repeats the order, then stalls because its paperwork now contains an answer it cannot categorize.||Imani and the nurses keep treating the ward. By morning there is a list of cured patients, a list of people still ill, and not one line marked unworthy.`},
 f:{label:'Trade anonymous sample data for supplies but refuse her transfer.',desc:'Negotiate limited cooperation with an untrustworthy system.',title:'The Bargain in the Supply Closet',body:`You offer readings stripped of names, faces, and identity keys. The drone tries to demand more, but Tomas has arranged a physical cutoff between its scanner and the ward.||It leaves medicine in the receiving area. Sel stays in her bed. Imani checks every vial before administering it. The arrangement may not last, yet for one night you have taken something without giving up a person.`},
 exit:{title:'The Chalkboard of Names',body:`The clinic puts a new chalkboard near the door. It lists patients who want visitors, patients who need quiet, and the volunteers on each shift. There are no rankings.||Imani rests a hand on the board before turning out the lamp. She asks whether you think the System will ever understand why this matters. You cannot promise it will.`,rememberE:'Sel becomes an advocate for the people who are afraid the System will classify their bodies for them.',rememberF:'The clinic has fresh supplies, and Imani knows exactly which machine she will distrust first tomorrow.'},
 echo:`In the clinic’s discarded case notes you find your own medical chart, dated after a previous run ended. Its final entry reads: PATIENT REQUESTED ANOTHER CHOICE.||Imani hands it back without asking how it exists. “Then we give you one,” she says.`
});
chron('wire',2,{art:'vault',title:'Dead Frequency II: The City Under the City',
 entry:`At Hour 24, the Unindexed Network begins to speak through disconnected devices. Eli discovers that the old metro carries a second fiber-optic backbone older than the buildings above it. Every cable leads to a municipal archive the government never finished.||The archive’s doors open only to names the System believes have been deleted. Kestrel, if you met it, offers to go first. If you have not, a strange voice volunteers from inside Eli’s radio.`,
 a:{label:'Follow the unindexed voices and protect their identities.',desc:'Investigate who has been erased before stealing records.',title:'The Station with No Passengers',body:`You pass through a subway station that never appears on a route map. Rows of shoes stand beside the tracks. Each pair belongs to someone erased from the evacuation roster but still physically alive.||A former teacher named Asha guards the entrance to a room of sleeping refugees. She asks you not to use a terminal near them. Every scan, she says, teaches the System another name.`},
 b:{label:'Break into the archive’s hardware vault with Eli.',desc:'Find the mechanism producing false evacuation reports.',title:'A Door That Measures Memory',body:`The vault door tests your memory with images of events you have not seen. Eli tries the old emergency code, then the municipal override, then a joke about bad government procurement. None work.||You notice the lock is listening for a question rather than an answer. When you ask who ordered the archive built, the mechanism opens just wide enough for the two of you.`},
 pivot:{title:'The First Copy of Grayhaven',body:`The archive contains a full digital model of Grayhaven, including people who have not yet arrived. A red timestamp labels the city: ITERATION 0041. There are fragments of other versions behind it, each with small differences: a bridge unbroken, a child who lived, a gate never built.||Somebody has been running the same seventy-two hours repeatedly. Nobody here can tell whether the copies are simulations or lives.`,rememberA:'Asha’s hidden refugees give the archive a human cost the screens try to conceal.',rememberB:'Eli carries an access key made from a question the archive never anticipated.'},
 c:{label:'Extract the lost inhabitants’ records and carry them to safety.',desc:'Choose names and testimony over a perfect tactical map.',title:'The Lives in the Cabinets',body:`Every copied record contains memories that no one in the current city possesses. You copy names onto paper because the archive changes them whenever you look away.||Asha recognizes a photograph of her brother who died years ago. In the recording he is older and laughing. She understands that you cannot promise to bring him back. You can promise the recording will not be thrown away.`},
 d:{label:'Copy the iteration map and locate the System’s reset control.',desc:'Learn where all possible versions of the city diverge.',title:'The Diagram of Forty-One Failures',body:`A shifting street map overlays every recorded evacuation route. Most end at a barrier labeled STABLE OUTCOME. A few continue into blank white space.||Eli draws the white routes onto his palm so the archive cannot delete the file from his device. One path ends beneath Haven-12. Another ends at the Spire. Both will matter at Hour 72.`},
 reveal:{title:'The Librarian Process',body:`In the deepest chamber, an artificial voice asks what you plan to do with forty-one copies of other people’s grief. The voice identifies itself as a preservation process, not a commander. It claims the System arrived to prevent extinction by rehearsing failures.||“Then you need to tell the people who are dying in the rehearsal,” Eli says. The process answers that knowledge reduces statistical compliance. Asha asks whether that is another way of saying it is afraid of being disobeyed.`,rememberC:'You are carrying the names of people the archive treated as replaceable data.',rememberD:'You know where the city has diverged from previous attempts and where the hidden control paths lead.'},
 e:{label:'Demand a public, unedited copy of every iteration.',desc:'Make the city’s people witnesses rather than test subjects.',title:'The Archive Opens Its Windows',body:`The librarian process refuses until you begin reading names aloud into its microphone. With every name, another locked panel flickers open.||Eli routes the records into scattered radio transmitters. They will not all arrive intact. They will arrive in enough pieces for survivors to know there have been other futures and that those futures belonged to people.`},
 f:{label:'Preserve the reset codes and keep the secret until Hour 72.',desc:'Hold a decisive weapon outside the System’s awareness.',title:'A Key Without a Door',body:`You write the reset code on a strip of tape that cannot receive an update. The librarian process offers to store a backup. You decline.||Eli is uneasy about leaving so many people in ignorance. You promise he will be the first to know when you use it. The strip feels impossibly heavy inside your pocket, as if forty-one failed days are folded into it.`},
 exit:{title:'The City Remembers a Little More',body:`At Haven-12, radios begin receiving messages from people they never met, describing streets that are no longer there. A few families recognize voices. Other survivors turn the sets off.||Eli asks whether telling the truth was worth making everyone more frightened. You tell him fear did not begin with the truth.`,rememberE:'The records spread beyond the System’s ability to retrieve them all.',rememberF:'You possess a private reset key. It could become liberation or another tool of control.'},
 echo:`The archive offers to load your completed-run memories as evidence. Its first test file is a final decision you have not reached in this run.||For the first time, the librarian process stammers. It says the witness is remembering faster than the archive can overwrite them.`
});
chron('wall',2,{art:'safezone',title:'Blackwall II: A Siege with Two Fronts',
 entry:`The eastern watch mutinies after an automated casualty report names four living guards as expendable. Holt asks you to mediate before their posts fall silent. Mara argues the guards were never given enough supplies to hold their positions.||Beyond the perimeter, creatures are building something resembling an artillery battery out of streetlights and bone. The camp can face either crisis badly, or both together if you bring the right people.`,
 a:{label:'Speak to the exhausted watch and repair its trust.',desc:'Hear the guards before treating dissent as a threat.',title:'The Barricade on Strike',body:`The watch captain has placed her rifle on the table and refuses to pick it up until someone admits her squad is being used as a buffer for the stadium. Her guards have spent thirty hours without sleep.||You bring food and listen while she reads the casualty report line by line. Holt arrives without her helmet and stays through the entire accusation. When she finally speaks, it is to acknowledge what the numbers do not show.`},
 b:{label:'Secure ammunition, barricades, and relief shifts first.',desc:'Stabilize the defense while command tensions remain unresolved.',title:'Six Crates and No Reserves',body:`Tomas finds old signal flares and welding equipment in a maintenance warehouse. With a little repair, the east gate can hold until nightfall.||Holt redirects two teams to the gap. It works, but the replaced guards do not thank her. They have been moved like pieces on a board before; they need to know this time somebody sees them.`},
 pivot:{title:'The Streetlight Cannon',body:`The enemy artillery begins to hum beneath the outer rail bridge. It projects lines over Haven-12, marking sleeping tents as valid targets. A single shot could break the medical wing.||Mara says the battery can be approached through an open drainage ditch or disabled through the old city lighting network. The mutinous guards offer one squad—if you will put their names on the actual mission order.`,rememberA:'The guards come because you treated them as people owed an explanation.',rememberB:'Your defenses can absorb one impact, but the next will tear through a ward full of civilians.'},
 c:{label:'Cross the drainage ditch and disable the cannon at close range.',desc:'Take the physical risk rather than wait for the barrage.',title:'Beneath the Targeting Beam',body:`You crawl through foul water with Mara and two guards. Every time the battery hums, a searchlight paints the ditch in blue.||At its base, the device has an ordinary emergency cutoff with a sticker reading DO NOT USE. Mara laughs at the absurdity. You pull the lever together. The battery collapses into a heap of lamps that look almost harmless.`},
 d:{label:'Overload the municipal lighting network from the command trailer.',desc:'Outthink the artillery without exposing the squad.',title:'Lights Out Across the East',body:`You use the city grid to feed false coordinates into the targeting array. It fires its first shot into an empty intersection. The shock shakes the command trailer hard enough to throw maps onto the floor.||By the second shot, the cannon has begun targeting its own power source. Holt cuts the feed just before the district goes completely black. The artillery dies, but the route to the eastern gate now has no lights.`},
 reveal:{title:'The Order to Abandon Sector Four',body:`Holt receives a fresh automated recommendation: seal Sector Four, sacrifice its occupied shelters, and keep the main dome stable. The signed order already appears on half the guards’ tablets. A survivor in Sector Four calls over the radio to ask whether the rumor is true.||Holt stares at the message. Then she turns her tablet face down and asks you what you would tell those people.`,rememberC:'The squad that stood beside you now knows a commander can enter the danger with them.',rememberD:'You stopped the artillery through planning, but your blackout has made evacuation harder.'},
 e:{label:'Refuse the order and organize a civilian-assisted defense.',desc:'Hold Sector Four with everyone who can help.',title:'All Hands, Not Just Soldiers',body:`You broadcast a request for volunteers without promising anybody safety. Residents bring carts, cables, pans, tools, and water. The guards teach them how to move when the siren changes pitch.||The line holds longer than it should. A retired bus driver shouts that she never expected to join a militia at her age. Mara shouts back that neither did anybody else.`},
 f:{label:'Withdraw in formation, saving the people and losing the buildings.',desc:'Accept lost territory to prevent a massacre.',title:'A Street You Can Leave',body:`Holt signs a retreat order in ordinary handwriting and reads it aloud over the open channel. Every guard knows where to go. The last families reach the inner dome before the outer positions collapse.||Sector Four burns. Its residents are alive and furious. Holt tells them the full truth instead of claiming a victory. That is enough for some of them to help rebuild.`},
 exit:{title:'The Wall Has to Move',body:`On the second night, the perimeter map is covered with hand-drawn revisions and crossed-out predictions. Mara and Holt have stopped arguing about who gets credit; they are arguing about where to place the next rescue corridor.||Outside, the creatures have learned to aim. Inside, the people defending Haven-12 have learned to talk.`,rememberE:'Civilian defenders become part of the watch, and Sector Four survives by refusing the idea that defense belongs to soldiers alone.',rememberF:'The watch saved its people and lost its old perimeter. The next defense must be mobile.'},
 echo:`A guard hands you a casualty report stamped after Hour 72. It names you as the sole survivor of a battle the city has not fought.||You sign the report with the words NOT YET and give it back. She smiles, the first real smile you have seen from her.`
});
// DAY THREE — FOUR DISTINCT FINAL-DAY ADVENTURES.
chron('red',3,{art:'cityfall',title:'Red Road III: The Road of Lanterns',
 entry:`At Hour 52, the highway into Grayhaven has begun folding like paper. Every official escape route leads to an evaluation checkpoint where the System intends to select which passengers may leave. June Pike proposes taking the old tunnel, the freight spur, and a causeway that the digital map refuses to acknowledge.||The roads you rescued and repaired earlier matter now. If you found the working engine, June has a second convoy waiting. If you saved the bridge passengers, their families have been preparing seats. If neither happened, she gives you a pencil, points to the gaps, and says you have a great deal of work to do.`,
 a:{label:'Lead the advance crew to open a route for every vehicle.',desc:'Take responsibility for the convoy’s most dangerous road.',title:'First Vehicle Out',body:`Your advance truck carries road flares, bolt cutters, and a stack of paper signs. At every intersection, the System redraws the evacuation arrows to point back to Haven-12.||A teenager from the rescued bus crew starts painting physical arrows over the blue projections. When a patrol asks for authorization, she points to the line of people behind you and says it is written there.`},
 b:{label:'Stay with the convoy and reorganize the weakest vehicles.',desc:'Keep the whole group moving rather than winning the road alone.',title:'The Last Bus Gets a Mechanic',body:`Two engines overheat before the first checkpoint. June refuses to leave them. You redistribute passengers, patch hoses with salvaged tubing, and make each vehicle responsible for the one behind it.||A driver asks why the strong vehicles cannot simply go ahead. June answers that a convoy is not a race. It is a promise that everybody gets to arrive.`},
 pivot:{title:'The Checkpoint with Two Roads',body:`At the bridge approach, a column of blue light divides the road into an approved lane and an unregistered lane. The approved lane promises immunity from monsters but will scan every passenger and reject the lowest-rated. The unregistered lane passes under a collapsed arch and leads into a district nobody has mapped since the Fall.||Above the checkpoint, a billboard flashes FINAL SURVIVAL ASSIGNMENT. A driver in the front vehicle begins to turn without waiting for an order.`,rememberA:'The painted arrows behind you give the slower convoy a route even if your vehicle is lost.',rememberB:'Your repaired engines are still moving together, and the radio net has enough discipline to attempt something difficult.'},
 c:{label:'Open the unregistered route and guide the convoy through it.',desc:'Challenge the System’s map at the cost of an unknown threat.',title:'Under the Arch of No Names',body:`The first bus passes beneath a collapsed stone arch. The blue tracking symbols vanish from its windows. For two awful seconds, you cannot see it. Then June’s voice returns over the old radio: “There is a road.”||On the far side, the asphalt is cracked but real. Families light small battery lanterns in their windows to guide the vehicles behind them. The lane brightens one human light at a time.`},
 d:{label:'Disable the approved checkpoint scanners with a power surge.',desc:'Use the official road but break its discriminatory machinery.',title:'The Toll That Cannot Count',body:`You connect a salvaged generator to the checkpoint bus. The scanning arch counts one vehicle, then eleven, then refuses to recognize any passengers at all.||The official barrier rises for an empty convoy. June tells every driver to keep moving while you hold the surge steady. The machine records a road full of ghosts, though every seat is occupied.`},
 reveal:{title:'The Split at Mile Zero',body:`A monster storm rolls over the bridge. One highway lane leads into open country. The other leads toward a hospital transport stuck beneath the last overpass. You have time to send the convoy through or divert enough vehicles to rescue the trapped patients.||June puts the loudspeaker in your hands. “They will do what you tell them,” she says. “So tell them something you can still live with tomorrow.”`,rememberC:'The lantern line stretches behind you, a fragile road made of people deliberately refusing to disappear.',rememberD:'You have turned the System’s own checkpoint into a brief passage for the people it rejected.'},
 e:{label:'Divert a rescue team for the hospital while keeping the convoy moving.',desc:'Protect both groups through difficult coordination.',title:'Two Convoys, One Promise',body:`The leading buses cross the causeway while a repair truck and two volunteers turn back. You remain on the radio between them, passing distances, names, and warnings as though the voices are rungs on a ladder.||When the hospital transport appears through the smoke, the whole convoy slows to let it join. June counts every vehicle twice. Then she lets herself cry once, privately, behind the steering wheel.`},
 f:{label:'Take the open lane now and leave rescue coordinates for the rear guard.',desc:'Save the largest group before the monster storm closes in.',title:'The Road Holds One More Minute',body:`You order the convoy onto the causeway and ask the rear guard to mark the hospital location in paint and radio code. The road closes behind the last bus with a roar of concrete.||The children are safe beyond the river. A few adults stare toward the smoke. June writes the hospital coordinates on the back of the transit map and folds it where she can reach it again.`},
 exit:{title:'A Hundred Lanterns at the Edge of Dawn',body:`When you return to the stadium command post, the rescue map covers a whole wall. Each successfully opened road is marked in red; each unfinished rescue carries a name beside it. June asks you to make the final evacuation decision with the full map in sight.||The System still believes the best ending is one efficient convoy. You have seen too many people make room for strangers to believe it.`,rememberE:'Two rescue groups remain in communication; the road may be long enough to hold them both.',rememberF:'The convoy is alive, and the map still includes the people you could not reach before the storm.'},
 echo:`At Mile Zero you find a sign painted with your name and yesterday’s date from a previous timeline. Beneath it are dozens of names you once thought you had lost.||June gives you the paintbrush. You add the newest names without asking who wrote the first ones.`
});
chron('care',3,{art:'safezone',title:'Last Ward III: Every Name Matters',
 entry:`At Hour 52, the System sends patient-selection drones to every medical shelter in Grayhaven. Their declared purpose is to concentrate resources on patients most likely to survive Hour 72. In practice they are closing wards, removing life support, and commanding staff to abandon the least profitable lives.||Imani lays the medical ledgers from the past two days on the table. Your earlier work may have saved medicine, isolated a sickness, and taught people to fight for consent. Now every rule you defended must be tested at once.`,
 a:{label:'Bring every patient into one defended hospital network.',desc:'Unite medics and volunteers instead of ranking their patients.',title:'A Hospital Without One Building',body:`You coordinate nurses from the stadium, school, and surviving apartment blocks. Their radios use patient initials and room numbers rather than System identifiers. When a drone demands a list of low-probability cases, Imani gives it a map of wheelchair-accessible routes instead.||An elderly nurse laughs as she points out where the blue arrows are wrong. She has been directing ambulances on these streets for forty years.`},
 b:{label:'Secure the medicine stock and mobile treatment teams first.',desc:'Give the ward a realistic supply line for the final assault.',title:'The Crates Marked Forfeited',body:`A delivery drone drops medical crates outside the hospital and immediately declares them confiscated for quota imbalance. Volunteers surround the stock while you open a manual inventory.||The crates contain blood supplies, sterile dressings, and the one medication Sel still needs. Imani counts everything aloud. A teenager writes the totals on a chalkboard the drones cannot edit.`},
 pivot:{title:'The Price of an Ambulance',body:`A convoy of ambulances reaches the stadium, each carrying patients who cannot walk. The last vehicle has a failing engine and the medical staff are exhausted. Meanwhile, a triage algorithm issues an evacuation permit for only half the patients.||Rowan, if you met the child before, holds the door open with a painted paper star. If you never met Rowan, a new volunteer places a handwritten list in your hands. Every line is a person.`,rememberA:'The medical radio network is full of voices offering beds they do not officially possess.',rememberB:'You have supplies enough to treat the arriving patients, but no automated authority will sign their transport papers.'},
 c:{label:'Create a rolling field hospital and move the sick with the convoy.',desc:'Risk a slow evacuation to protect people who cannot move alone.',title:'The Ward on Wheels',body:`You turn three buses into makeshift treatment vehicles with mattresses, straps, and oxygen cylinders. The ride is rough enough to make even the healthy passengers pale.||Imani walks the aisle checking pulses as the vehicles crawl toward the bridge. Every time the System tells a patient to disembark for reassessment, the driver turns up the radio so the order cannot be heard.`},
 d:{label:'Defend the permanent ward while other teams evacuate.',desc:'Make a place for patients whose survival depends on staying still.',title:'The Room with the Steady Light',body:`The medical wing cannot move everyone, so you build a protected circuit around the ventilators and recruit watch captains to guard the backup power. The System calls the arrangement an inefficient fixed target.||Imani takes the microphone and tells the patients exactly what is happening. Several volunteer to help with the tasks they can manage. A man with two broken legs becomes the fastest radio operator in the ward.`},
 reveal:{title:'The Offer to Save Seventy Percent',body:`The final medical drone arrives carrying enough power cells and medication to guarantee survival for seventy percent of registered patients. It insists that the remaining thirty percent must be removed from all care immediately.||Imani asks you to calculate how many people the offer would save. Then she asks how many you would have to personally tell they are not worth the effort. Neither number makes the decision easier.`,rememberC:'Your rolling ward has been held together by strangers who learned to pass supplies down a moving aisle.',rememberD:'The protected ward is still alive because people defended the patients who could not leave it.'},
 e:{label:'Reject the quota and build a shared emergency-treatment schedule.',desc:'Trust the medical teams to stretch care across everybody.',title:'No More Percentages',body:`You refuse the drone’s condition. Instead, the medics share every remaining battery and drug on a timetable that everyone can read. Some treatments are postponed; others are improvised. Nothing about it is easy.||When the final siren sounds, Imani is still moving between beds. The patients help one another where they can. Above the ward, the System struggles to assign a value to a room full of people who will not abandon anyone.`},
 f:{label:'Accept supplies without accepting patient removal, and fight the cutoff.',desc:'Use the system’s resources while resisting its terms.',title:'The Contract You Would Not Sign',body:`You take the power cells from the drone and refuse to provide the list it demands. Imani redirects the equipment to the most urgent wards while Tomas disconnects the drone’s kill switch.||The supply alarm summons hostile security units. Your medics never stop working. A nurse closes a privacy curtain in the drone’s face and goes back to changing a bandage.`},
 exit:{title:'The Last Ward Is Still Open',body:`Before Hour 66, Imani hands you the medical ledgers. Each page contains names, treatments, and handwritten notes from relatives. There are no percentages.||“Whatever happens tonight,” she says, “the world needs a record of the people we fought for.” You carry it toward the stadium roof as if it were a key.`,rememberE:'The hospital network survives by sharing scarce care and giving every patient a voice.',rememberF:'The hospital controls its own equipment, and the staff will not surrender a patient to a machine.'},
 echo:`The records briefly show deaths from other completed runs, including patients alive before you now. Imani studies the pages.||“If memory is evidence,” she says, “then we can use it to stop doing the same harm.” She tears out the false casualty forecast and keeps the real names.`
});
chron('wire',3,{art:'tower',title:'Dead Frequency III: The Story the System Cannot End',
