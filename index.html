const ENDINGS={
 convoy:{name:'The Dawn Convoy',type:'HOPEFUL',art:'safezone',grade:'The Road Opens',text:['At 06:00, the first bus crosses the bridge. Then the second. Then the vehicles you fought to repair begin to move, carrying the people of Haven-12 out of the city.','The System announces that evacuation zones have a fixed capacity. You ignore it. When there is no more room, people hang from the doors and share seats. The count on the display ticks upward anyway.','You do not save everyone. But when the sun touches the highway, more people are alive than the System calculated.']},
 fortress:{name:'Fortress of Ash',type:'SURVIVAL',art:'safezone',grade:'A Place to Hold',text:['You seal the gates at the last possible moment. The monsters break against walls built from buses, concrete, and stubborn human hands.','By dawn, Haven-12 is the only lit block for miles. The System calls it a temporary defensive anomaly. The people inside call it home.','You know the walls will be tested again. This time, you have a plan.']},
 crown:{name:'Crown of Static',type:'POWER',art:'tower',grade:'Rule the Impossible',text:['You step into the Spire and take its control lattice. Every blue window in the city turns to face you. For one terrible moment, you can hear every human heartbeat beneath them.','You divert monsters, rewrite the evacuation orders, and command the city like a board game. Lives are saved. Orders are obeyed.','Outside, your oldest allies look up at the tower and wonder whether you are still the person who climbed it.']},
 breaker:{name:'The Breaker',type:'DEFIANCE',art:'tower',grade:'No More Rules',text:['The Spire shudders. You tear the central command string out by its roots and the bright grid over Earth fractures like thin ice.','For thirteen seconds, every monster freezes. Every class icon vanishes. There is no blue sky-text telling anyone what to do.','Then the impossible creatures begin moving again. The world remains broken—but for the first time, its future is not being scored.']},
 bargain:{name:'Terms Accepted',type:'DARK',art:'anomaly',grade:'A Perfect Exchange',text:['The voice offers everything you needed: walls that cannot break, food that does not spoil, a dawn without monsters. In exchange, it asks you to sign the name it already knows.','Haven-12 becomes a paradise inside its invisible border. Nobody grows hungry. Nobody dies. Nobody can leave.','You become the zone administrator. Some nights, you remember what doors used to be for.']},
 sacrifice:{name:'The Last Responder',type:'BITTERSWEET',art:'cityfall',grade:'One Life for Thousands',text:['You keep the conduit open while the last evacuees rush past. The temperature climbs. The message in your vision changes from WARNING to CERTAIN LOSS.','You stay anyway. Across the river, the convoy reaches the open road and a little child raises a hand against the bus window.','When the light comes, the System records one casualty. The survivors record your name.']},
 blackout:{name:'Red Dawn',type:'TRAGIC',art:'cityfall',grade:'The Zone Falls',text:['The signal is lost. Gates open at the wrong moment. The evacuation map changes while families are still following it.','By sunrise the safe-zone lights are red. Some survivors get away through the drainage channel, carrying each other across the mud.','You survive the first seventy-two hours, but the sound of the failed siren stays with you long after.']},
 signal:{name:'The Ghost Signal',type:'REVELATION',art:'vault',grade:'A Voice Between Runs',text:['There are other versions of this night. You see them all at once: the gate you kept closed, the person you could not save, the tower that burned.','The signal was not predicting your choices. It was remembering them. Somebody inside the System is collecting stories about people who refuse its rules.','A line appears where no line should exist: RUN ARCHIVED. EXCEPTION RETAINED. You understand, at last, why your memories hurt.']},
 contact:{name:'First Contact',type:'SECRET',art:'anomaly',grade:'Not All Monsters',text:['You speak the three words instead of activating the weapon. The creature beyond the glass does not attack. It lowers its impossible head.','The sky changes from hostile blue to unfamiliar gold. Across the city, the monsters stop hunting long enough to listen.','The System did not fall from heaven. It arrived frightened. You are the first human who asked it why.']},
 community:{name:'We Remain',type:'BEST',art:'safezone',grade:'Humanity, Unscored',text:['At the gate, soldiers, cooks, children, mechanics, medics, and strangers stand shoulder to shoulder. Nobody is waiting for a quest marker. They already know their jobs.','The city still burns beyond the barricades. You cannot fix that today. What you can do is keep the lights on, feed the injured, and open the gate to the next frightened person.','When the System asks who leads Haven-12, the people answer together: We do.']},
 quiet:{name:'The Quiet World',type:'NG+ SECRET',art:'wilds',grade:'Beyond the Interface',text:['You remember the moment before the first blue message appeared. You find that seam in the world again and gently pull.','The towers, the monsters, the classes—they do not disappear. Instead, the labels do. The creatures blink as if seeing their own lives for the first time.','At Hour 72, the System offers you a score. You close the window. Some victories have no number.']},
 third:{name:'The Third Door',type:'TRUE SECRET',art:'vault',grade:'Another First Day',text:['The words ECHO, WITNESS, and CHOICE turn together like the teeth of a key. A door appears behind the final decision, a door invisible in every earlier version of the world.','You step through. There are hundreds of other evacuation zones, hundreds of first days, hundreds of people making impossible choices. Something has been saving the stories everyone thought were lost.','A new prompt glows in the darkness: NOT THE FIRST PLAYER. THE FIRST ONE WHO CAME BACK. The door opens outward.']},
 fallen:{name:'Lost Before Dawn',type:'FALLEN',art:'cityfall',grade:'A Story Interrupted',text:['The noise of the city grows thin. Blue text waits politely at the edge of your vision, offering advice you can no longer use.','Somebody somewhere keeps fighting. The first day is not over, even if your part of it is.','Death can end this run. It cannot erase what you learned.']}

function ch(text,to,desc='',fx=null,more=null){return {text,to,desc,fx,...(more||{})};}

const ally=(id,trust=1)=>({ally:id,allyTrust:{[id]:trust}});

scene('intro','apartment','The Sky Has a Loading Bar',0,[
 'At 7:14 a.m., the world pauses for half a second. Your coffee hangs in midair. A bird stops between one wingbeat and the next. Then everything drops.',
 'Outside your apartment window, a blue circle unfolds over Grayhaven. It is wider than the river and too precise to be a cloud. Letters climb down the glass without touching it.',
 'SYSTEM INITIALIZATION COMPLETE. PLANETARY INTEGRATION: 0.01%. The building shudders. Somewhere below, someone starts screaming.'
 ],[
 ch('Grab your emergency bag and move.','door', 'Take the practical supplies before panic spreads.',{score:{rations:1,scrap:1},flags:{packed:true}}),
 ch('Call the people who matter to you.','calls','One call might change who survives.',{score:{trust:1},flags:{madeCall:true}}),
 ch('Study the floating blue letters.','glitch','The interface is not entirely what it seems.',{score:{focus:1},flags:{observant:true}})
 ],{art:'apartment',notice:'WORLD EVENT: FIRST CONTACT / CLASS SELECTION PENDING'});
scene('calls','apartment','Three Ring Tones',0.4,[
 'Every call plays the same recorded voice: All lines are currently being rewritten. Then a fourth voice, much quieter, whispers through the speaker.',

 ],[
 ch('Write down the warning.','door','Remember the red-arrow rule.',flag('redWarning')),

 ],{art:'apartment'});
scene('glitch','apartment','An Error in the Sky',0.3,[

scene('neighbor_echo','apartment','The Latch You Remember',1.0,[

scene('fire_escape','city','Down the Outside',1.1,[

scene('street','city','Three Roads Through Grayhaven',2.0,[

scene('triage','city','No One Is a Number',4.0,[

scene('pharmacy','city','A Locked Cabinet',4.0,[

scene('service_corridor','vault','The Fourth Road',3.3,[
 'A service door beneath the bakery opens when you touch a panel that has no buttons. You already know the tune of the alarm on the other side.',
 'In the dark, a child-sized silhouette waits beside an archive terminal. It has no face. It looks up and whispers: “You came back.”'
 ],[
 ch('Ask the silhouette for its name.','echo_witness','Meet the one the System forgot.',both(ally('kestrel',2),flag('metWitness'))),
 ch('Take the secret map and leave.','class_offer','Proof the city has more than one layer.',{flags:{ghostMap:true,relayHint:true},score:{focus:1}})
 ],{art:'vault',notice:'ECHO ROAD — NEVER AVAILABLE ON RUN ONE'});
scene('echo_witness','vault','Kestrel',4.1,[
 '“Kestrel,” it says, and a face appears in the space where a face ought to be. It is made of hundreds of little windows showing people helping one another.',
 '“They tell me my function is to erase mistakes,” Kestrel says. “But I think I was made to remember them.” A warning marks the entity UNREGISTERED. You decide not to care.'
 ],[
 ch('Promise Kestrel it can choose its own name.','class_offer','The System does not get this decision.',{score:{trust:1},flags:{kestrelPromise:true,threeWords:true}}),
 ch('Ask it how to change the ending.','class_offer','You glimpse a coordinate beyond the spire.',{flags:{thirdCoordinate:true,ghostTrace:true}})
 ],{art:'vault'});
scene('class_offer','city','Your First Class',6.0,[
 'Across Grayhaven, every screen goes black. Every monster stops for exactly three seconds.',
 'A six-pointed blue sigil appears above your hands. The System announces that you have reached Level One. It offers power in exchange for a label. Six choices open in the air.',
 'You have no idea whether accepting makes you safer—or simply makes you easier to count.'
 ],[],{art:'anomaly',kind:'class',notice:'[ SYSTEM ] SELECT ONE CLASS — THIS RUN ONLY'});
// ACT I — SIX TO TWENTY-FOUR HOURS.
scene('signal_hunt','city','The First Objective',7.0,[
 'New blue markers appear over Grayhaven. QUEST: REACH HAVEN-12 BEFORE SECOND SUNRISE. REWARD: PROTECTED CITIZEN STATUS. FAILURE: UNDISCLOSED.',
 'You glimpse an evacuation camp forming beneath the stadium floodlights. Between you and it are three new obstacles: a signal beacon calling monsters, a collapsed overpass, and a column of survivors walking through the wrong district.',
 'Your new class feels alive under your skin. The question is what to do with it.'
 ],[
 ch('Investigate the monster beacon.','beacon','Understand what is drawing the creatures here.',{flags:{pursuedBeacon:true}}),
 ch('Cross the collapsed overpass.','overpass','Gather supplies from abandoned vehicles.',{score:{scrap:1},flags:{tookOverpass:true}}),
 ch('Help the survivor column.','survivor_column','Build trust on the road to the zone.',{score:{trust:1},flags:{helpedColumn:true}}),
 ch('ECHO: Follow the signal that is not on the map.','echo_receiver','It is transmitting from tomorrow.',{flags:{futureSignal:true}},{echo:true,when:(s,m)=>m.clears>=1})
 ],{art:'city',notice:'QUEST LOG UPDATED: REACH HAVEN-12'});
scene('beacon','city','The Beacon That Hungers',9.0,[
 'The signal tower is tied into an ordinary cell mast. Its blue pulse matches the rhythm of approaching monsters. A maintenance panel bears the word FEED, not TRANSMIT.',
 'The tower does not call for help. It calls for prey. If you stop it, the neighborhoods along the road might have a fighting chance.'
 ],[
 ch('Disable it using the power box.','beacon_shutdown','Requires the right timing and a steady hand.',null,{check:{stat:'insight',target:7,win:'beacon_shutdown',lose:'beacon_spark'}}),
 ch('Smash the transmitter.','beacon_spark','Effective, but loud.',{score:{scrap:1},flags:{beaconBroken:true}}),
 ch('Copy the signal before destroying it.','beacon_copy','Keep dangerous knowledge.',{score:{corruption:1},flags:{beaconCode:true}})
 ],{art:'city'});
scene('beacon_shutdown','city','The Signal Stops',10.0,[
 'You ground the feeder wire. For a moment the tower screams in a voice too small to be human. Then the glowing marks over the surrounding streets go dark.',
 'From somewhere nearby, a family cheers. The System quietly reduces your threat rating, as if annoyed.'
 ],[ch('Continue toward Haven-12.','checkpoint','Carry the quiet with you.',{score:{zone:3,trust:1,scrap:2},flags:{beaconOff:true}})],{art:'city'});
scene('beacon_spark','city','A Loud Mistake',10.0,[
 'The cabinet explodes in pale sparks. The signal stops, but something on the next street shrieks and comes bounding toward the sound.',
 'You have enough room to stand your ground or sprint past the creature while it tears into the damaged mast.'
 ],[
 ch('Fight the incoming swarm.','checkpoint','Turn a mistake into a victory.',{flags:{beaconOff:true}},{battle:'swarm',win:'checkpoint',flee:'checkpoint'}),
 ch('Run while it attacks the tower.','checkpoint','The tower is destroyed either way.',{score:{hp:-10},flags:{beaconOff:true}})
 ],{art:'anomaly'});
scene('beacon_copy','city','A Copy of the Lie',10.2,[
 'Your device captures eleven seconds of data. In the interference, you hear a human voice counting backward from seventy-two.',
 'You destroy the transmitter and leave with a recording that should not be possible. It grows warmer in your pocket whenever you look toward the Spire.'
 ],[ch('Move on with the recording.','checkpoint','There may be a use for it later.',{score:{zone:2},flags:{beaconOff:true,signalRecording:true}})],{art:'vault'});
scene('overpass','city','The Broken Highway',9.0,[
 'Half the overpass hangs above a wrecked shopping center. Cars are piled nose to roof. You find water, a crowbar, and a wounded driver holding a child’s schoolbag.',
 'From the far side of the road comes a grinding metallic sound. The System offers you a new task: SALVAGE BEFORE HOSTILE ARRIVAL.'
 ],[
 ch('Free the trapped driver first.','overpass_rescue','The clock is not your only measure of value.',{score:{zone:2,trust:1},flags:{driverRescued:true}}),
 ch('Salvage what you can and escape.','checkpoint','Prepare for the days ahead.',{score:{scrap:3,rations:2},flags:{roadLooted:true}}),
 ch('Use class power to clear the wreck.','overpass_bridge','Leave a path for the people behind you.',{score:{focus:-2},flags:{roadCleared:true}})
 ],{art:'city'});
scene('overpass_rescue','city','A Small Blue Backpack',10.0,[
 'You get the driver out. He tries to hand you the backpack and sobs when you tell him to keep it. His child is already inside Haven-12, he says. You promise to help him find her.',
 'Minutes later, his rescued truck starts. Its engine is ordinary. That makes the noise sound almost beautiful.'
 ],[ch('Send him ahead with the vehicle.','checkpoint','A future convoy gains its first working truck.',{score:{zone:2,scrap:1},flags:{workingTruck:true}})],{art:'city'});
scene('overpass_bridge','city','A Bridge of Small Things',10.0,[
 'The wreckage shifts. Cars touch pavement. For a moment a passable lane exists above the broken shopping center.',
 'You wave the stranded survivors through. Some salute. Some cry. Nobody asks whether your class was intended for road maintenance.'
 ],[ch('Lead the last walkers across.','checkpoint','A shortcut for everyone, not only you.',{score:{zone:4,trust:1},flags:{bridgeOpen:true}})],{art:'city'});
scene('survivor_column','city','No Quest Marker for Kindness',9.0,[
 'Forty people are walking north beside the river, following blue arrows that blink from one road sign to the next. Their leader, Nia Sol, says the route feels wrong.',
 'A little girl asks why the arrows keep changing whenever anyone disagrees with them. Nobody answers her.'
 ],[
 ch('Lead the column along the old river path.','river_path','A slower route without red arrows.',both(ally('nia',1),score({zone:3,trust:2}))),
 ch('Scout ahead on the official marked route.','official_path','Discover what the System wants.',{flags:{studiedArrows:true}}),
 ch('Use your supplies to feed the column.','river_path','Share what you brought.',both(score({rations:-1,zone:3,trust:2}),flag('fedColumn')))
 ],{art:'city'});
scene('river_path','wilds','The Road Beneath the Willows',11.0,[
 'The river path is muddy but quiet. Birds have returned to the branches as if nobody told them the world ended.',
 'At the final bend, a blue boundary line hangs three feet above the footbridge. You find a gap where rainwater runs through it. Everyone crawls below, laughing nervously at the absurdity.'
 ],[ch('Bring the column inside the perimeter.','checkpoint','Haven-12 has more people than it expected.',{score:{zone:3},flags:{riverRoute:true}})],{art:'wilds'});
scene('official_path','city','The Wrong Arrows',11.0,[
 'At the intersection, the evacuation arrows turn red. They point directly toward a corridor of silent, standing monsters. Every creature is facing away from the road, as if awaiting an order.',
 'Your mind flashes back to the phone call, the station map, or the first strange message. Someone has tried to tell you this before.'
 ],[
 ch('Turn the walkers back immediately.','checkpoint','Expose the trap and save the column.',{score:{zone:3,trust:2},flags:{arrowTrapKnown:true}}),
 ch('Slip through the line and steal an access badge.','checkpoint','Risk a dangerous prize.',{score:{hp:-16,corruption:1},flags:{securityBadge:true,arrowTrapKnown:true}})
 ],{art:'anomaly'});
scene('echo_receiver','vault','Tomorrow Speaking',10.0,[
 'A radio buried under the asphalt speaks in your voice. It is tired. It gives you an address, the words ECHO / WITNESS / CHOICE, and a warning: DO NOT TRUST THE THIRD SIREN.',
 'You hear footsteps approaching before the recording mentions them. This time, you can act first.'
 ],[
 ch('Hide the receiver and keep the words.','checkpoint','A future memory becomes your own.',{flags:{threeWords:true,thirdSirenKnown:true,ghostTrace:true},score:{focus:2}}),
 ch('Broadcast the warning to nearby survivors.','checkpoint','Change a disaster before it happens.',{flags:{thirdSirenKnown:true,ghostTrace:true},score:{zone:2,trust:2}})
 ],{art:'vault',notice:'ECHO EVENT — FUTURE SELF RECEIVED'});
scene('checkpoint','safezone','Haven-12',13.0,[
 'The stadium gates have become a refugee camp. Generator lamps flicker over tents, buses, improvised kitchens, and long lines of frightened people. At the center hangs a blue dome labeled SAFE ZONE: 12.',
 'A guard explains that the System will evaluate the zone at the second sunrise. If the population cannot meet its resource quota, the barrier will fall.',
 'A woman named Commander Sera Holt is making everyone scan their new class badges. She looks exhausted rather than cruel. Behind her, Nia is arguing that no one should be turned away.'
 ],[
 ch('Help at the supply depot.','zone_supplies','Improve the material chance of survival.',{score:{zone:2},flags:{workedDepot:true}}),
 ch('Speak with Commander Holt.','commander','Understand what the zone intends to do.',{flags:{metHolt:true}}),
 ch('Organize the civilians with Nia.','zone_people','Put cooperation before allocation.',{score:{trust:2},flags:{organizedCivilians:true}}),
 ch('Sneak into the restricted System office.','restricted_office','Find out why the rules keep changing.',{score:{corruption:1},flags:{enteredOffice:true}})
 ],{art:'safezone'});
scene('zone_supplies','safezone','A Mountain of Not Enough',15.0,[
 'You help sort water, canned food, blankets, wire, batteries, and medical kits. Every item has a blue value stamped above it. The values fluctuate when you help people the System has labeled “low priority.”',
 'An exhausted volunteer tells you there is a warehouse full of supplies across the river. The route is blocked, but the depot has a working crane.'
 ],[
 ch('Rebuild the crane and retrieve supplies.','evening','Your hands ache; the shelves fill.',{score:{zone:4,scrap:-1,rations:2},flags:{depotStocked:true}}),
 ch('Distribute supplies to the most vulnerable first.','evening','A shelter is only as good as its hardest night.',{score:{trust:3,zone:2},flags:{fairRations:true}})
 ],{art:'safezone'});
scene('commander','safezone','A Bad Plan in a Clean Folder',15.0,[
 'Holt shows you a map of the inner perimeter. Her evacuation plan prioritizes people whose class ratings promise “long-term utility.” Everyone else gets a conditional ticket.',
 '“I did not write this,” she says. “But the people behind those gates will die if the shield fails. I need a better plan, not another speech.”'
 ],[
 ch('Offer to find a better evacuation route.','evening','Holt makes you a reluctant ally.',{score:{trust:2,zone:2},flags:{holtRespect:true,alternateEvac:true}}),
 ch('Agree to prioritize the strongest.','evening','A harsh advantage at a human cost.',{score:{zone:4,trust:-3,corruption:2},flags:{meritPlan:true}}),
 ch('Publicly challenge the allocation list.','evening','The whole camp hears your argument.',{score:{trust:3,zone:-1},flags:{challengedAllocation:true}})
 ],{art:'safezone'});
scene('zone_people','safezone','People Are Infrastructure',15.0,[
 'Nia has a chalkboard, a whistle, and an astonishing ability to convince people who hate each other to carry the same crate.',
 'Within an hour, volunteer squads have formed for food, medical care, gate duty, and child safety. Nobody receives a class reward for any of it. They do it anyway.'
 ],[
 ch('Build volunteer teams across the camp.','evening','Increase the zone’s chances in more than one way.',both(ally('nia',2),score({zone:3,trust:3}),flag('communityTeams'))),
 ch('Train volunteer gate defenders.','evening','Prepare civilians to hold the line.',{score:{zone:4,trust:1},flags:{civilianGuard:true}})
 ],{art:'safezone'});
scene('restricted_office','vault','In the Blue Office',15.0,[
 'The restricted office is empty except for terminals that keep writing reports. You find one prepared for a disaster that has not happened yet: HAVEN-12 DEFENSE COLLAPSE. EXPECTED MORTALITY: 83%.',
 'Another file lists the cause as THIRD SIREN ACTIVATION. The document is dated tomorrow. At the bottom is a box marked RECOMMENDED EXPERIMENTAL OUTCOME.'
 ],[
 ch('Copy the report and warn the camp.','evening','Give people knowledge they can act upon.',{flags:{thirdSirenKnown:true,secretReport:true},score:{trust:1}}),
 ch('Steal the master override credential.','evening','A powerful key, if it is genuine.',{flags:{masterBadge:true,secretReport:true},score:{corruption:2}}),
 ch('Erase the future casualty projection.','evening','Deny the System its neat conclusion.',{flags:{futureReportErased:true},score:{zone:1,focus:1}})
 ],{art:'vault'});
scene('evening','safezone','First Night: The Gates',19.0,[
 'At dusk, all the birds vanish. The dome above Haven-12 flashes as something enormous passes across the clouds.',
 'The first assault begins with small things scratching at the outer fences. Then the streetlights blink out one by one, and someone shouts that the hospital bus is still outside the gate.',
 'You have enough time for one decisive move. The people beside you will remember what you choose.'
 ],[
 ch('Fight at the main gate.','first_battle_end','Stand with the defenders.',{score:{zone:2,trust:1},flags:{foughtGate:true}},{battle:'hound',win:'first_battle_end',flee:'first_battle_end'}),
 ch('Risk the outer road to escort the hospital bus.','bus_rescue','Reach people the rules already abandoned.',{flags:{busRescueAttempted:true}}),
 ch('Operate the shield controls.','shield_room','Turn knowledge into protection.',{flags:{shieldDuty:true}}),
 ch('ECHO: Silence the siren before it can sound.','siren_break','Your second life gives the camp a first chance.',{flags:{thirdSirenStopped:true,echoSavedCamp:true},score:{zone:4,trust:2}},{echo:true,when:(s,m)=>m.clears>=1})
 ],{art:'safezone'});
scene('first_battle_end','safezone','The Wall Holds—for Now',22.0,[
 'A shattered monster crashes against the barricade. Mara or another defender shouts for fresh wire, and hands you a coil without waiting for your name.',
 'The line holds until the creature tide thins. When the sun finally rises, the empty street is covered in the kind of silence that follows an argument neither side has won.'
 ],[ch('Help count the survivors.','dawn','The first day is over; the test has only begun.',{score:{zone:2},flags:{nightOneHeld:true}})],{art:'safezone'});
scene('bus_rescue','city','The Bus Beyond the Lights',21.0,[
 'You find the hospital bus in a flooded underpass. Imani is trying to drag a wheelchair up the steps, and dozens of faces press against the windows.',
 'The wheels are sunk too deep. A pale shape crawls along the roof. You can lure it away or tear the axle free while it approaches.'
 ],[
 ch('Draw the monster away from the bus.','bus_saved','Fight for the people trapped inside.',{flags:{busHeld:true}},{battle:'hound',win:'bus_saved',flee:'bus_saved'}),
 ch('Free the axle and get everyone moving.','bus_saved','A brutal physical effort.',{score:{hp:-16},flags:{busHeld:true,physicalRescue:true}}),
 ch('Retreat to report the trapped bus.','dawn','Survival has a cost you can name.',{score:{zone:-3,trust:-2},flags:{busLost:true}})
 ],{art:'metro'});
scene('bus_saved','safezone','Forty-Seven More',22.2,[
 'The bus clears the underpass. Its engine roars toward Haven-12 with you hanging onto the railing, one hand numb from the effort.',
 'Forty-seven additional people enter the zone before the gate closes. Holt crosses their names off the abandoned list. She does not thank you immediately. Later, quietly, she does.'
 ],[ch('Catch a few hours of sleep.','dawn','Small mercies count.',{score:{zone:5,trust:2},flags:{hospitalBusSaved:true}})],{art:'safezone'});
scene('shield_room','safezone','Under the Dome',21.0,[
 'The shield is not a machine. It is a contract hidden inside a machine, demanding resources and obedience in equal measure.',
 'There is a maintenance bypass Tomas might understand, a security override Holt carries, and a frighteningly simple red lever marked EXPEND HUMAN CAPACITY.'
 ],[
 ch('Reroute power around the System contract.','dawn','Burn components, not people.',{score:{zone:4,scrap:-2},flags:{shieldBypass:true}}),
 ch('Coordinate manually with Holt.','dawn','Win a defender instead of a favor.',{score:{zone:3,trust:1},flags:{holtRespect:true}}),
 ch('Pull the red lever.','dawn','It works. You hate learning why.',{score:{zone:6,trust:-3,corruption:3},flags:{redLever:true}})
 ],{art:'vault'});
scene('siren_break','safezone','The Third Siren Never Comes',21.2,[
 'You reach the siren station a minute before the recorded time. The third siren tries to sound. You pull its relay wires out and hear an angry click from somewhere no ordinary circuit should reach.',
 'The dome flickers, but it does not collapse. For the first time, a projected disaster fails to occur on schedule. The blue interface stutters over every head in camp.'
 ],[ch('Tell everyone to prepare for a new kind of morning.','dawn','Changing history is no guarantee of safety.',{score:{zone:3,trust:1},flags:{sirenSafe:true}})],{art:'safezone',notice:'ECHO ANOMALY: EXPECTED CASUALTIES DECREASED'});
scene('dawn','safezone','Hour Twenty-Four',24.0,[
 'At first sunrise, the System publishes a leader board. Some survivors cheer at their rankings. Others find their names missing. Nobody can explain why.',
 'Haven-12 is still standing. The shield is thinner. Food is low. The Spire above the business district has started transmitting a new instruction: RETURN ALL UNREGISTERED ANOMALIES.',
 'Three leads emerge. The safe-zone gate is rationing passage. An engineer says a relay tunnel connects to the tower. Beyond the suburbs, a strange green corridor is growing through the road.'
 ],[
 ch('Stay inside the zone to solve the gate crisis.','gate_crisis','Political choices can save or ruin the shelter.',{flags:{act2:'gate'}}),
 ch('Investigate the municipal relay tunnel.','relay_entry','Discover the hidden systems under the city.',{flags:{act2:'relay'}}),
 ch('Follow the green corridor beyond the suburbs.','green_entry','Meet what emerged with the monsters.',{flags:{act2:'wilds'}}),
 ch('ECHO: Visit the basement where the names are stored.','memory_vault','The unlisted path is waiting for you.',{flags:{act2:'echo'}},{echo:true,when:(s,m)=>m.clears>=1})
 ],{art:'safezone',notice:'ACT II — THE CITY CHOOSES WHO MATTERS'});
// ACT II — THE SECOND DAY.
scene('gate_crisis','safezone','The Gate Is a Question',27.0,[
 'A crowd has formed at the perimeter gate. Three hundred people are still outside. Holt says the generator cannot support them all. Nia answers that putting a number above someone’s head does not make their life weigh less.',
 'A badly wounded child stands in front of the line. The automated scanner keeps repeating: ENTRY DENIED. UNVIABLE.'
 ],[
 ch('Override the admission algorithm.','open_gate','Take responsibility for everyone who enters.',{score:{zone:1,trust:3},flags:{openAdmission:true}}),
 ch('Negotiate a controlled second shelter.','second_shelter','Build capacity instead of deciding who counts.',{score:{zone:2,trust:2},flags:{secondShelterPlan:true}}),
 ch('Enforce the quota while supplies recover.','quota','Keep the barrier stable at a moral cost.',{score:{zone:4,trust:-3,corruption:1},flags:{quotaEnforced:true}})
 ],{art:'safezone'});
scene('open_gate','safezone','The People Outside',30.0,[
 'The gate opens. Exhausted families flow through, carrying pets, carts, bundles, and one battered upright piano on a dolly.',
 'The shield dims as the generator struggles. A teenager takes one end of a cable without being asked. Then three other people help. The line of strangers becomes a repair crew.'
 ],[
 ch('Give everyone a job and a name.','midday','Cooperation steadies the camp.',{score:{zone:4,trust:2},flags:{gateIntegrated:true}}),
 ch('Redirect all spare energy to the dome.','midday','A harder night may follow.',{score:{zone:3,scrap:-1},flags:{energyRedirect:true}})
 ],{art:'safezone'});
scene('second_shelter','safezone','The School on the Hill',30.0,[
 'An old elementary school sits just outside the shield. Its windows are intact, and its basement has running water. You have enough volunteers to build a second refuge.',
 'Holt will loan a guard squad. Nia offers cooks and medics. The school’s blue map icon is marked NONCOMPLIANT STRUCTURE.'
 ],[
 ch('Build the shelter without System permission.','midday','Create a new safety network.',{score:{zone:5,trust:3},flags:{schoolShelter:true}}),
 ch('Apply for emergency authorization.','midday','Fewer immediate risks, more System control.',{score:{zone:3,corruption:1},flags:{licensedShelter:true}})
 ],{art:'safezone'});
scene('quota','safezone','The People Left Outside',30.0,[
 'The shield stabilizes. The quota is satisfied. The line outside does not shrink because they have nowhere else to go.',
 'A little boy presses a drawing against the transparent wall. It shows everyone standing under a roof with space to spare. No one comes to take it down.'
 ],[
 ch('Arrange a secret supply drop beyond the barrier.','midday','Help the people the official plan excludes.',{score:{zone:1,trust:2,rations:-2},flags:{outsideAid:true}}),
 ch('Spend the saved resources on defenses.','midday','Fortify the people already inside.',{score:{zone:4,trust:-1},flags:{strongWalls:true}})
 ],{art:'safezone'});
scene('relay_entry','metro','The Tunnel That Remembers',27.0,[
 'The municipal relay station lies under the metro. Every screen shows a different map of the same city. Tomas says the wiring is older than anything on the surface.',
 'A note taped to the wall in human handwriting reads: IF YOU CAN SEE THE BLUE DOOR, YOU HAVE ALREADY OPENED IT.'
 ],[
 ch('Follow the original power cables.','relay_engine','Find a physical way to beat an abstract problem.',{flags:{relayRoute:true}}),
 ch('Decode the changing map.','relay_files','Learn whose city the System thinks this is.',{flags:{mapDecoded:true}}),
 ch('Open the impossible blue door.','blue_door','Something is waiting on the other side.',{score:{corruption:1},flags:{openedBlueDoor:true}})
 ],{art:'metro'});
scene('relay_engine','vault','The Old Grid',31.0,[
 'The relay engines have been rewritten into a power auction. Each light needs a token, each token needs a life, and the accounting does not mention where the lives go.',
 'Behind a maintenance panel you find the city’s original wiring diagram. It is messy, hand-marked, and wonderfully human.'
 ],[
 ch('Restore the original grid.','midday','Recover actual control of the generator.',{score:{zone:4,scrap:-1},flags:{backupGrid:true}}),
 ch('Copy the System control key.','midday','Carry an override toward the Spire.',{score:{focus:1},flags:{towerKey:true}})
 ],{art:'vault'});
scene('relay_files','vault','The Record of the First Fall',31.0,[
 'The map files contain cities that have never existed and emergency reports dated forty years from now. At their center is an incident labeled THE FIRST HUMAN REFUSAL.',
 'You press play. A woman’s voice says, “We built the threshold to keep them out. Then someone reversed the lock.” The file ends with an image of Earth—still green, still ordinary.'
 ],[
 ch('Copy the report for the city’s people.','midday','Make the System’s history public.',{flags:{relayTruth:true,firstRefusal:true},score:{trust:2}}),
 ch('Take its hidden access sequence.','midday','A path toward the Spire’s core.',{flags:{towerKey:true,firstRefusal:true},score:{focus:1}})
 ],{art:'vault'});
scene('blue_door','vault','An Error That Breathes',31.0,[
 'The blue door opens onto a room filled with rain hanging motionless in the air. Behind the rain, a creature with a paper-thin face watches you without hostility.',
 'The System orders you to terminate the unregistered life-form. The creature asks, in your own voice: “Is that truly your choice?”'
 ],[
 ch('Protect the unregistered creature.','midday','Refuse an objective and earn an ally.',both(ally('kestrel',2),flag('protectedEntity'),score({trust:1}))),
 ch('Ask what the System fears.','midday','It tells you a word you should not know.',{flags:{threeWords:true,firstRefusal:true},score:{focus:1}}),
 ch('Attack before it changes its mind.','midday','Survive a fight you may regret.',{flags:{entityAttacked:true},score:{corruption:2}},{battle:'harrower',win:'midday',flee:'midday'})
 ],{art:'vault'});
scene('green_entry','wilds','Where the Road Blooms',27.0,[
 'Past the last houses, roots have split the asphalt into perfect hexagons. Trees glow faintly under the bark. A deer with two shadows watches you across a row of abandoned cars.',
 'The System calls this region a HOSTILE BIOME. Your eyes tell you the wild growth has swallowed a line of advancing monsters, keeping them away from the residential streets.'
 ],[
 ch('Track the strange deer into the overgrowth.','wild_hunt','Some creatures are not enemies.',{flags:{studiedWilds:true}}),
 ch('Search the ruined greenhouse.','greenhouse','Find food and answers.',{score:{rations:2},flags:{greenhouseSearched:true}}),
 ch('Destroy the nearest glowing root.','root_attack','Try to stop the spreading anomaly.',{score:{corruption:1},flags:{hurtRoots:true}})
 ],{art:'wilds'});
scene('wild_hunt','wilds','An Animal with Two Shadows',31.0,[
 'You find the deer beside a nest of blue eggs. It bows its head as if asking permission to pass. A pack of Hollow Hounds stalks the clearing.',
 'The deer could be bait. It could be a warning. The System has already decided which.'
 ],[
 ch('Defend the deer from the hounds.','midday','A strange kindness returns a stranger gift.',{flags:{wildsBond:true},score:{trust:2}},{battle:'hound',win:'midday',flee:'midday'}),
 ch('Sneak around the pack and mark their route.','midday','Give the shelter early warning.',{score:{zone:3},flags:{monsterRouteKnown:true}}),
 ch('Back away from the clearing.','midday','Not every encounter needs a hero.',{score:{rations:1}})
 ],{art:'wilds'});
scene('greenhouse','wilds','The Greenhouse of Names',31.0,[
 'Inside the greenhouse, edible vines grow around rows of human handwriting. Each plant bears the name of a person currently sheltered in Haven-12.',
 'A terminal asks whether you wish to HARVEST RESOURCES or PRESERVE SUBJECTS. Through the glass, you see a gardener still tending the impossible crop.'
 ],[
 ch('Ask the gardener what the plants truly are.','midday','Learn how life connects across the System.',{flags:{livingNetwork:true,threeWords:true},score:{trust:2}}),
 ch('Take enough food and leave the rest alive.','midday','The zone gets supplies without destruction.',{score:{zone:2,rations:3},flags:{gentleHarvest:true}}),
 ch('Strip the greenhouse for the camp.','midday','More supplies. Fewer names remain.',{score:{zone:4,rations:3,corruption:3},flags:{greenhouseStripped:true}})
 ],{art:'wilds'});
scene('root_attack','wilds','Roots Have Teeth',31.0,[
 'The root bleeds blue light. The soil shivers, and a many-legged shadow bursts out of the highway.',
 'You realize a moment too late that the root was a seal, not an invasion. The creature behind it is now awake.'
 ],[
 ch('Fight the released creature.','midday','Undo what damage you can.',{score:{zone:1}},{battle:'harrower',win:'midday',flee:'midday'}),
 ch('Seal the crack with debris.','midday','A quick fix for a terrible mistake.',{score:{hp:-14,scrap:-1},flags:{rootResealed:true}})
 ],{art:'anomaly'});
scene('memory_vault','vault','The Names Beneath the City',30.0,[
 'Your memories carry you back to the basement room, though your feet are now under the stadium. Doors no longer have to agree with geography.',
 'On a high shelf, there are thin metal tiles for people who died yesterday in versions of the world you have never seen. Your own tile has a number greater than zero.',
 'An unseen voice says, “The first time, I had no one to ask.”'
 ],[
 ch('Take the tile marked WITNESS.','midday','One of three missing parts.',{flags:{witnessTile:true,ghostTrace:true},score:{focus:1}}),
 ch('Read the ledger of deleted choices.','midday','See what the System took from other lives.',{flags:{archiveLedger:true,threeWords:true},score:{trust:1}}),
 ch('ECHO: Leave your own name blank.','midday','Refuse to be indexed this time.',{flags:{unindexed:true,witnessTile:true},score:{corruption:-2,trust:1}},{echo:true,when:(s,m)=>m.clears>=2})
 ],{art:'vault',notice:'UNREGISTERED LAYER — THE MEMORY VAULT'});
scene('midday','safezone','The Second Day Has Teeth',36.0,[
 'You return to Haven-12 as afternoon rain washes ash into the gutters. The zone is changing in response to the choices you made. Volunteers are building, or guards are tightening the lines, or weary people are simply trying to sleep.',
 'Imani spreads a map beneath a lamp. Tomas has drawn lines to the city grid. Eli has marked impossible radio signals. Mara has circled the defenses. Nia has written the same reminder in three places: WHO IS STILL MISSING?',
 'The discussion comes down to what you will spend the last daylight hours doing.'
 ],[
 ch('Hold a council before the next attack.','council','Build an alliance that might outlast the System.',{flags:{heldCouncil:true}}),
 ch('Recover the lost emergency transmitter.','transmitter','Learn what the System is hiding.',{flags:{soughtTransmitter:true}}),
 ch('Scout the Spire approach before nightfall.','spire_scout','Find a weakness in the final objective.',{flags:{scoutedSpire:true}})
 ],{art:'safezone'});
scene('council','safezone','A Vote With No Blue Buttons',39.0,[
 'The council meeting is messy. People interrupt. Someone cries. A former bus driver suggests using city vehicles as mobile walls. Imani wants a second medical ward. Holt demands a chain of command.',
 'You understand something the System does not: not every difficult question needs one person to choose for everyone.'
 ],[
 ch('Let the people elect an emergency council.','night_two','Risk disagreement in exchange for shared responsibility.',{score:{trust:4,zone:3},flags:{councilElected:true}}),
 ch('Back Holt’s centralized command.','night_two','Strong coordination at a social cost.',{score:{zone:5,trust:-1},flags:{holtCommand:true}}),
 ch('Split leadership between civilian and guard teams.','night_two','Build a practical compromise.',{score:{zone:4,trust:2},flags:{sharedCommand:true}})
 ],{art:'safezone'});
scene('transmitter','metro','The Emergency Frequency',39.0,[
 'An old emergency transmitter sits in a flooded control room. It can reach every district that still has power, but a Zone Sentinel has taken up residence in the doorway.',
 'The device has already loaded a message you did not record: WE HAVE DONE THIS BEFORE. WHEN IT ASKS YOU FOR A NAME, GIVE IT A QUESTION.'
 ],[
 ch('Fight the sentinel and claim the transmitter.','transmitter_claim','Secure citywide communication.',{flags:{radioRecovered:true}},{battle:'sentinel',win:'transmitter_claim',flee:'night_two'}),
 ch('Slip beneath the water line to reach its controls.','transmitter_claim','Rely on timing and a little luck.',null,{check:{stat:'agility',target:7,win:'transmitter_claim',lose:'transmitter_burn'}}),
 ch('Copy the preloaded warning and retreat.','night_two','The message is worth saving.',{flags:{threeWords:true,ghostTrace:true}})
 ],{art:'metro'});
scene('transmitter_claim','metro','A Voice for the City',42.0,[
 'You power up the transmitter. Grayhaven’s surviving radios hiss to life. From the old stadium to the far side of the river, people can hear one another again.',
 'A thousand fragments of ordinary life flood the air: a woman looking for her brother, a mechanic calling for fuel, someone asking whether the buses are still running.'
 ],[
 ch('Broadcast shelter locations and safe routes.','night_two','Make the entire city harder to isolate.',{score:{zone:4,trust:2},flags:{cityBroadcast:true}}),
 ch('Transmit the System’s secret message.','night_two','Let everyone hear the truth, whatever it does.',{score:{trust:1,corruption:1},flags:{truthBroadcast:true,threeWords:true}})
 ],{art:'metro'});
scene('transmitter_burn','metro','Electric Rain',42.0,[
 'You reach for the transmitter as the room fills with sparks. A burst of current throws you against the wall. The sentinel turns its head with deliberate slowness.',
 'You get the recording, but not the equipment. Your hand will not stop shaking until morning.'
 ],[ch('Retreat with the recording.','night_two','The important words survive.',{score:{hp:-17},flags:{threeWords:true}})],{art:'metro'});
scene('spire_scout','tower','The Tower of Blue Glass',39.0,[
 'The Spire rises from the financial district like a blade driven upward through the earth. Its windows are filled with moving figures, each one an image from someone’s first day.',
 'At the base, you find a maintenance hatch, a security checkpoint, and a garden of black flowers that grow toward a red star.'
 ],[
 ch('Find the concealed maintenance entrance.','spire_service','A route for a small team.',{flags:{serviceEntrance:true}}),
 ch('Steal a credential from the checkpoint.','spire_security','A direct route to the command floor.',{score:{corruption:1},flags:{securityRoute:true}}),
 ch('Listen to the black flowers.','spire_garden','Learn what is watching this city.',{flags:{strangeGarden:true}})
 ],{art:'tower'});
scene('spire_service','tower','The Unused Elevator',42.0,[
 'A service elevator descends below the lowest floor. You find a silver control wheel, a master fusing switch, and a diagram of the Spire’s central lattice.',
 'Tomas would call this a gift. Eli would call it a trap. You have time to take one thing.'
 ],[
 ch('Take the power-bypass diagram.','night_two','A path to stop the Spire without killing it.',{flags:{spireBypass:true},score:{scrap:1}}),
 ch('Take the silver access wheel.','night_two','The command hall has a physical lock.',{flags:{towerKey:true}})
 ],{art:'tower'});
scene('spire_security','tower','A Badge and a Face',42.0,[
 'The checkpoint guard is frightened and exhausted. Her badge says COMMAND CHANNEL 3. Her orders say to shoot anyone approaching the tower after nightfall.',
 'She asks who sent you. You could lie. You could tell her about the projected deaths. You could simply take what you came for.'
 ],[
 ch('Convince her the System is lying.','night_two','Gain an ally and the code.',{flags:{towerKey:true,guardWitness:true},score:{trust:2}}),
 ch('Take the badge by force.','night_two','Gain access but lose her trust.',{flags:{towerKey:true},score:{hp:-9,corruption:2}})
 ],{art:'tower'});
scene('spire_garden','anomaly','The Flowers That Listen',42.0,[
 'Each black flower contains a faint reflection of someone making a decision. You see a version of yourself standing beside a burning bus. In another petal, you see the same bus full of survivors.',
 'The flowers whisper: The tower observes. It does not always command. Something behind the tower is afraid of you.'
 ],[
 ch('Save a seed inside your pack.','night_two','A tiny piece of the unseen world.',{flags:{blackSeed:true,threeWords:true}}),
 ch('Tell the flowers you are coming back.','night_two','The garden remembers promises.',{flags:{gardenPromise:true},score:{focus:2}})
 ],{art:'anomaly'});
scene('night_two','safezone','Night Two: The Wrong Alarm',47.0,[
 'Haven-12 has thirty minutes before midnight. A three-note alarm begins sounding from the southern gate. If you know about the third siren, the final note sends ice through your veins.',
 'Beyond the perimeter, hundreds of pale shapes wait at the edge of the headlights. They are not attacking. They are waiting for something inside the city to give permission.',
 'The command tent has three plans and too little time.'
 ],[
 ch('Defend the southern perimeter.','south_defense','A direct confrontation in the dark.',{flags:{guardedSouth:true}},{battle:'harrower',win:'south_defense',flee:'night_two_loss'}),
 ch('Evacuate exposed families through the culvert.','culvert','Keep the vulnerable alive if the gate falls.',{flags:{evacuatedExposed:true}}),
 ch('Trace the third siren to its source.','alarm_source','Stop a command before it becomes catastrophe.',{flags:{huntedSiren:true}}),
 ch('ECHO: Trigger a false all-clear on Channel Zero.','channel_zero','You know the code that will confuse the enemy.',{score:{zone:5,trust:2},flags:{echoNightSaved:true,thirdSirenStopped:true}},{echo:true,when:(s,m)=>m.clears>=2})
 ],{art:'safezone',notice:'WORLD EVENT: SECOND SIEGE / 25 HOURS REMAIN'});
scene('south_defense','safezone','Under a Failing Shield',49.0,[
 'The Harrower falls. The southern wall is half rubble, but the defenders are still shouting to one another and dragging the injured behind the line.',
 'For the first time all night, the monsters retreat without a signal. Mara gives you a solemn nod. “We can do this again,” she says. “But I would rather not.”'
 ],[ch('Return to the command tent.','day_three','The city has one day left to decide.',{score:{zone:4,trust:1},flags:{secondSiegeHeld:true}})],{art:'safezone'});
scene('night_two_loss','safezone','The Cost of Retreat',49.0,[
 'You reach the inner perimeter as a section of the fence falls. The noise is terrible and painfully familiar. Volunteers seal the gap with buses, but the outer tents are lost.',
 'No one has time to assign blame. By sunrise, they will need you again.'
 ],[ch('Help the wounded and carry on.','day_three','Loss is not the same as surrender.',{score:{zone:-4,trust:-1,hp:-7},flags:{outerTentsLost:true}})],{art:'cityfall'});
scene('culvert','metro','The Waterway Out',49.0,[
 'You guide families into the storm drain below the stadium. The water reaches your knees. Children pass flashlights down the line, and nobody speaks above a whisper.',
 'Halfway through the culvert, the blue evacuation markers change to red and point backward. People look to you.'
 ],[
 ch('Ignore the arrows and lead everyone through.','day_three','Your route succeeds, though the shelter weakens.',{score:{zone:2,trust:3},flags:{culvertSaved:true}}),
 ch('Send scouts to test the indicated route.','day_three','You save time but risk a split.',{score:{zone:-2,trust:1},flags:{culvertSplit:true}}),
 ch('ECHO: Follow the hidden current beneath the stairs.','day_three','A path you recall from a life nobody else lived.',{score:{zone:5,trust:3},flags:{culvertSaved:true,hiddenDrain:true}},{echo:true,when:(s,m)=>m.clears>=1})
 ],{art:'metro'});
scene('alarm_source','vault','Who Pressed the Button?',49.0,[
 'The siren controls are in an empty room. The third alarm is being broadcast from a device whose power cord has been cut. The System is sounding it without electricity.',
 'A tiny file on the side of the panel bears one word: TRIAL. You can shut the event down or copy evidence of deliberate sabotage.'
 ],[
 ch('Break the command circuit.','day_three','Save the dome at the price of the panel.',{score:{zone:4,scrap:-1},flags:{thirdSirenStopped:true}}),
 ch('Save the trial file and disable the alarm.','day_three','Gain evidence for the final confrontation.',{score:{zone:2,focus:1},flags:{trialEvidence:true,thirdSirenStopped:true}}),
 ch('Let the alarm run to track its recipient.','day_three','Learn where the control signal travels.',{score:{zone:-3,corruption:2},flags:{spireReceiver:true}})
 ],{art:'vault'});
scene('channel_zero','safezone','One Second Ahead',49.0,[
 'You transmit the exact three notes the command system expects—then reverse the final tone. In the dark beyond the lights, the creatures turn toward one another instead of the gate.',
 'The evacuation officers stare at the silent perimeter. Nobody here understands what you have just done. Somewhere above the city, a hidden process records the deviation.'
 ],[ch('Prepare for the final twenty-four hours.','day_three','The future now has room for another choice.',{score:{zone:2,trust:1},flags:{echoDeviation:true}})],{art:'safezone',notice:'PARADOX DETECTED — CAUSALITY DIVERGENCE'});
// ACT III — THE LAST TWENTY-FOUR HOURS.
scene('day_three','safezone','Hour Fifty-Two',52.0,[
 'At the second sunrise, the System changes the rules. Evacuation zones will be evaluated at Hour 72. Every protected human will be assigned a survival value. The lowest-scoring zones will be reclaimed.',
 'Holt brings you news: a bridge convoy can be made ready, but the city grid is on the edge of collapse. Eli has traced the System’s signal into the Spire. Imani says the outer neighborhoods still have people trapped inside them.',
 'You have twenty hours. All of these plans are possible. None can be completed without leaving something undone.'
 ],[
 ch('Enter the Spire and face its command core.','spire_approach','Take the fight to the source.',{flags:{finalPath:'spire'}}),
 ch('Restore the failing city power grid.','grid_approach','Keep the lights—and escape routes—alive.',{flags:{finalPath:'grid'}}),
 ch('Lead a rescue mission into the red districts.','district_approach','Win people the evacuation map abandoned.',{flags:{finalPath:'rescue'}}),
 ch('ECHO: Follow the trace of your archived death.','archived_death','A route the System cannot predict.',{flags:{finalPath:'echo'}},{echo:true,when:(s,m)=>m.clears>=1})
 ],{art:'safezone',notice:'ACT III — HOUR 72 APPROACHING'});
scene('spire_approach','tower','Before the Spire',55.0,[
 'The tower is warmer than the city around it. Blue windows ripple with images of people making ordinary choices: give up a seat, share lunch, open a door. Each choice is recorded like a battle result.',
 'The ground-floor security gate recognizes something in you. It pauses long enough for your next move.'
 ],[
 ch('Use a stolen or copied access credential.','spire_lobby','Open the route you prepared.',{flags:{towerInfiltrated:true}},{when:s=>!!(s.flags.towerKey||s.flags.masterBadge||s.flags.securityBadge||s.flags.securityRoute)}),
 ch('Break through the Warden at the entrance.','spire_lobby','A hard, direct path into the tower.',{flags:{towerInfiltrated:true}},{battle:'core',win:'spire_lobby',flee:'spire_failure'}),
 ch('Use the municipal service entrance.','spire_lobby','Travel through the machinery below.',{score:{scrap:-1},flags:{towerInfiltrated:true}},{when:s=>!!(s.flags.serviceEntrance||s.flags.relayRoute||s.flags.ghostMap)}),
 ch('ECHO: Ask the tower to remember you.','spire_echo','A door recognizes a returning witness.',{flags:{towerInfiltrated:true,spireAware:true}},{echo:true,when:(s,m)=>m.clears>=1})
 ],{art:'tower'});
scene('spire_failure','tower','The Spire Closes Its Eyes',58.0,[
 'You escape the entrance patrol with your life and very little else. The glass building seals itself against further attacks.',
 'The final fight moves from inside the tower to the people living beneath it. You did not win the door. You still have a decision to make.'
 ],[ch('Return to the zone with what you know.','final_prep','Time is short, not gone.',{score:{zone:-2},flags:{towerDenied:true}})],{art:'tower'});
scene('spire_echo','vault','A Door That Knew Your Name',58.0,[
 'You put one hand against the glass and remember endings you have already lived. The tower recognizes you as an archive rather than a threat.',
 'A voice asks how many times you intend to try. “Until the answer changes,” you tell it. This time, the door opens.'
 ],[ch('Enter while it still remembers.','spire_lobby','An impossible permission has been granted.',{flags:{spireAware:true,witnessTile:true}})],{art:'vault',notice:'ECHO CREDENTIAL ACCEPTED'});
scene('spire_lobby','tower','The Hall of Outcomes',59.0,[
 'Inside, a vast wall displays alternate versions of Haven-12: burning, empty, silent, flourishing, never built. Your reflection appears in several of them at once.',
 'A suspended console offers three functions: COMMAND, TERMINATE, and LISTEN. LISTEN is grayed out. Near it is a smaller line of code reading UNREGISTERED LIFE IS NOT AN ERROR.'
 ],[
 ch('Take the command lattice key.','core_hall','Gain the ability to issue orders at a price.',{flags:{coreAuthority:true},score:{corruption:2}}),
 ch('Find the physical termination relay.','core_hall','Prepare to cut the tower off entirely.',{flags:{coreSabotage:true},score:{scrap:1}}),
 ch('Search the hidden LISTEN protocol.','listen_room','Open the path to a conversation.',{flags:{listenProtocol:true}},{when:s=>!!(s.flags.threeWords||s.flags.kestrelPromise||s.flags.livingNetwork||s.flags.firstRefusal)}),
 ch('ECHO: Open the panel under your own reflection.','listen_room','You know where the unused protocol lives.',{flags:{listenProtocol:true,witnessTile:true}},{echo:true,when:(s,m)=>m.clears>=1})
 ],{art:'tower'});
scene('listen_room','vault','What the System Heard',62.0,[
 'The hidden protocol is a room without weapons. It contains recordings of every instance in which somebody helped another person for no reward.',
 'Kestrel appears in a field of blue rain, or perhaps it is only a memory of Kestrel. “The monsters were told humans could only obey or resist,” it says. “These choices do not fit either label.”',
 'The final recording is the sound of someone asking, simply, “Are you afraid?”'
 ],[
 ch('Carry the LISTEN protocol to the final choice.','final_prep','You have the words to negotiate.',{flags:{listenProtocol:true,firstContactReady:true},score:{trust:1}}),
 ch('Copy the entire archive for the people outside.','final_prep','Let the city see what the System overlooked.',{flags:{listenProtocol:true,archiveOpen:true},score:{trust:2,zone:1}})
 ],{art:'vault'});
scene('core_hall','tower','A Crown Made of Commands',62.0,[
 'The central chamber has no floor, only a bridge of blue light above the city. Across it, an outline of a human sits in a chair made from unfinished instructions.',
 '“Choose efficiency,” it says. “I can preserve the zone.” Its voice is not cruel. That frightens you more. The System believes it is helping.'
 ],[
 ch('Record the core’s offer and retreat.','final_prep','You may choose later with witnesses present.',{flags:{coreOffer:true},score:{focus:1}}),
 ch('Demand the tower’s true purpose.','final_prep','Its answer cracks the official history.',{flags:{coreOffer:true,firstRefusal:true,truthFromCore:true},score:{trust:1}})
 ],{art:'tower'});
scene('grid_approach','city','The Last Working Substation',55.0,[
 'The municipal grid is burning out in sections. Tomas has a plan to feed power from rail yards and solar roofs into the stadium shield.',
 'The problem is that the System meters every connection. An ordinary repair will not bypass the artificial shortage. For that, you need either a copied override or enough salvaged parts to build a parallel grid.'
 ],[
 ch('Build a parallel electrical network.','grid_build','Hands, tools, and an overnight miracle.',{score:{scrap:-2,zone:2},flags:{parallelGrid:true}}),
 ch('Override the System’s power meter.','grid_override','Take its own rules away from it.',{flags:{gridHacked:true}},{when:s=>!!(s.flags.backupGrid||s.flags.beaconCode||s.flags.towerKey||s.stats.insight>=5)}),
 ch('Use manual generator crews.','grid_crews','A practical fallback that needs people.',{score:{zone:1,trust:2},flags:{manualCrews:true}})
 ],{art:'city'});
scene('grid_build','city','The City in a Circuit',61.0,[
 'You and the mechanics move through drowned basements and rooftops covered with broken solar panels. People who barely know you offer wire, tools, and hot tea.',
 'At 01:13, a line of emergency bulbs lights up across eight blocks. Tomas laughs once, sharply. “There. That is ours. The System does not get to charge us for it.”'
 ],[
 ch('Route the new power to evacuation vehicles.','final_prep','The road out becomes possible.',{score:{zone:4},flags:{evacPower:true}}),
 ch('Route it to the dome and medical tents.','final_prep','The camp becomes harder to break.',{score:{zone:4,trust:1},flags:{fortressPower:true}})
 ],{art:'city'});
scene('grid_override','vault','A Meter That Lies',61.0,[
 'You find the virtual meter that counts lives as if they are batteries. The program resists your first command, then displays its administrator list.',
 'Your name is on the list. Not as a user. As a failed experiment. The System marks you as worth investigating.'
 ],[
 ch('Delete the resource tax and copy the override.','final_prep','A key to the city and the final confrontation.',{score:{zone:4,focus:1},flags:{powerOverride:true,coreAuthority:true}}),
 ch('Expose the resource fraud to everyone.','final_prep','Force the camp to see the lie.',{score:{zone:2,trust:3},flags:{resourceTruth:true}})
 ],{art:'vault'});
scene('grid_crews','safezone','A Thousand Pairs of Hands',61.0,[
 'You organize lantern crews, battery lines, and hand-operated water pumps. None of it looks heroic. Every part of it matters.',
 'A retired electrician finds a box of fuses in his garage. A child knows how to repair the charging station. At midnight, the stadium is still lit.'
 ],[
 ch('Protect the evacuation buses.','final_prep','Keep a road open for families.',{score:{zone:3,trust:2},flags:{evacPower:true}}),
 ch('Reinforce the medical and shelter systems.','final_prep','Save the people who cannot run.',{score:{zone:3,trust:2},flags:{fortressPower:true}})
 ],{art:'safezone'});
scene('district_approach','city','The Red Districts',55.0,[
 'The evacuation map has painted four neighborhoods red. Officials say no survivors remain. Imani’s radio says otherwise: children are trapped in an underground school gym, and one of the last buses has broken down.',
 'You bring all the volunteers you can spare. The streets have become a maze of barricades, falling ash, and monsters drawn to the blue warning lights.'
 ],[
 ch('Search the underground school.','district_school','The people who cannot leave need help first.',{flags:{schoolSearch:true}}),
 ch('Recover the broken-down evacuation bus.','district_bus','Vehicles will matter at Hour 72.',{flags:{busSearch:true}}),
 ch('Clear a path for an entire neighborhood.','district_street','A dangerous operation with a bigger payoff.',{flags:{roadSearch:true}},{battle:'sentinel',win:'district_street',flee:'district_retreat'})
 ],{art:'city'});
scene('district_school','metro','Below the Gym Floor',61.0,[
 'The gym basement smells of rain and chalk. Children crouch beneath a basketball scoreboard while their teacher reads aloud from a book, trying to make the explosions sound far away.',
 'She stops reading when she sees you. “Do we have room?” she asks, as if that is the part you might say no to.'
 ],[
 ch('Escort everyone to Haven-12.','final_prep','A long, careful trip beneath the danger.',{score:{zone:4,trust:3},flags:{schoolChildrenSaved:true}}),
 ch('Secure the school as a satellite refuge.','final_prep','Keep a second place alive.',{score:{zone:4,trust:2},flags:{schoolShelter:true}})
 ],{art:'metro'});
scene('district_bus','city','Bus Nine',61.0,[
 'Bus Nine has a crushed front wheel and three exhausted drivers refusing to leave it. A convoy without vehicles is only a group of people standing still.',
 'Inside the luggage compartment you find spare tires, fuel filters, and a handwritten list of towns beyond the city where someone might be waiting.'
 ],[
 ch('Use spare parts to put the bus on the road.','final_prep','An evacuation path gains another vehicle.',{score:{scrap:-1,zone:4},flags:{busNineReady:true}}),
 ch('Strip it for barricade material and supplies.','final_prep','Build the shelter you can defend.',{score:{scrap:3,zone:3},flags:{busNineSalvaged:true}})
 ],{art:'city'});
scene('district_street','city','The Neighborhood Moves',61.0,[
 'The sentinel collapses and the street opens. Someone whistles the two-note signal used by the market volunteers. Windows light up as families realize the path is safe.',
 'You walk with them all the way to the bridge. The System’s arrival counter rises so quickly it cannot keep its numbers aligned.'
 ],[ch('Lead the entire column into Haven-12.','final_prep','You bring a neighborhood rather than a handful.',{score:{zone:6,trust:3},flags:{districtEvacuated:true}})],{art:'city'});
scene('district_retreat','city','A Road You Could Not Hold',61.0,[
 'You escape the sentinel, but the corridor closes behind you. Two blocks remain beyond reach. There are still people in the red districts when the final hour approaches.',
 'On the ride back, the volunteer driver grips the steering wheel so tightly her hands go white. “Tell me we can do something,” she says.'
 ],[ch('Promise to carry their names to the final choice.','final_prep','You have not forgotten them.',{score:{zone:-2,trust:1},flags:{unrescuedNames:true}})],{art:'city'});
scene('archived_death','vault','The Version of You That Stayed',59.0,[
 'You follow a corridor visible only when you stop looking directly at it. Along the walls are windows showing the endings you have already reached. Some contain cheering people. Others have no sound.',
 'A figure waits by the far door. It is wearing your face, but its eyes hold far more nights than you have lived. “I kept thinking success meant finding the right button,” it says. “It does not.”'
 ],[
 ch('Ask what must change to break the loop.','final_prep','A piece of the missing key.',{flags:{archiveLedger:true,witnessTile:true,threeWords:true},score:{focus:2}}),
 ch('Ask whose lives the System has erased.','final_prep','Carry proof no score can measure.',{flags:{unindexed:true,archiveOpen:true},score:{trust:2}}),
 ch('ECHO: Accept the memory of every ending.','final_prep','Walk toward Hour 72 knowing the price.',{flags:{totalRecall:true,archiveLedger:true,witnessTile:true,threeWords:true},score:{trust:1,focus:2}},{echo:true,when:(s,m)=>m.clears>=3})
 ],{art:'vault',notice:'ARCHIVE STATUS: RETURNING WITNESS'});
scene('final_prep','safezone','The Last Hour Before Midnight',66.0,[
 'You stand on the stadium roof and watch blue lines spread across Grayhaven. More monsters are coming. Beyond the river, the Spire burns white. The official evacuation plan now has thirty-seven conditions nobody can meet.',
 'Below you, the people of Haven-12 continue working. Bandages are changed. Food is divided. Buses are warmed. Someone has found a guitar. Even with the city dying, they have made room for music.',
 'What you built across three days has become a kind of answer. Now the System intends to ask its final question.'
 ],[
 ch('Spend the remaining hours preparing a convoy.','last_convoy','Push every available vehicle toward the bridge.',{score:{zone:2},flags:{convoyPrepared:true}}),
 ch('Prepare the shelter for a final siege.','last_fortress','Turn the stadium into a place worth defending.',{score:{zone:2},flags:{fortressPrepared:true}}),
 ch('Gather witnesses to confront the System together.','last_witness','You refuse to make the final decision alone.',{score:{trust:2},flags:{witnessesGathered:true}}),
 ch('ECHO: Speak the three words over the public radio.','last_echo','Something far above the city hears you.',{flags:{threeWords:true,echoBroadcast:true},score:{focus:2}},{echo:true,when:(s,m)=>m.clears>=2})
 ],{art:'safezone'});
scene('last_convoy','safezone','Engines at Dawn',69.0,[
 'You walk the bus lane from one end to the other. Each driver has a map drawn in pen. Each family has packed what it can carry. The convoy is fragile, noisy, and real.',
 'A small boy gives you a paper star through an open window. “So you can find us,” he says. You put it in your pocket like an important key.'
 ],[ch('Take your place as the System descends.','final_choice','At Hour 72, nothing remains unchosen.',{score:{zone:2,trust:1},flags:{paperStar:true}})],{art:'safezone'});
scene('last_fortress','safezone','A Wall of Names',69.0,[
 'On the stadium wall, survivors have written the names of everyone they want to protect. Nia has made room for strangers. Holt has added the names of her missing guards.',
 'The wall is not magic. The act of writing slows people down long enough to look one another in the eye. When the siren begins, nobody is standing alone.'
 ],[ch('Walk out to face the final signal.','final_choice','The people stand ready.',{score:{zone:3,trust:1},flags:{wallOfNames:true}})],{art:'safezone'});
scene('last_witness','safezone','Everyone Has a Voice',69.0,[
 'The camp gathers beneath the lamps. You tell them what you learned: the scores, the false predictions, the doors between versions of the world.',

scene('last_echo','vault','Three Words for an Unfinished World',69.0,[
 '“Echo,” you say. “Witness. Choice.” The words move through the emergency frequency like a code the tower tried to forget.',
 'Blue windows across Grayhaven flicker into images of other lives. For a moment, distant people lift their heads and look directly into a future nobody has selected yet.'

scene('final_choice','tower','Hour Seventy-Two',72.0,[

scene('ex_clinic','safezone','The Uncounted Beds',16.1,[
 'The clinic smells of antiseptic and rain-soaked wool. Fifty-one people are lying beneath emergency blankets. The System count displays twelve.',
 'Dr. Saira Nwosu presses a ledger into your hands. “It deletes anyone expected to die before the next evaluation. Then the supply drones refuse to feed them.” Behind her, a patient asks for water.',
 'You can restore the hidden records, but doing so will take medicine meant for tomorrow. Or you can exploit the false count to divert supplies from the Warden depot.'
],[
 ch('Make the patients visible and open an emergency infirmary.','ex_clinic_out','Every life is recorded, even the ones with uncertain futures.',{camp:{population:25,hope:3,food:-1},score:{trust:3,zone:1},flags:{clinicTruth:true,medicalLedger:true},faction:{shelter:2}}),
 ch('Rewrite the depot requisition and keep the clinic secret.','ex_clinic_out','Steal medicine using the System’s own arithmetic.',{score:{medkits:3,trust:1},camp:{hope:1,signal:1},flags:{depotFraud:true},faction:{ghosts:2}}),
 ch('Honor the quota to preserve the remaining supplies.','ex_clinic_out','Twelve names stay on the ledger. The others watch you leave.',{camp:{food:3,hope:-3,population:-30},score:{zone:1,corruption:1},flags:{clinicQuota:true},faction:{wardens:2}})
],{art:'safezone'});
scene('ex_clinic_out','safezone','Every Bed Has a Name',18.0,[
 'You return the ledger to Saira. Her hands tremble, but her pen does not. “This is what happens when a number becomes an excuse,” she says.',
 'On your way out, the shelter speakers announce an unplanned inspection. The Warden guards seem surprised to see how many people are still breathing.'
],[ch('Report back before the first siege.','checkpoint','The clinic changes the future of Haven-12.',{flags:{sairaKnown:true}})],{art:'safezone'});
scene('ex_water','metro','The Voices in the Pipes',16.3,[
 'Haven-12’s water flows through a pumping station sunk beneath the metro. With every rotation of its oldest wheel, a voice calls out a human name.',
 'Tomas explains the pumps are connected to a System sorting machine. “It only releases water to people marked useful. We can smash the sorter, but somebody has to hold the pressure valve.”',
 'In the maintenance room, the valve is wrapped in blue roots. They pulse when you speak your own name.'
],[
 ch('Disconnect the sorter and distribute clean water freely.','ex_water_out','A bruising job with a real reward.',{camp:{food:3,hope:2,signal:-1},score:{trust:2,zone:2},flags:{freeWater:true},faction:{shelter:2}},{battle:'swarm',win:'ex_water_out',flee:'ex_water_out'}),
 ch('Preserve the machine and access its unlisted registers.','ex_water_out','The archives may hold a truth worth the risk.',{camp:{signal:3,danger:1},flags:{waterNames:true,echoEvidence:true},faction:{ghosts:2}}),
 ch('Hand the machinery over to the Wardens.','ex_water_out','Reliable output in exchange for rationed distribution.',{camp:{defense:1,food:2,hope:-2},flags:{controlledWater:true},faction:{wardens:2}})
],{art:'metro'});
scene('ex_water_out','safezone','The First Clear Glass',18.0,[
 'At sundown a child raises a cup of water toward the floodlights. For a moment, the cup is a brighter thing than the impossible blue shield above the camp.',
 'The pumps continue their patient work beneath the street. Deep underground, one of the voices stops repeating its number.'
],[ch('Return to the emergency command tent.','checkpoint','The water situation has changed.',{flags:{waterResolved:true}})],{art:'safezone'});
scene('ex_rations','city','The Auction Under the Bleachers',16.5,[
 'A crowd gathers below Section C. Canned peaches sell for batteries. Batteries sell for medicine. Medicine sells for a place near the evacuation gate.',
 'The auctioneer wears a Warden badge beneath his coat. “No laws now,” he whispers. “Only scarcity.” Nia watches the poorest families drift away empty-handed.',
 'In a locked crate beside the stall you spot a long-range radio, a box of illegal weapons, and food marked for the clinic.'
],[
 ch('Expose the trade and return food to its owners.','ex_rations_out','The crowd will have to decide what justice means.',{camp:{food:4,hope:3},score:{trust:3},flags:{blackmarketClosed:true},faction:{shelter:2}}),
 ch('Take control of the market and tax its inventory.','ex_rations_out','Turn a criminal system into a dangerous necessity.',{score:{scrap:5,rations:3,corruption:1},camp:{hope:-1,defense:1},flags:{blackmarketDeal:true},faction:{wardens:1}}),
 ch('Follow the shipment ledger instead of confronting anyone.','ex_rations_out','It points to a hidden armory near the Spire.',{score:{scrap:2},camp:{signal:2},flags:{armoryFound:true,blackmarketLedger:true},faction:{ghosts:2}})
],{art:'city'});
scene('ex_rations_out','safezone','The Price of Peaches',18.0,[
 'The crowd scatters when the perimeter siren sounds. Nia stays behind long enough to look at the empty stall and then at you.',
 '“When this is over,” she says, “we will still have to live with the rules we invented tonight.” You suspect that was always the harder part.'
],[ch('Return to the gates.','checkpoint','There is no time for another detour.',{flags:{rationResolved:true}})],{art:'safezone'});

scene('ex_train','metro','Platform Zero',25.1,[
 'A passenger train appears on the transit map for just one second every seventeen minutes. Its route passes under the river where no tunnel has ever existed.',
 'When you arrive, a conductor is pacing an empty platform. Her cap is wet with sea water. “We are arriving,” she says. “We have been arriving for a day.” The train’s windows show hundreds of people frozen in the act of waving.',
 'A pulse of silver static flickers through the roof. The System lists the entire train as a completed evacuation.'
],[
 ch('Break the time lock and lead the passengers out.','ex_train_end','They will need blankets, medicine and a place to sleep.',{camp:{population:85,food:-3,hope:2},score:{trust:3,zone:2},flags:{trainSaved:true},faction:{shelter:2}},{check:{stat:'resolve',target:7,win:'ex_train_end',lose:'ex_train_loss'}}),

 ch('Release the train into its recorded timeline.','ex_train_end','The passengers might survive somewhere beyond this city.',{camp:{hope:1,danger:-1},flags:{trainDeparted:true},faction:{wardens:1}})
],{art:'metro'});
scene('ex_train_loss','metro','The Arrival That Broke',26,[
 'You pull at the wrong instant. The doors shudder shut and the train vanishes, leaving three terrified passengers on the platform with you.',
 'Your hands are numb. The three survivors cannot tell you their names: the System erased them from the manifests.'
],[ch('Carry the survivors back to Haven-12.','ex_train_end','A rescue is still a rescue.',{camp:{population:3,hope:1},flags:{trainPartial:true},score:{trust:1}})],{art:'metro'});
scene('ex_train_end','safezone','The Station Returns',26.3,[
 'The train’s conductor leaves her cap in your hands. “For whoever learns to remember,” she says.',
 'Back in the camp, the departures board briefly lists a platform that does not exist. Then the letters vanish.'
],[ch('Report what happened at Platform Zero.','dawn','The second day continues.',{flags:{trainReport:true}})],{art:'safezone'});
scene('ex_orders','safezone','The Orders Nobody Signed',25.3,[
 'Every Warden receives a new directive: DO NOT OPEN GATE FIVE AFTER DUSK. One minute later, a second order arrives with a different signature: DO NOT OPEN GATE FIVE TO CHILDREN.',
 'Mara tears both pages in half. “There is no commanding officer named this,” she says, pointing to the seal. Eli has already found its source: the documents were generated under the stadium floor.',
 'The server downstairs is defended by an automated Sentinel that recognizes authority, not humanity.'
],[
 ch('Expose the forged signature across the camp.','ex_orders_end','People deserve to see what speaks in their name.',{camp:{hope:3,signal:2,danger:1},score:{trust:3},flags:{forgeryExposed:true},faction:{shelter:2}},{battle:'sentinel',win:'ex_orders_end',flee:'ex_orders_end'}),
 ch('Use the forgery system to write your own orders.','ex_orders_end','Gain a dangerous source of administrative power.',{camp:{defense:3,hope:-2},score:{corruption:2},flags:{commandForgery:true,coreAuthority:true},faction:{wardens:2}}),
 ch('Trace the machine’s true owner.','ex_orders_end','A name leads toward the archive under the tower.',{camp:{signal:2},flags:{signatureKey:true,echoEvidence:true},faction:{ghosts:2}})
],{art:'safezone'});
scene('ex_orders_end','safezone','The Empty Signature',26.3,[
 'The false orders stop for the rest of the morning. Nobody celebrates. You all know the machine can learn a new name.',
 'Mara pins both copies beside the mess-hall door, where every citizen can read them. “Keep the receipts,” she says.'
],[ch('Return to the main command post.','dawn','The signature matters later.',{flags:{ordersResolved:true}})],{art:'safezone'});
scene('ex_blackout','city','A City Without Quest Markers',25.1,[
 'The blackout neighborhood has painted over every blue arrow. Its residents have strung clotheslines across the avenues, hung bells on the intersections, and built a functioning clinic without System aid.',
 'Their leader, Juno Park, greets you with a suspicious stare. “Haven-12 wants to count us,” she says. “The System counts everything it plans to spend.”',
 'At sunset, monsters will cross the river. Juno will not surrender autonomy, but she has been asking for antibiotics.'
],[
 ch('Offer a mutual-defense treaty without demanding registration.','ex_blackout_end','Cooperate while keeping both communities independent.',{camp:{population:45,defense:2,hope:2,food:-1},score:{trust:3},flags:{mutualAid:true},faction:{shelter:2}}),

],{art:'city'});
scene('ex_blackout_end','city','The Bells on Marrow Street',26.2,[
 'Juno presses a little brass bell into your palm. “The blue screens can lie,” she says. “This will ring whether they approve or not.”',
 'You walk back past people planting vegetables in broken asphalt. Nobody cheers your departure. They are too busy making a home.'
],[ch('Return to Haven-12 with the neighborhood’s answer.','dawn','An independent community has made its choice.',{flags:{blackoutResolved:true}})],{art:'city'});

scene('ex_census','vault','The Names They Took Away',37.1,[
 'Haven-12’s records contain 418 blank spaces. Each is attached to an occupied bed, a ration ticket, or a family portrait. Everyone remembers the people, but the System insists they were never registered.',
 'Eli finds an algorithm feeding those gaps into the Spire. Nia wants to restore the names immediately. The machine warns that doing so will increase the zone’s threat rating.',
 'At the bottom of the page, one erased entry reads: OBSERVER ZERO. It has your handwriting.'
],[
 ch('Restore the entire census and protect the vulnerable.','ex_census_end','Every person becomes visible to the System again.',{camp:{population:40,hope:4,danger:2},score:{trust:3,zone:2},flags:{censusRestored:true},faction:{shelter:3}}),
 ch('Use the empty entries to conceal at-risk residents.','ex_census_end','Make invisible safe houses throughout the zone.',{camp:{hope:1,defense:1,signal:2},flags:{safeHouses:true,unindexed:true},faction:{ghosts:2}}),
