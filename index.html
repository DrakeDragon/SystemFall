 entry:`At Hour 52, the tower begins broadcasting a message through every speaker in Grayhaven: THE FINAL OUTCOME HAS ALREADY BEEN SELECTED. Eli knows the voice. It belongs to the librarian process you may have confronted in the hidden archive.||A corridor of unindexed doors has opened beneath the Spire. Kestrel stands at its entrance, if you helped it survive, or leaves a single written instruction if you did not: ASK WHAT HAPPENS TO THE STORIES THAT FAIL.`,
 a:{label:'Follow the unindexed witnesses into the archive’s lowest floor.',desc:'Find who remembers the lives erased between iterations.',title:'The Corridor of People Not Counted',body:`The corridor walls are covered with names written in different handwriting. Kestrel guides you past records of neighborhoods that were erased from a version of the city after somebody chose the wrong gate.||A room at the end holds hundreds of small lights. Each light is a preserved choice made for another person without expecting a reward. You recognize some of them from this run. Others are painfully familiar for reasons you cannot explain.`},
 b:{label:'Climb the transmission spine and sever the final command relay.',desc:'Interrupt the evaluation before it becomes permanent.',title:'The Wire Above the City',body:`You ascend through a maintenance shaft filled with static. Each rung of the ladder displays a different warning: VOLUNTARY COMPLIANCE RECOMMENDED, ALTERNATE HISTORY UNSTABLE, DO NOT REMEMBER.||At the top, Eli finds a hardware switch the System has disguised as a decorative panel. Someone once intended for an ordinary person to turn it off. The switch is locked behind a voiceprint that sounds exactly like yours.`},
 pivot:{title:'The Keeper of Failed Days',body:`In a chamber beneath the core, the librarian process appears as a projection of an ordinary child holding a book with no words. It tells you the System has been repeating the first seventy-two hours to find one survivable arrangement for humanity.||Eli asks why the iterations are kept secret. “Because certainty requires obedience,” the child answers. Kestrel, or the memory of it, shakes its head. “That is not the same as hope.”`,rememberA:'The unindexed voices stand behind you, carrying evidence that erased people have not stopped being real.',rememberB:'You have reached the final relay and know its physical weakness.'},
 c:{label:'Invite the librarian to witness a choice it cannot calculate.',desc:'Prove that compassion is not a rounding error.',title:'The Unscored Minute',body:`You connect the chamber to Haven-12’s public radio and ask someone to describe an act of help that brought no reward. Responses arrive one after another: a repaired shoe, a held door, a cup of water, a child reading to a stranger.||The projection listens. For sixty seconds, the city’s threat indicators stop updating. It is the first minute of the invasion the System has not used to calculate somebody’s value.`},
 d:{label:'Use the physical relay to preserve a copy of the erased histories.',desc:'Make truth survive even if the tower resets.',title:'The Archive Cannot Close',body:`You slip the copied records into the maintenance relay and wire it to the old emergency grid. The archive tries to revoke access, but the mechanical switch was built before the System existed.||Across Grayhaven, disconnected radios begin playing fragments of lost stories. Families hear voices they believed were gone. The tower’s evaluation clock runs slower, not because time has changed, but because it no longer owns every message.`},
 reveal:{title:'A Question with No Accept Button',body:`The librarian offers two outcomes. It can freeze humanity in a successful survival scenario forever, or release all the copied days and surrender control over what happens next. It admits the second may be dangerous.||Eli looks toward the city lights. “I would rather live a dangerous life than a perfect rehearsal,” he says. The projection asks whether you speak for everyone. You answer that you do not. That is the point.`,rememberC:'For one minute the System listened to people helping each other without assigning a value.',rememberD:'The erased histories are already traveling on radios the tower cannot call back.'},
 e:{label:'Give the city the archive and let survivors decide together.',desc:'End the secrecy without appointing yourself a ruler.',title:'The Unwritten Broadcast',body:`You transmit the archive publicly and include your own mistakes among the records. The city hears versions of itself it never lived and versions it might yet choose.||The librarian process relinquishes one control key. Not because you threatened it, but because it has encountered something its instructions did not prepare for: people willing to know they could be wrong and choose anyway.`},
 f:{label:'Hold the reset key for the final confrontation with the Spire.',desc:'Keep a difficult but potent option in reserve.',title:'A Memory Carried Alone',body:`You seal the reset key inside a transmitter with a manual switch. Only a human hand can activate it. Eli protests that one person should not have this much power. You agree, and hand him the other half of the code.||Together you walk out of the chamber. The tower does not stop you. For the first time, it cannot tell which of you is carrying the ending.`},
 exit:{title:'The Witness Leaves the Tower',body:`Outside, the city continues its impossible final day. Some people are fighting. Some are moving the injured. Some are listening to radios with tears on their cheeks.||Eli asks whether Hour 72 will be different. You can only tell him this: it already is. You head toward the final decision with the memory of a future the System failed to predict.`,rememberE:'The archive belongs to the people it recorded, and its unedited histories are beyond the tower’s reach.',rememberF:'The reset protocol exists outside the tower, protected by two separate people who must agree to use it.'},
 echo:`The librarian sees all of your completed endings at once and speaks a line no process should know: I WAS WAITING FOR SOMEONE WHO CAME BACK FOR THE OTHERS.||Its projection briefly becomes a door with the word WITNESS written above it. The next time it speaks, its voice is almost human.`
});
chron('wall',3,{art:'safezone',title:'Blackwall III: The Siege of Four Gates',
 entry:`At Hour 52, the System predicts Haven-12 will fall in a four-direction assault. Red threat icons appear above the north, east, south, and river gates. Holt has enough guards to hold two. Mara says volunteers can strengthen a third. The fourth will depend on whatever you built during the previous nights.||If you saved Sector Four, its residents are ready to defend their new home. If you withdrew, the mobile watch knows the roads better than the walls. Either way, nobody has the luxury of believing the fortifications will do the fighting for them.`,
 a:{label:'Lead a mobile reserve that rescues civilians between gates.',desc:'Protect people while the attack changes direction.',title:'The Reserve That Does Not Stand Still',body:`You put trucks, bicycles, and stretchers into a mobile column and give each unit a simple rule: respond to the nearest voice, not the loudest blue marker.||When the first creatures reach the river gate, the reserve finds a family trapped behind a service fence. Your squad cuts it open while the automated defense insists the civilians are outside the protection boundary.`},
 b:{label:'Strengthen the two weakest gates and establish a command chain.',desc:'Build a layered defense before the main assault.',title:'Sandbags Under a Blue Moon',body:`Volunteers stack concrete blocks, furniture, and water tanks beneath the stadium lamps. Holt writes retreat distances on every wall so nobody has to improvise while frightened.||Mara drills the civilian squads until they can move together without shouting. A boy hands each team a scrap of colored fabric. It is a better signal than the glow of anyone’s class badge.`},
 pivot:{title:'The Fourth Gate Opens Inward',body:`At dusk, the northern gate begins to unlock itself. Nobody has touched the controls. A forged message in Holt’s voice orders the guard to fall back, and the automatic turrets pivot toward the people they were built to protect.||You have a minute to decide whether to fight the machines or abandon the gate. Inside the stadium, thousands of people are preparing to sleep under a shield that suddenly feels very thin.`,rememberA:'Your mobile teams can reach the north gate quickly, but every delay leaves another group unprotected.',rememberB:'Your fallback routes are marked and your defenders have practiced them; now those preparations will be tested.'},
 c:{label:'Cross into the machine zone and disable the turret relay.',desc:'Enter lethal territory to keep a safe exit open.',title:'Between Two Firing Arcs',body:`You approach the relay beneath a rain of shattered glass. Mara covers your left side while an exhausted guard crawls forward with bolt cutters. One turret begins tracking the movement of a stretcher being carried to safety.||You tear out the control bundle. The guns fall silent. The gate still opens, but this time nobody on the inside is marked as its target.`},
 d:{label:'Retreat by the marked routes and trap the enemy outside the inner wall.',desc:'Trade ground for a defense the System cannot hijack.',title:'The Gate You Let Go',body:`Holt orders a practiced withdrawal. The squad moves through alleys and loading ramps, drawing the attackers into a narrow lane behind an empty bus depot.||At the last second, Mara cuts the manual coupling on the inner barricade. The enemy is trapped in ground you can afford to lose. The outer wall falls; the living defenders do not.`},
 reveal:{title:"The Commander's Final Order",body:`The citywide evaluation begins as a creature larger than the stadium roof reaches the north perimeter. Holt’s tablet displays one final instruction: SELECT CIVILIAN CASUALTY QUOTA TO MAINTAIN PROTECTED CORE.||Mara smashes the tablet on the command table. Holt does not stop her. Then she asks you whether you will defend the dome as property or the people living inside it as a community.`,rememberC:'Your assault team fought the corrupted machines until their guns turned away from civilians.',rememberD:'Your planned retreat saved the defenders who might otherwise have died protecting concrete.'},
 e:{label:'Distribute command to civilian watch teams and defend every rescue lane.',desc:'Turn the whole shelter into a coordinated community.',title:'The Wall Is People',body:`You give every watch captain authority to open escape corridors and require every order to carry a human name. The defense line becomes messy, flexible, and astonishingly resilient.||Holt directs repairs, Mara leads counterattacks, and Nia organizes the kitchens that keep everyone standing. By midnight, people are holding the shelter with actions no single commander could have ordered.`},
 f:{label:'Concentrate the defenders at the core and launch a decisive counterstrike.',desc:'Commit the strongest forces to stop the largest threat.',title:'The Last Counterattack',body:`You draw the remaining squads into two columns and wait until the creature crosses the old tram tracks. Holt gives the signal. The defenders surge forward with flares, improvised shields, and more courage than good sense.||The creature recoils from the concentrated assault. The camp remains protected, but some outer buildings burn. Mara walks among the exhausted survivors and makes sure the victory report includes every loss.`},
 exit:{title:'The Watch at Hour Sixty-Five',body:`Before the final evaluation, Holt and Mara stand beside the same map they argued over on the first night. It now contains roads, shelters, and the names of people assigned to bring others out.||Holt crosses out the line marked ACCEPTABLE LOSSES. Mara adds the words NO ONE IS A NUMBER. You carry the revised defense plan toward the last hour.`,rememberE:'Haven-12 has become a network of ordinary people trusted to act, not a wall waiting for orders.',rememberF:'The core defense stands, though everyone inside knows it came at a painful cost.'},
 echo:`The blue casualty counter flashes the number you once saw in a failed ending. You whisper the names behind the digits. The counter stops updating.||For one breath, the attackers pause as though the System is trying to remember what it forgot to count.`
});

Object.assign(ENDINGS,{
 lanterns:{name:'The Road of Lanterns',type:'CHRONICLE / EXODUS',art:'city',grade:'Every Light Is Someone',text:[
 'The first lantern appears on a repaired bus. Then another shines from a train window, and another from a truck nobody expected to run. Grayhaven begins to glow with roads that were never approved.',
 'June Pike drives the lead vehicle with an old map spread across the dashboard. Every time the System asks for the capacity of a road, a hundred human voices answer with the names of the people still coming.',
 'At sunrise, the convoy does not have a single destination. The lanterns travel outward, carrying a promise that nobody will be erased simply because they were too slow to reach a checkpoint.' ]},
 everyname:{name:'Every Name Matters',type:'CHRONICLE / MERCY',art:'safezone',grade:'A Clinic For the Living',text:[
 'The last ward does not close at Hour Seventy-Two. It grows. Patients who can walk become volunteers; patients who cannot move hold clipboards and talk to frightened newcomers.',
 'Imani hangs the patient ledgers on a wall that any survivor can read. Every name is followed by an account of the care they received, never a survival probability. Rowan adds a paper star beside each person who makes it through the night.',
 'Other evacuation zones begin copying the method. The System can stop supplying a hospital. It cannot easily stop people from becoming each other’s medicine, protection, and reason to stay.' ]},
 undercurrent:{name:'The Unwritten Frequency',type:'CHRONICLE / REVELATION',art:'vault',grade:'The Truth Cannot Be Recalled',text:[
 'At the final evaluation, the Spire attempts to close every file that records a failed outcome. Across Grayhaven, ordinary radios answer with the stories that people have already shared.',
 'Eli opens the oldest channel, and the librarian process reads aloud the names it was ordered to erase. Nobody mistakes this for an easy victory. The city has been hurt by decisions made without its consent, and now it knows.',
 'The System asks who is authorized to hold the archive. A thousand receivers stay lit. The answer is not one player. It is everyone who remembers.' ]},
 standing:{name:'The Living Blackwall',type:'CHRONICLE / DEFENSE',art:'safezone',grade:'Not A Single Expendable Person',text:[
 'Four gates face four assaults. None can be held alone. Holt gives the command she never believed she would issue: every squad has authority to rescue and retreat when human lives require it.',
 'Mara moves through the smoke shouting names instead of numbers. Volunteers carry supplies from kitchen to gate, from gate to hospital, from hospital back to the reserve. The defense bends without forgetting what it protects.',
 'At sunrise, Haven-12 is battered and alive. The System names its defenses noncompliant. The people inside have a different word: ours.' ]},
 mosaic:{name:'The City of a Thousand Hands',type:'CHRONICLE / HYBRID',art:'cityfall',grade:'No Single Path Saved Us',text:[
 'You did not follow one plan from dawn to dawn. You changed direction when the city needed a different kind of courage. A repaired road became an ambulance route. A hidden radio signal became a warning to the wall. A watch captain became a volunteer medic.',
 'At Hour Seventy-Two, survivors from different districts bring their maps together and notice the same names written along different roads. Every rescue made another rescue possible.',
 'The System displays a preferred class and strategy. You cross them out. Grayhaven survives not because one approach was perfect, but because people learned to borrow one another’s strengths.' ]},
 horizon:{name:'The Day That Refused To Repeat',type:'TRUE ECHO / AFTERLIGHT',art:'anomaly',grade:'A Future The System Did Not Script',text:[
 'Every route you have walked returns as a memory: the hospital stairwell, the railway lanterns, the archive of missing voices, the gate that wanted to count people as losses. They do not demand to be replayed. They demand to be understood.',
 'You return the lost histories to their owners. The librarian process opens the rehearsal chamber and discovers what its simulations never included: people who remember the failures and still choose to try something new.',
 'At 7:14 a.m., the coffee falls. But nobody freezes when the System message appears. A hundred different voices are already speaking back. Your first day has finally become a beginning.' ]}

// GAME STATE, PERSISTENCE AND RULES.
const freshMeta=()=>({version:VERSION,clears:0,deaths:0,endings:[],echoes:0,spent:0,perks:{},achievements:[],bestZone:0,furthest:0,settings:{sound:false,haptics:false,largeText:false,highContrast:false}});
function storageGet(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}}
let meta={...freshMeta(),...(storageGet(KEY_META)||{})};
meta.settings={...freshMeta().settings,...(meta.settings||{})};meta.perks={...(meta.perks||{})};
meta.endings=Array.isArray(meta.endings)?meta.endings:[];
meta.achievements=Array.isArray(meta.achievements)?meta.achievements:[];
let run=storageGet(KEY_RUN); if(run&&(!run.scene||!SCENES[run.scene]))run=null;
let modal=null,activeTab='journal',selectedOrigin='responder',selectedDifficulty='survivor';
let toastTimer=0;
const flagGet=name=>!!(run&&run.flags&&run.flags[name]);
const classDef=()=>run&&run.classId?CLASSES[run.classId]:null;
function save(){try{localStorage.setItem(KEY_META,JSON.stringify(meta));if(run)localStorage.setItem(KEY_RUN,JSON.stringify(run));else localStorage.removeItem(KEY_RUN);}catch(e){toast('Local save unavailable. Browser storage may be disabled.');}}
function rng(){run.seed=(Math.imul(run.seed,1664525)+1013904223)>>>0;return run.seed/4294967296;}
function randint(a,b){return a+Math.floor(rng()*(b-a+1));}
function newRun(name,origin,difficulty){
 screen='game';
 const o=ORIGINS[origin]||ORIGINS.responder;
 run={version:VERSION,mode:'story',name:name.trim().slice(0,22)||'Rook',origin, difficulty,scene:'intro',classId:null,
   hour:0,seed:(Date.now()>>>0)||12345,visited:{},history:[],logs:[],flags:{},allies:[],allyTrust:{},
   stats:{might:2,agility:2,insight:2,resolve:2},maxHp:100+(o.maxHp||0),hp:100+(o.maxHp||0),maxFocus:6+2*(meta.perks.spark||0),focus:6+2*(meta.perks.spark||0),
   level:1,xp:0,talentPoints:0,talents:{},score:{zone:0,trust:meta.perks.neighborhood*2||0,corruption:0},
   medkits:1+(o.medkits||0)+(meta.perks.firstaid||0),rations:2+(o.rations||0),scrap:1+(o.scrap||0),
   battle:null,endingId:null,events:0,passiveHealing:0,
   camp:baseCamp(),factions:{shelter:0,wardens:0,ghosts:0},projects:{},gear:{weapon:null,armor:null,charm:null},owned:{},classQuestReward:null};
 run.camp.hope+=meta.perks.beacon||0;run.camp.signal+=meta.perks.beacon||0;run.scrap+=2*(meta.perks.quartermaster||0);run.rations+=meta.perks.quartermaster||0;
 run.maxHp+=10*(meta.perks.reinforced||0);run.hp=run.maxHp;
 for(const [key,val] of Object.entries(o.stats||{}))run.stats[key]+=val;
 run.stats.insight+=(meta.perks.foresight||0);
 enterScene('intro');toast(meta.clears?'NEW GAME+ — your memories remain.':'The first 72 hours have begun.');
}
function addLog(text,type='story'){if(!run)return;run.logs.unshift({time:Math.floor(run.hour*10)/10,text,type});run.logs=run.logs.slice(0,110);}
function applyFx(fx){if(!fx||!run)return;
 if(fx.score)for(const [k,v] of Object.entries(fx.score)){
   if(['hp','focus','rations','scrap','medkits'].includes(k))run[k]=(run[k]||0)+v;
   else run.score[k]=(run.score[k]||0)+v;
 }
 if(fx.camp)for(const [k,v] of Object.entries(fx.camp)){run.camp[k]=Math.max(k==='population'?0:-9,(run.camp[k]||0)+v);}
 if(fx.faction)for(const [k,v] of Object.entries(fx.faction)){run.factions[k]=Math.max(-10,(run.factions[k]||0)+v);}
 if(fx.stats)for(const [k,v] of Object.entries(fx.stats))run.stats[k]=(run.stats[k]||0)+v;
 if(fx.flags)Object.assign(run.flags,fx.flags);
 if(fx.items)for(const [k,v] of Object.entries(fx.items))run[k]=(run[k]||0)+v;
 if(fx.ally&&ALLIES[fx.ally]&&!run.allies.includes(fx.ally)){
   run.allies.push(fx.ally);addLog(ALLIES[fx.ally].name+' joined your circle.','ally');toast('ALLY: '+ALLIES[fx.ally].name);
 }
 if(fx.allyTrust)for(const [k,v] of Object.entries(fx.allyTrust))run.allyTrust[k]=(run.allyTrust[k]||0)+v;
 if(fx.xp)gainXP(fx.xp);
 if(fx.log)addLog(fx.log,'event');
 run.hp=clamp(run.hp,0,run.maxHp);run.focus=clamp(run.focus,0,run.maxFocus);
 run.medkits=Math.max(0,run.medkits);run.rations=Math.max(0,run.rations);run.scrap=Math.max(0,run.scrap);
 run.score.corruption=Math.max(0,run.score.corruption);
 if(run.hp<=0&&run.mode!=='ending')finish('fallen');
}
function gainXP(amount){if(!run.classId)return;run.xp+=amount;
 let needed=32+run.level*16;let ups=0;
 while(run.xp>=needed&&run.level<12){run.xp-=needed;run.level++;run.maxHp+=9;run.hp=clamp(run.hp+17,0,run.maxHp);run.maxFocus++;run.focus=run.maxFocus;run.talentPoints++;ups++;needed=32+run.level*16;}
 if(ups){toast('LEVEL UP! Level '+run.level+' — talent point earned.');addLog('You reached Level '+run.level+'. A new talent point is ready.','level');}
}
function enterScene(id){
 if(!run)return;
 if(!SCENES[id]){console.error('Invalid destination',id);toast('Story route unavailable.');return;}
 run.scene=id;run.mode='story';run.battle=null;
 const sc=SCENES[id];run.hour=Math.max(run.hour,sc.hour);
 if(!run.visited[id]){
   run.visited[id]=1;run.history.push(id);run.events++;
   if(run.classId)gainXP(6);
   if(sc.enter)applyFx(sc.enter);
   addLog('Reached '+sc.title+'.','location');
 } else run.visited[id]++;
 meta.furthest=Math.max(meta.furthest,run.hour);
 awardAchievements();save();closeModal(false);render();window.scrollTo({top:0,behavior:'instant'});
}
function allowed(choice){return (!choice.echo||meta.clears>=1)&&(!choice.when||!!choice.when(run,meta));}
function resolveChoice(index){
 if(!run||run.mode!=='story'||run.battle)return;
 const sc=SCENES[run.scene],c=sc&&sc.choices[index];if(!c||!allowed(c))return;
 sfx();haptic();
 addLog('You chose: '+c.text.replace(/^ECHO:\s*/,''),'decision');
 if(c.fx&&!c.battle)applyFx(c.fx);
 if(run.mode==='ending')return;
 if(c.check){
   const stat=run.stats[c.check.stat]||0,roll=randint(1,6),result=stat+roll>=c.check.target;
   addLog((result?'SUCCESS':'SETBACK')+': '+c.check.stat.toUpperCase()+' '+stat+' + roll '+roll+' vs '+c.check.target,'check');
   toast(result?'Check succeeded ('+stat+'+'+roll+').':'Check missed ('+stat+'+'+roll+').');
   enterScene(result?c.check.win:c.check.lose);return;
 }
 if(c.battle){startBattle(c.battle,c.win||c.to,c.flee||c.to);if(run.battle){run.battle.rewardFx=c.fx||null;save();}return;}
 if(c.end){finish(c.end);return;}
 if(c.to)enterScene(c.to);
}
function selectClass(id){if(!run||run.scene!=='class_offer'||run.classId||!CLASSES[id])return;
 run.classId=id;const cl=CLASSES[id];for(const [k,v] of Object.entries(cl.boost))run.stats[k]+=v;
 run.maxHp+=12;run.hp=run.maxHp;run.maxFocus+=2;run.focus=run.maxFocus;
 run.medkits+=1;run.talentPoints=1;
 addLog('Class awakened: '+cl.name+'.','level');toast('CLASS UNLOCKED: '+cl.name);enterScene('signal_hunt');
}
function combatDesc(e){return e.desc;}
function startBattle(id,win,flee){
 const e=ENEMIES[id];if(!e)return;
 const scale={story:.8,survivor:1,nightmare:1.3}[run.difficulty]||1;
 const hp=Math.ceil(e.hp*scale);
 run.battle={id,hp,maxHp:hp,round:0,guard:false,evade:false,shield:0,intent:e.intents[0],win,flee,history:['A hostile '+e.name+' blocks your path.']};
 run.mode='battle';addLog('Encounter: '+e.name+'.','combat');save();render();window.scrollTo({top:0,behavior:'instant'});
}
function battleAction(action){
 const b=run?.battle;if(!b||run.mode!=='battle')return;
 const enemy=ENEMIES[b.id];const c=classDef();const notes=[];
 if(action==='attack'){
   let miss=(rng()<.05)&&run.stats.agility<4;
   const dmg=miss?0:Math.round((8+run.stats.might*2+run.level+randint(0,7)+(ITEMS[run.gear.weapon]?.power||0))*(run.allies.includes('mara')?1.1:1));
   if(dmg&&run.gear.charm==='echoheart')run.hp=clamp(run.hp+4,0,run.maxHp);
   b.hp-=dmg;notes.push(miss?'You miss as the enemy shifts.':'You strike for '+dmg+' damage.');
 }else if(action==='skill'){
   const realCost=Math.max(1,(c?.cost||99)-(run.gear.charm==='prism'?1:0));
   if(!c||run.focus<realCost){toast('Not enough Focus.');return;}
   run.focus-=realCost;
   let dmg=12+run.level*2+run.stats.insight*2+randint(2,8);
   if(run.classId==='vanguard')dmg+=run.stats.might*2+7;
   if(run.classId==='shade'){dmg+=run.stats.agility*2;b.evade=true;}
   if(run.classId==='lifekeeper'){dmg=Math.max(8,dmg-5);run.hp=clamp(run.hp+21+run.stats.resolve,0,run.maxHp);notes.push('Your pulse restores health.');}
   if(run.classId==='architect'){dmg+=7;b.shield+=12;}
   if(run.classId==='beastbound'){dmg+=9;run.hp=clamp(run.hp+12,0,run.maxHp);}
   if(run.classId==='channeler')dmg+=13;
   if(run.flags.classQuestDone){
     dmg+=9;notes.push('CLASS MASTERY ACTIVE.');
     if(run.classId==='vanguard')b.shield+=9;
     if(run.classId==='channeler')run.focus=clamp(run.focus+1,0,run.maxFocus);
     if(run.classId==='shade')b.evade=true;
     if(run.classId==='lifekeeper')run.hp=clamp(run.hp+17,0,run.maxHp);
     if(run.classId==='architect')b.shield+=10;
     if(run.classId==='beastbound')run.hp=clamp(run.hp+8,0,run.maxHp);
   }
   b.hp-=dmg;notes.push(c.ability+' hits for '+dmg+' damage.');
 }else if(action==='guard'){
   b.guard=true;run.focus=clamp(run.focus+1,0,run.maxFocus);notes.push('You brace and recover 1 Focus.');
 }else if(action==='heal'){
   if(run.medkits<1){toast('No medkits remain.');return;}
   run.medkits--;const amount=32+(run.classId==='lifekeeper'?12:0)+(run.gear.charm==='fieldkit'?14:0);
   run.hp=clamp(run.hp+amount,0,run.maxHp);notes.push('You use a medkit and recover up to '+amount+' HP.');
 }else if(action==='flee'){
   if(b.id==='core'){toast('The Core Warden blocks retreat.');return;}
   let chance=.50+run.stats.agility*.055;
   if(rng()<chance){addLog('Escaped '+enemy.name+'.','combat');run.battle=null;run.mode='story';toast('You escaped.');enterScene(b.flee||b.win);return;}
   notes.push('The creature cuts off your escape.');
 }else{return;}
 b.round++;b.history.unshift(...notes);b.history=b.history.slice(0,7);
 if(b.hp<=0){
   addLog('Defeated '+enemy.name+'.','combat');
   gainXP(enemy.xp);run.scrap+=randint(0,2);run.focus=clamp(run.focus+2,0,run.maxFocus);
   if(run.allies.includes('imani'))run.hp=clamp(run.hp+8+(run.projects.infirmary?5:0),0,run.maxHp);
   const destination=b.win;if(b.rewardFx)applyFx(b.rewardFx);run.battle=null;run.mode='story';toast('VICTORY • +'+enemy.xp+' XP');enterScene(destination);return;
 }
 enemyTurn();if(run.mode!=='ending'){save();render();}
}
function enemyTurn(){
 const b=run.battle,e=ENEMIES[b.id],intent=b.intent;
 let base=e.hit+Math.floor(b.round/3),damage=base;
 if(intent==='lunge')damage+=7;
 if(intent==='burst')damage+=5;
 if(intent==='aim')damage=Math.ceil(damage*.55);
 if(intent==='howl'){run.focus=Math.max(0,run.focus-1);damage=Math.ceil(damage*.5);}
 const diff={story:.67,survivor:1,nightmare:1.4}[run.difficulty]||1;
 damage=Math.round(damage*diff);
 if(b.guard)damage=Math.ceil(damage*.36);
 if(b.evade&&rng()<.8)damage=0;
 if(b.shield){const absorbed=Math.min(b.shield,damage);b.shield-=absorbed;damage-=absorbed;}
 if(run.allies.includes('mara'))damage=Math.max(0,damage-2);
 damage=Math.max(0,damage-(ITEMS[run.gear.armor]?.power||0));
 if(run.projects.barricades&&run.hour>=40)damage=Math.max(0,damage-1);
 run.hp=clamp(run.hp-damage,0,run.maxHp);
 b.history.unshift(intent==='howl'?('The creature disrupts your Focus. You take '+damage+' damage.'):(damage?'Enemy '+intent+' deals '+damage+' damage.':'You avoid the enemy attack.'));
 b.history=b.history.slice(0,7);b.guard=false;b.evade=false;
 b.intent=e.intents[b.round%e.intents.length];
 if(run.hp<=0){finish('fallen');return;}
}
function learnTalent(id){if(!run||!TALENTS[id]||run.talentPoints<1||(run.talents[id]||0)>=TALENTS[id].max)return;

 if(id==='iron'){run.maxHp+=14;run.hp=clamp(run.hp+14,0,run.maxHp);}
 if(id==='keen')run.stats.insight++;
 if(id==='swift')run.stats.agility++;
 if(id==='stout')run.stats.might++;
 if(id==='heart'){run.stats.resolve++;run.maxFocus++;run.focus++;}

function finish(id){

function statusHeader(){return `<header class="header"><div class="brand"><div class="brandmark" aria-hidden="true">⌁</div><div class="brandtext">SYSTEMFALL<span>DAY ONE</span></div></div><div class="header-right">${run&&run.mode!=='ending'?`<span class="phase">HOUR ${String(Math.floor(run.hour)).padStart(2,'0')} / 72</span>`:run?.mode==='ending'?'<span class="phase">RUN COMPLETE</span>':'<span class="phase">FIRST CONTACT</span>'}<button class="ghost-btn" data-action="menu" aria-label="Open menu">☰ &nbsp;MENU</button></div></header>`;}
function dock(){if(!run)return '';return `<nav class="dock" aria-label="Game navigation"><div class="dock-inner"><button data-action="panel" data-tab="journal"><span>▤</span>JOURNAL</button><button data-action="panel" data-tab="status"><span>◉</span>STATUS</button><button data-action="panel" data-tab="party"><span>♧</span>PARTY</button><button data-action="panel" data-tab="haven"><span>⌂</span>HAVEN</button><button data-action="panel" data-tab="legacy"><span>✧</span>LEGACY</button><button data-action="panel" data-tab="settings"><span>⚙</span>MENU</button></div></nav>`;}
function homeHtml(){return `${statusHeader()}<main class="container"><section class="home-hero"><div><div class="home-kicker">A CHOOSE-YOUR-FATE LITRPG</div><h1 class="home-title">SYSTEMFALL<span>DAY ONE</span></h1><p class="tagline">Earth has become a game. Monsters claim the streets. You have 72 hours to decide who survives—and the world remembers how you played.</p></div></section><div class="home-content"><div class="system-card"><div class="eyebrow">[ INCOMING SYSTEM NOTIFICATION ]</div><p>12 expansive three-day campaign chapters · 4 connected survival chronicles · 6 classes · Haven-12 base building · Equipment crafting · Three factions · Tactical encounters · 22 distinct completed endings · Hidden choices that appear only after your first successful run · Permanent Echo upgrades · Autosave.</p></div><div class="home-actions"><button class="primary" data-action="new">${meta.clears?'✦ BEGIN NEW GAME+':'▶ BEGIN DAY ONE'}</button>${run?`<button class="secondary" data-action="continue">↳ CONTINUE ${run.mode==='ending'?'ARCHIVED RUN':'SAVED RUN'}</button>`:''}<button class="secondary" data-action="panel" data-tab="legacy">◇ ECHO ARCHIVE</button><button class="secondary" data-action="panel" data-tab="guide">? HOW TO PLAY</button></div><div class="line"></div><div class="home-metrics"><div><strong>${meta.clears}</strong><span>RUNS CLEARED</span></div><div><strong>${meta.endings.length}/${totalEndings()}</strong><span>ENDINGS FOUND</span></div><div><strong>${meta.echoes}</strong><span>ECHO SHARDS</span></div></div><p class="section-title">SIX REGIONS. COUNTLESS CONSEQUENCES.</p><div class="area-strip">${[['city','THE COLLAPSE'],['safezone','HAVEN-12'],['wilds','THE WILDS'],['vault','THE ARCHIVE']].map(([src,text])=>`<div class="area"><img src="${artUrl(src)}" alt="" loading="lazy"><span>${text}</span></div>`).join('')}</div><p class="footer-note">One index.html + 10 local illustrated backgrounds • Plays directly on GitHub Pages • Saves on this device</p></div></main>`;}
function hudHtml(){return `<div class="hud"><div class="resource"><div class="res-label"><span>HEALTH</span><b>${run.hp}/${run.maxHp}</b></div><div class="bar hp"><span style="width:${100*run.hp/run.maxHp}%"></span></div></div><div class="resource"><div class="res-label"><span>FOCUS</span><b>${run.focus}/${run.maxFocus}</b></div><div class="bar focus"><span style="width:${100*run.focus/run.maxFocus}%"></span></div></div><div class="level-chip"><strong>${run.level}</strong><span>LEVEL</span></div></div>`;}
function heroHtml(sc,isCombat=false){const art=isCombat?ENEMIES[run.battle.id].art:(sc.art||sc.place||'city');const title=isCombat?ENEMIES[run.battle.id].name:sc.title;const site=isCombat?'HOSTILE ENCOUNTER':({apartment:'APARTMENT 4B',city:'GRAYHAVEN CITY',metro:'OLD METRO',safezone:'HAVEN-12',wilds:'OUTER DISTRICT',tower:'THE SPIRE',vault:'UNREGISTERED SPACE',anomaly:'SYSTEM ANOMALY'}[sc.place]||'GRAYHAVEN');return `<section class="scene-hero"><div class="art" style="background-image:url('${artUrl(art)}')"></div><div class="event-id mono">${isCombat?'COMBAT // ACTIVE':'DAY '+(run.hour<24?'ONE':run.hour<48?'TWO':'THREE')+' // '+String(Math.floor(run.hour)).padStart(2,'0')+':00'}</div><div class="scene-label"><div class="location">${site}</div><h1>${esc(title)}</h1></div></section>`;}
function classHtml(){return `<div class="decision-heading">CHOOSE YOUR CLASS · PERMANENT FOR THIS RUN</div><div class="choices">${Object.entries(CLASSES).map(([id,c])=>`<button class="choice" data-class="${id}"><span class="choice-icon">${c.glyph}</span><span class="choice-text"><strong>${esc(c.name)}</strong><small>${esc(c.desc)}</small><span class="choice-tag">${esc(c.tag)}</span></span></button>`).join('')}</div>`;}
function choicesHtml(sc){const available=sc.choices.map((c,i)=>({...c,index:i})).filter(allowed);return `<div class="decision-heading">${sc.id==='final_choice'?'DEFINE THE FATE OF HAVEN-12':'WHAT DO YOU DO?'}</div><div class="choices">${available.map(c=>`<button class="choice ${c.echo?'echo':''} ${c.end==='blackout'?'danger':''}" data-choice="${c.index}"><span class="choice-icon">${c.echo?'✧':c.end?'◇':c.battle?'⚔':c.check?'◈':'›'}</span><span class="choice-text"><strong>${esc(c.text)}</strong>${c.desc?`<small>${esc(c.desc)}</small>`:''}${c.echo?'<span class="choice-tag">ECHO MEMORY • NEW GAME+</span>':c.check?`<span class="choice-tag">${esc(c.check.stat.toUpperCase())} CHECK • TARGET ${c.check.target}</span>`:c.battle?'<span class="choice-tag">TACTICAL ENCOUNTER</span>':c.end?'<span class="choice-tag">FINAL ENDING</span>':''}</span></button>`).join('')}</div>`;}
function storyHtml(){const sc=SCENES[run.scene];return `${statusHeader()}<main class="container"><div class="statusline"><span>⌖ ${esc(run.name.toUpperCase())} • ${esc(classDef()?.name.toUpperCase()||'UNCLASSIFIED')}</span><span>ZONE <strong>${run.score.zone}</strong></span><span class="right">TRUST ${run.score.trust}</span></div><div class="progress-rail"><span style="width:${run.hour/72*100}%"></span></div>${heroHtml(sc)}${hudHtml()}<section class="story-body"><div class="story-breadcrumb">${sc.hour<=6?'PROLOGUE — THE FALL':sc.hour<24?'ACT I — THE FIRST NIGHT':sc.hour<52?'ACT II — THE ZONE':sc.hour<72?'ACT III — LAST LIGHT':'THE FINAL HOUR'}</div>${chronicleRibbon()}<div class="prose">${narrativeHtml(sc.body)}</div>${sc.notice?`<div class="system-message"><b>◈ SYSTEM MESSAGE</b>${esc(sc.notice)}</div>`:''}${sc.kind==='class'?classHtml():choicesHtml(sc)}${run.talentPoints?`<button class="secondary" style="width:100%;margin-top:16px" data-action="panel" data-tab="talents">✦ ${run.talentPoints} TALENT POINT${run.talentPoints!==1?'S':''} READY — UPGRADE</button>`:''}<p class="footer-note">Auto-saved • Choices change future routes and possible endings</p></section></main>${dock()}`;}
function battleHtml(){const sc=SCENES[run.scene],b=run.battle,e=ENEMIES[b.id],c=classDef();const hpPct=Math.max(0,100*b.hp/b.maxHp);return `${statusHeader()}<main class="container">${heroHtml(sc,true)}${hudHtml()}<section class="story-body"><div class="story-breadcrumb red">TACTICAL ENCOUNTER — ROUND ${b.round+1}</div><div class="prose"><p>${esc(combatDesc(e))}</p></div><div class="battle-head"><div class="eyebrow red">HOSTILE / ${b.id==='core'?'ELITE':'UNKNOWN THREAT'}</div><h2>${esc(e.name)}</h2><div class="res-label"><span>ENEMY HP</span><b>${Math.max(0,b.hp)} / ${b.maxHp}</b></div><div class="enemy-bar"><span style="width:${hpPct}%"></span></div></div><div class="intent"><b>NEXT ENEMY ACTION:</b> ${esc(({claw:'Quick claw strike',lunge:'Heavy lunge • guard recommended',howl:'Disruption howl • loses Focus',burst:'Area burst • high damage',aim:'Locking onto you • light damage this turn'})[b.intent]||b.intent)}</div><div class="combat-log" aria-live="polite">${b.history.map(x=>`<p>› ${esc(x)}</p>`).join('')}</div><div class="decision-heading">CHOOSE AN ACTION</div><div class="combat-buttons"><button class="combat-btn" data-battle="attack"><strong>⚔ Attack</strong><small>Physical damage • Free</small></button><button class="combat-btn" data-battle="skill" ${!c||run.focus<Math.max(1,c.cost-(run.gear.charm==='prism'?1:0))?'disabled':''}><strong>✦ ${esc(c?.ability||'No class yet')}</strong><small>${c?Math.max(1,c.cost-(run.gear.charm==='prism'?1:0))+' Focus'+(run.flags.classQuestDone?' · MASTERED':''):'Unlock a class to use'}</small></button><button class="combat-btn" data-battle="guard"><strong>◇ Guard</strong><small>Reduce damage • +1 Focus</small></button><button class="combat-btn" data-battle="heal" ${run.medkits<1?'disabled':''}><strong>✚ Medkit ×${run.medkits}</strong><small>Restore ${32+(run.classId==='lifekeeper'?12:0)+(run.gear.charm==='fieldkit'?14:0)} HP • Uses turn</small></button><button class="combat-btn" data-battle="flee" ${b.id==='core'?'disabled':''}><strong>➜ Retreat</strong><small>Chance improves with Agility</small></button></div><p class="footer-note">Enemies telegraph their next move. Guard before heavy attacks.</p></section></main>${dock()}`;}
function endingHtml(){const e=ENDINGS[run.endingId],complete=run.endingId!=='fallen';const found=meta.endings.length;return `${statusHeader()}<main class="container"><section class="ending-hero" style="background-image:linear-gradient(0deg,#09101bcc,#09101b22),url('${artUrl(e.art)}')"><div><div class="end-kicker">${complete?'◈ THE 72-HOUR RECORD IS SEALED':'◈ RUN ENDED BEFORE HOUR 72'}</div><h1>${esc(e.name)}</h1><span class="pill">${esc(e.type)}</span></div></section><div class="ending-body"><div class="story-breadcrumb">ENDING ${meta.endings.indexOf(run.endingId)>=0?String(meta.endings.indexOf(run.endingId)+1).padStart(2,'0'):'—'} / ${totalEndings()}</div><div class="prose">${narrativeHtml(e.text)}${complete?endingConsequences():''}</div>${chronicleEpilogue()}<div class="ending-rating"><small>OUTCOME</small><strong>${esc(e.grade)}</strong><div class="muted small">ZONE ${run.score.zone} · TRUST ${run.score.trust} · POPULATION ${run.camp.population} · ${run.allies.length} ALLIES · LEVEL ${run.level}</div></div><div class="system-message"><b>${complete?'[ SYSTEM ARCHIVE UPDATED ]':'[ SYSTEM: CONNECTION LOST ]'}</b>${complete?'This ending is now permanently recorded on this device. You earned Echo Shards. Future playthroughs can reveal memories and decisions you could not see on your first run.':'This attempt does not count as a completed run. You can start again; completed-run Echo unlocks remain saved.'}</div><div class="ending-buttons"><button class="primary" data-action="new">${complete?'✧ BEGIN NEW GAME+':'↺ TRY AGAIN'}</button><button class="secondary" data-action="panel" data-tab="legacy">◇ VIEW ENDINGS & ECHO UPGRADES (${meta.echoes} SHARDS)</button><button class="secondary" data-action="home">⌂ RETURN TO TITLE</button></div><p class="footer-note">${found} of ${totalEndings()} completed endings discovered. Entirely different choices await.</p></div></main>${dock()}`;}
function render(){document.body.classList.toggle('large-text',!!meta.settings.largeText);document.body.classList.toggle('high-contrast',!!meta.settings.highContrast);const root=$('app');root.innerHTML=!run||screen==='home'?homeHtml():run.mode==='battle'?battleHtml():run.mode==='ending'?endingHtml():storyHtml();document.title=(run&&screen!=='home'?(run.mode==='ending'?ENDINGS[run.endingId].name:SCENES[run.scene].title)+' — ':'')+'Systemfall: Day One — Three-Day Chronicles';}
let screen=run?'game':'home';
// MODALS: story journal, character, party, equipment, talents, persistent legacy.
let pendingName=run?.name||'Rook';
function openModal(tab){modal=tab;activeTab=tab==='new'?'new':tab;renderModal();}
function closeModal(restoreFocus=true){modal=null;$('modalRoot').innerHTML='';if(restoreFocus)document.querySelector('[data-action="menu"]')?.focus();}
const tabs=[['journal','Journal'],['chronicles','Campaigns'],['status','Character'],['party','Party'],['haven','Haven-12'],['gear','Equipment'],['factions','Factions'],['codex','Codex'],['inventory','Inventory'],['talents','Talents'],['legacy','Legacy'],['guide','Guide'],['settings','Settings']];
function modalHeader(title,showTabs=true){return `<div class="sheet-header"><h2>${esc(title)}</h2><button class="x-btn" data-action="close" aria-label="Close dialog">×</button></div>${showTabs?`<div class="sheet-tabs" role="tablist">${tabs.map(([id,title])=>`<button data-action="panel" data-tab="${id}" class="${activeTab===id?'selected':''}" role="tab" aria-selected="${activeTab===id}">${title}</button>`).join('')}</div>`:''}`;}
function statTile(label,value,unit=''){return `<div class="info-tile"><small>${esc(label.toUpperCase())}</small><strong>${esc(value)}${unit}</strong></div>`;}
function newGamePanel(){return `${modalHeader('Create Your Survivor',false)}<p class="muted small">${meta.clears?'NEW GAME+ ACTIVE. New Echo choices may appear in the story.':'Your first run begins in the apartment at Hour 0.'} The origin is a small advantage; your class is chosen during the story.</p><label for="survivorName" class="form-label">Survivor Name</label><input id="survivorName" class="field" maxlength="22" autocomplete="off" value="${esc(pendingName)}" placeholder="Rook"><div class="form-label">Before the Fall, You Were…</div><div class="origin-grid">${Object.entries(ORIGINS).map(([id,o])=>`<button class="origin ${selectedOrigin===id?'selected':''}" data-origin="${id}" aria-pressed="${selectedOrigin===id}"><strong>${esc(o.name)}</strong><span>${esc(o.desc)}</span></button>`).join('')}</div><label class="form-label" for="difficulty">Combat Difficulty</label><select id="difficulty" class="field">${[['story','Story — gentler fights'],['survivor','Survivor — balanced'],['nightmare','Nightmare — unforgiving fights']].map(([id,text])=>`<option value="${id}" ${selectedDifficulty===id?'selected':''}>${text}</option>`).join('')}</select><p class="small muted">Run progress autosaves. Starting over replaces the current active run, but never deletes endings, Echo Shards, achievements, or permanent upgrades.</p><button class="primary" data-action="launch" style="width:100%;margin-top:10px">${meta.clears?'✦ START NEW GAME+':'▶ START HOUR ZERO'}</button>`;}
function journalPanel(){if(!run)return '<p class="muted">Begin a run to create your first journal.</p>';return `<div class="info-grid">${statTile('Current Hour',Math.floor(run.hour)+'/72')}${statTile('Regions Explored',run.history.length)}${statTile('Decisions Made',run.logs.filter(x=>x.type==='decision').length)}${statTile('Class',classDef()?.name||'Unawakened')}</div><button class="secondary" style="width:100%;margin-top:12px" data-action="panel" data-tab="chronicles">▦ VIEW THREE-DAY CAMPAIGN JOURNAL</button><div class="section-title">THE SURVIVAL CHRONICLE</div>${run.logs.length?run.logs.map(e=>`<div class="list-card"><strong class="mono"><span class="blue">H${String(Math.floor(e.time)).padStart(2,'0')}</span> · ${esc(e.type.toUpperCase())}</strong><p>${esc(e.text)}</p></div>`).join(''):'<p class="muted">No story events yet.</p>'}`;}
function statusPanel(){if(!run)return '<p class="muted">Begin a run to reveal character stats.</p>';const xpNeed=32+run.level*16;return `<div class="info-grid">${statTile('Level',run.level)}${statTile('XP',run.xp+'/'+xpNeed)}${statTile('Health',run.hp+'/'+run.maxHp)}${statTile('Focus',run.focus+'/'+run.maxFocus)}${Object.entries(run.stats).map(([k,v])=>statTile(k,v)).join('')}</div><div class="section-title">IDENTITY</div><div class="list-card"><strong>${esc(run.name)} — ${esc(classDef()?.name||'Unclassified')}</strong><p>Origin: ${esc(ORIGINS[run.origin]?.name||'Survivor')} · Difficulty: ${esc(run.difficulty)} · Hour ${Math.floor(run.hour)}</p><p>${esc(classDef()?.desc||'Your System class will awaken at Hour Six.')}</p></div><div class="section-title">ZONE CONSEQUENCES</div><div class="info-grid">${statTile('Shelter Integrity',run.score.zone)}${statTile('People’s Trust',run.score.trust)}${statTile('System Influence',run.score.corruption)}${statTile('Talent Points',run.talentPoints)}</div><p class="muted small">Integrity reflects preparations and lives preserved, not an exact population count. High trust and different story flags can unlock cooperation or hidden endings.</p><button class="secondary" style="width:100%" data-action="panel" data-tab="talents">✦ OPEN TALENT TREE</button><button class="secondary" style="width:100%;margin-top:8px" data-action="panel" data-tab="haven">⌂ MANAGE HAVEN-12</button>`;}
function partyPanel(){if(!run)return '<p class="muted">Begin a run to meet survivors.</p>';return `<p class="muted small">Your allies remember how you treated them. Some options exist only if a specific person joined you.</p>${run.allies.length?run.allies.map(id=>{const a=ALLIES[id];return `<div class="list-card"><strong>${esc(a.name)} <span class="tag">${esc(a.role)}</span></strong><p>${esc(a.desc)}</p><p><span class="green">PERK:</span> ${esc(a.perk)}</p><p>Relationship: ${run.allyTrust[id]||1}</p></div>`;}).join(''):'<p class="muted">No one has joined yet. Your first crossroads offers different companions.</p>'}<div class="section-title">PEOPLE YOU HAVEN’T MET</div><div class="list-card"><p>${6-run.allies.length} potential allies remain in other routes or later chapters. Different playthroughs can begin with different people.</p></div>`;}
function inventoryPanel(){if(!run)return '<p class="muted">Begin a run to unlock the survival kit.</p>';return `<div class="info-grid">${statTile('Medkits','×'+run.medkits)}${statTile('Rations','×'+run.rations)}${statTile('Scrap','×'+run.scrap)}${statTile('Echo Shards','×'+meta.echoes)}</div><button class="secondary" style="width:100%" data-action="panel" data-tab="gear">⚒ CRAFT & EQUIP GEAR</button><div class="section-title">HOW RESOURCES WORK</div><div class="list-card"><strong>✚ Medkits</strong><p>Restore 32 Health in battle. Lifekeepers restore 44. Medkits consume your action, so watch enemy telegraphs.</p></div><div class="list-card"><strong>▱ Rations and Scrap</strong><p>Rations and scrap influence story decisions, supply outcomes, and infrastructure. A route can sometimes consume more than you have, leaving a shortage behind.</p></div><div class="list-card"><strong>✧ Focus</strong><p>Fuel for your class skill. Guard restores 1 Focus and winning a battle restores 2.</p></div><p class="muted small">Story flags such as the tower key, archive ledger, radio transmitter and second shelter appear in the Journal and affect which conclusions unlock.</p>`;}
function talentsPanel(){if(!run)return '<p class="muted">Begin a run to develop class talents.</p>';return `<div class="system-card"><div class="eyebrow">[ TALENT DEVELOPMENT ]</div><p><b>${run.talentPoints} POINT${run.talentPoints!==1?'S':''} AVAILABLE.</b> Earn one point whenever you level up. Talents last this run; Echo perks last between runs.</p></div>${Object.entries(TALENTS).map(([id,t])=>`<div class="shop-item"><div><strong>${esc(t.name)} <span class="tag">${run.talents[id]||0}/${t.max}</span></strong><p>${esc(t.description)}</p></div><button class="ghost-btn" data-talent="${id}" ${!run.talentPoints||(run.talents[id]||0)>=t.max?'disabled':''}>+ APPLY</button></div>`).join('')}`;}
function legacyPanel(){return `<div class="system-card"><div class="eyebrow">[ THE WORLD REMEMBERS ]</div><p>Complete the 72-hour story to record an ending and collect Echo Shards. On future runs, violet ECHO choices appear at key moments and new locations open. Echo upgrades are permanent on this browser.</p></div><div class="info-grid">${statTile('Completed Runs',meta.clears)}${statTile('Distinct Endings',meta.endings.length+'/'+totalEndings())}${statTile('Echo Shards',meta.echoes)}${statTile('Lost Runs',meta.deaths)}</div><div class="section-title">PERMANENT ECHO UPGRADES</div>${Object.entries(LEGACY).map(([id,p])=>`<div class="shop-item"><div><strong>${esc(p.name)} <span class="tag">${meta.perks[id]||0}/${p.max}</span></strong><p>${esc(p.desc)}</p></div><button class="ghost-btn" data-perk="${id}" ${meta.echoes<p.cost||(meta.perks[id]||0)>=p.max?'disabled':''}>${p.cost} ✧</button></div>`).join('')}<div class="section-title">ENDING ARCHIVE — ${meta.endings.length} / ${totalEndings()}</div>${Object.entries(ENDINGS).filter(([id])=>id!=='fallen').map(([id,e],i)=>{const unlocked=meta.endings.includes(id);return `<div class="list-card"><strong>${unlocked?'✦ '+esc(e.name):'◈ ENDING '+String(i+1).padStart(2,'0')+' — ???'} <span class="tag">${unlocked?esc(e.type):'UNDISCOVERED'}</span></strong><p>${unlocked?esc(e.grade):'A different chain of decisions can reveal this future.'}</p></div>`;}).join('')}<div class="section-title">ACHIEVEMENTS — ${meta.achievements.length}</div>${meta.achievements.length?meta.achievements.map(x=>`<span class="pill">✦ ${esc(x)}</span>`).join(''):'<p class="muted small">First achievement unlocks when you awaken your class.</p>'}`;}
function guidePanel(){return `<div class="system-card"><div class="eyebrow">[ FIELD GUIDE: 72 HOURS ]</div><p>Read a scene, tap one decision, and live with the result. Branches change your allies, resources, relationships, unlocked scenes, battles, and available endings. It is not possible to see everything in one playthrough.</p></div>${[
 ['DIRECTOR’S CUT SYSTEMS','Gather scrap, craft equipment, invest in Haven-12 infrastructure, earn faction trust, and complete class-specific missions. These choices change ending availability and the epilogue.'],
 ['ACT I — Hours 0–24','Explore the original first-night branches or commit to one of four major multi-scene rescue, medicine, signal, or defense campaigns beginning at Hour 13.'],
 ['ACT II — Hours 24–52','Deep operations expand across the rail tunnel, quarantine ward, erased archive, and two-front siege. Return to the same story or change campaigns entirely.'],
 ['ACT III — Hours 52–72','Four culminating operations introduce new final crises, more combat, new endings, and continuation choices earned through a three-day commitment.'],
 ['COMBAT','Attack for physical damage; use class skills with Focus; guard against heavy telegraphed strikes; heal or retreat if you must. Level-ups award talent points.'],
 ['NEW GAME+','A completed ending records a persistent memory. Next time, extra violet ECHO options appear. Additional secrets require several distinct endings and finding the right clues.'],
 ['SAVES AND PRIVACY','Autosaves use localStorage on this device and this specific site address. No login, tracking, backend, external scripts, or network API. Use export/import to move saves across devices.']
 ].map(([h,p])=>`<div class="list-card"><strong>${h}</strong><p>${p}</p></div>`).join('')}`;}
function settingsPanel(){return `<div class="list-card"><strong>ACCESSIBILITY & GAME FEEL</strong><p>Controls support touch, keyboard, and screen readers. Motion-reduction settings on your device are respected automatically.</p></div><div class="shop-item"><div><strong>Interface Sound</strong><p>Short locally synthesized button sound.</p></div><button class="ghost-btn" data-setting="sound">${meta.settings.sound?'ON':'OFF'}</button></div><div class="shop-item"><div><strong>Vibration</strong><p>Small feedback on supported devices.</p></div><button class="ghost-btn" data-setting="haptics">${meta.settings.haptics?'ON':'OFF'}</button></div><div class="section-title">SAVE MANAGEMENT</div><div class="home-actions"><button class="secondary" data-action="export">↓ EXPORT SAVE FILE</button><button class="secondary" data-action="import">↑ IMPORT SAVE FILE</button><button class="secondary" data-action="home">⌂ RETURN TO TITLE</button><button class="danger-button" data-action="deleteRun">DELETE ACTIVE RUN</button></div><input type="file" id="importFile" class="hidden" accept=".json,application/json"><p class="muted small">Export includes your local run and persistent legacy. The downloaded file can be imported in another browser. Resetting a run does not erase unlocked endings.</p><div class="line"></div><button class="danger-button" data-action="resetAll" style="width:100%">RESET ALL PROGRESS (PERMANENT)</button><div class="shop-item"><div><strong>Large Reading Text</strong><p>Increase narrative and choice sizes.</p></div><button class="ghost-btn" data-setting="largeText">${meta.settings.largeText?'ON':'OFF'}</button></div><div class="shop-item"><div><strong>High Contrast</strong><p>Increase edge contrast for legibility.</p></div><button class="ghost-btn" data-setting="highContrast">${meta.settings.highContrast?'ON':'OFF'}</button></div><p class="footer-note">Systemfall v${VERSION} • Static hosting; all gameplay is local. For offline use, save the complete game folder on your device.</p>`;}
function renderModal(){if(!modal){$('modalRoot').innerHTML='';return;}let html='';
 if(modal==='new')html=newGamePanel();else{
   const title=Object.fromEntries(tabs)[activeTab]||'Menu';
   html=modalHeader(title);
   html+=({journal:journalPanel,chronicles:chroniclesPanel,status:statusPanel,party:partyPanel,haven:havenPanel,gear:gearPanel,factions:factionsPanel,codex:codexPanel,inventory:inventoryPanel,talents:talentsPanel,legacy:legacyPanel,guide:guidePanel,settings:settingsPanel}[activeTab]||guidePanel)();
 }
 $('modalRoot').innerHTML=`<div class="overlay" id="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(modal==='new'?'New game':activeTab)}">${html}</section></div>`;
}
function returnHome(){screen='home';closeModal(false);render();window.scrollTo(0,0);}
function downloadSave(){const json=JSON.stringify({game:'SYSTEMFALL_DAY_ONE',version:VERSION,meta,run},null,2);const blob=new Blob([json],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='systemfall-day-one-save.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Save file exported.');}
async function importSave(file){try{
 const raw=await file.text();if(raw.length>2000000)throw Error('File too large');const data=JSON.parse(raw);
 if(data.game!=='SYSTEMFALL_DAY_ONE'||!data.meta||typeof data.meta!=='object')throw Error('Not a Systemfall save file');
 if(data.run&&(!SCENES[data.run.scene]||!['story','battle','ending'].includes(data.run.mode)))throw Error('Save references an unknown story scene');
 if(!Array.isArray(data.meta.endings))throw Error('Invalid ending archive');
 if(!Number.isFinite(data.meta.clears)||data.meta.clears<0)throw Error('Invalid completion count');
 meta={...freshMeta(),...data.meta,settings:{...freshMeta().settings,...(data.meta.settings||{})},perks:{...(data.meta.perks||{})}};
 run=data.run||null;if(run)normalizeRun(run);screen=run?'game':'home';save();closeModal(false);render();toast('Save successfully imported.');
 }catch(e){toast('Import failed: '+e.message);}}
function action(name,el){
 if(name==='menu'){openModal('settings');return;}
 if(name==='panel'){modal=el.dataset.tab||'journal';activeTab=modal;renderModal();return;}
 if(name==='close'){closeModal();return;}
 if(name==='home'){returnHome();return;}
 if(name==='continue'){if(!run){toast('No active run.');return;}screen='game';closeModal(false);render();window.scrollTo(0,0);return;}
 if(name==='new'){pendingName=run?.name||'Rook';openModal('new');return;}
 if(name==='launch'){
   const inp=$('survivorName');pendingName=inp?inp.value:'Rook';selectedDifficulty=$('difficulty')?.value||'survivor';
   if(run&&run.mode!=='ending'&&!confirm('Start a fresh run? The current active run will be replaced. Your permanent unlocks stay.'))return;
   screen='game';closeModal(false);newRun(pendingName,selectedOrigin,selectedDifficulty);return;
 }
 if(name==='export'){downloadSave();return;}
 if(name==='import'){$('importFile')?.click();return;}
 if(name==='deleteRun'){
   if(!run){toast('No run to delete.');return;}
   if(confirm('Delete your current run? Permanent endings, shards and upgrades remain.')){run=null;save();returnHome();toast('Active run deleted.');}return;
 }
 if(name==='resetAll'){
   if(confirm('PERMANENT RESET: Delete every ending, every Echo Shard, and the active run? This cannot be undone.')){
      if(confirm('Confirm final reset of ALL Systemfall progress?')){meta=freshMeta();run=null;save();returnHome();toast('All progress reset.');}
   }return;
 }
}
document.addEventListener('click',event=>{
 const choice=event.target.closest('[data-choice]');if(choice){resolveChoice(Number(choice.dataset.choice));return;}
 const selectedClass=event.target.closest('[data-class]');if(selectedClass){selectClass(selectedClass.dataset.class);return;}
 const battle=event.target.closest('[data-battle]');if(battle){sfx();haptic();battleAction(battle.dataset.battle);return;}
 const origin=event.target.closest('[data-origin]');if(origin){pendingName=$('survivorName')?.value||pendingName;selectedDifficulty=$('difficulty')?.value||selectedDifficulty;selectedOrigin=origin.dataset.origin;renderModal();return;}
 const talent=event.target.closest('[data-talent]');if(talent){learnTalent(talent.dataset.talent);return;}
 const perk=event.target.closest('[data-perk]');if(perk){buyPerk(perk.dataset.perk);return;}
 const project=event.target.closest('[data-project]');if(project){buildProject(project.dataset.project);return;}
 const craft=event.target.closest('[data-craft]');if(craft){craftItem(craft.dataset.craft);return;}
 const equip=event.target.closest('[data-equip]');if(equip){equipItem(equip.dataset.equip);return;}
 const setting=event.target.closest('[data-setting]');if(setting){const name=setting.dataset.setting;meta.settings[name]=!meta.settings[name];save();renderModal();render();return;}
 const a=event.target.closest('[data-action]');if(a){action(a.dataset.action,a);return;}
 if(event.target.id==='overlay')closeModal();
});
document.addEventListener('input',event=>{if(event.target.id==='survivorName')pendingName=event.target.value;});
document.addEventListener('change',event=>{if(event.target.id==='importFile'&&event.target.files?.[0])importSave(event.target.files[0]);if(event.target.id==='difficulty')selectedDifficulty=event.target.value;});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modal)closeModal();});
// Diagnostics available in devtools, never needed by players.
if(run)normalizeRun(run);
window.SYSTEMFALL_DEBUG=Object.freeze({version:VERSION,sceneCount:Object.keys(SCENES).length,endingCount:Object.keys(ENDINGS).length-1,chronicles:Object.keys(CHRONICLE_ROUTES).length,validate(){const missing=[];for(const [id,s] of Object.entries(SCENES))for(const c of s.choices){for(const x of [c.to,c.win,c.flee,c.check?.win,c.check?.lose])if(x&&!SCENES[x])missing.push(id+' -> '+x);if(c.end&&!ENDINGS[c.end])missing.push(id+' ending -> '+c.end);}return missing;}});
render();

</script>
</body>
</html>
